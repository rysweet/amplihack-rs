[env]
GIT_TERMINAL_PROMPT = { value = "0", force = true }
GIT_ASKPASS = { value = "true", force = true }
SSH_ASKPASS = { value = "true", force = true }
# Tests build fixtures in the temp directory and walk its ancestors looking
# for `.claude`, `amplifier-bundle` or the real `~/.amplihack`. An amplihack
# session points TMPDIR inside `~/.amplihack`, so those walks found the real
# install and the tests failed only when run from a session (PR #1885).
TMPDIR = { value = "/tmp", force = true }
