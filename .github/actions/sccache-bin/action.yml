name: sccache binary from the Actions cache
description: >-
  Gets the pinned sccache v0.19.0 binary from the Actions cache (phase
  restore), and after a miss either saves the binary that Setup sccache
  downloaded or turns RUSTC_WRAPPER off with one warning (phase finish), so no
  job depends on the download (issue #2105). The logic and the pinned hashes
  are in .github/scripts/sccache-bin.sh; see "sccache binary" in
  docs/reference/ci-pipeline.md.
inputs:
  phase:
    description: restore (before Setup sccache) or finish (after it).
    required: true
  hit:
    description: The restore phase's hit output; finish does nothing when 'true'.
    required: false
    default: 'false'
  simulate-missing:
    description: "'true' skips the cache and takes the fallback path (testing)."
    required: false
    default: 'false'
outputs:
  hit:
    description: "'true' when a verified binary was restored and put on PATH."
    value: ${{ steps.check.outputs.hit }}
runs:
  using: composite
  steps:
    - if: inputs.phase == 'restore' && inputs.simulate-missing != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/sccache-bin
        key: sccache-bin-v0.19.0-${{ runner.os }}-${{ runner.arch }}
    - id: check
      if: inputs.phase == 'restore'
      shell: bash
      env:
        BIN_DIR: ${{ runner.temp }}/sccache-bin
        KEY_OSARCH: ${{ runner.os }}-${{ runner.arch }}
        SIMULATE: ${{ inputs.simulate-missing }}
      run: bash "${{ github.action_path }}/../../scripts/sccache-bin.sh" restore
    - id: fin
      if: inputs.phase == 'finish' && inputs.hit != 'true'
      shell: bash
      env:
        BIN_DIR: ${{ runner.temp }}/sccache-bin
        KEY_OSARCH: ${{ runner.os }}-${{ runner.arch }}
        SIMULATE: ${{ inputs.simulate-missing }}
      run: bash "${{ github.action_path }}/../../scripts/sccache-bin.sh" finish
    # A parallel job may already have saved this key; that is not a failure.
    - if: steps.fin.outputs.save == 'true'
      continue-on-error: true
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/sccache-bin
        key: sccache-bin-v0.19.0-${{ runner.os }}-${{ runner.arch }}
