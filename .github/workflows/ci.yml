name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Run the required checks inside a GitHub merge queue batch (when enabled in
  # branch protection) so approved PRs are validated together instead of each
  # forcing its own full serial CI cycle under strict "up-to-date" mode.
  merge_group:

# Least-privilege default: every job gets a read-only token unless it opts up.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # SPIKE (#1052 follow-up): compiled-artifact caching via sccache with the
      # GitHub Actions cache backend. Unlike restoring the whole target/ dir
      # (which exhausted runner disk, hence cache-targets: false), sccache stores
      # compact per-compilation-unit outputs and fetches on demand, keeping peak
      # disk low. Goal: cut the ~16 min from-scratch clippy compile on warm runs.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify cxx-build pin
        run: |
          version=$(grep -A1 'name = "cxx-build"' Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$version" != "1.0.138" ]; then
            echo "ERROR: cxx-build must be pinned to 1.0.138, found $version"
            echo "Run: cargo update -p cxx-build --precise 1.0.138"
            exit 1
          fi
      - name: Recipes — no bare python invocations (issue #248)
        run: scripts/check-recipes-no-python.sh
      - name: Repository — no tracked Python assets
        run: scripts/check-no-python-assets.sh
      - name: Skills — no missing legacy Python helpers
        run: scripts/check-skills-no-missing-helpers.sh
      - name: Toolchain refs — cross-target steps pinned to channel (issue #935)
        run: scripts/check-toolchain-refs.sh
      - name: Branch-protection guard — strict-mode script logic (issue #1095)
        shell: bash
        run: bash tests/issue_1095_branch_protection_guard_test.sh
      - name: Migrate skill — ~/.simard not bundled by default (issue #1166)
        shell: bash
        run: bash tests/issue_1166_migrate_simard_not_bundled.sh
      - name: Recipes — no stale Python tool references (bug #666)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-666-stale-python-refs.sh
      - name: Recipes — worktrees are never created inside worktrees (issue #1134)
        shell: bash
        run: bash tests/issue_1134_nested_worktree_test.sh
      - name: Terminal state — agentic adjudication, no rubber stamp (issue #1268)
        shell: bash
        run: bash tests/issue_1268_terminal_state_adjudication.sh
      - name: Migrate skill — refuses the host it is running on (issue #1167)
        shell: bash
        run: bash tests/issue_1167_migrate_same_host_guard.sh
      - name: Workflows — PR runs must not cancel each other (issue #1372)
        shell: bash
        run: bash tests/issue_1372_pr_workflows_scope_concurrency.sh
      - name: Worktree — refuse a repo with no origin remote (issue #1323)
        shell: bash
        run: bash tests/issue_1323_multirepo_origin_precondition.sh
      - name: Recipes — every committing recipe prepares its identity (issue #1394)
        shell: bash
        run: bash tests/recipe_commit_identity_static_test.sh
      - name: Invisible-char scan — stays dependency-free (issue #1397)
        shell: bash
        run: bash tests/issue_1397_invisible_scan_stays_dependency_free.sh
      - name: Skill docs — BLOCKED-path steps exist (issue #1255)
        shell: bash
        run: bash tests/issue_1255_blocked_path_steps_exist.sh
      - name: Publish — a push must land the tested commit (issue #1269)
        shell: bash
        run: bash tests/issue_1269_verify_pushed_ref.sh
      - name: Identity — the acting account is verified before any work (issue #1290)
        shell: bash
        run: bash tests/issue_1290_identity_preflight.sh
      - name: Docs — launch-target frozen contract matches the code (issue #1274)
        shell: bash
        run: bash tests/issue_1274_launch_target_contract_matches_code.sh
      - name: Duplicate PRs — an issue already claimed is not started again (issue #1361)
        shell: bash
        run: bash tests/issue_1361_duplicate_pr_claim_check.sh
      - name: Git subprocesses — no unsanitised Command::new("git") (issue #1278)
        run: scripts/check-git-command-sanitised.sh
      - name: Git env isolation — hooks scrub GIT_DIR and friends (issue #1278)
        shell: bash
        run: |
          # Twice, deliberately. A clean run is what CI naturally provides, and
          # it is exactly the run that cannot see an environment-leak bug: this
          # test's own fixtures were once hijacked by the leak it describes
          # (`git init <path>` honours an ambient GIT_DIR and ignores its path
          # argument), and CI stayed green throughout. The second run supplies
          # the environment git actually hands a hook.
          bash tests/issue_1278_git_env_isolation.sh
          decoy="$(mktemp -d)/decoy"
          git init --quiet "$decoy"
          GIT_DIR="$decoy/.git" \
          GIT_WORK_TREE="$decoy" \
          GIT_INDEX_FILE="$decoy/.git/index" \
          GIT_PREFIX="" \
            bash tests/issue_1278_git_env_isolation.sh
      - name: Recipes — PR always opens after successful push (issue #495)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-pr-always-opens.sh
      - name: Recipes — existing open PR makes step-16 idempotent (issue #1060)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1060-existing-pr-is-idempotent.sh
      - name: Recipes — best-effort PR labels from WORKFLOW_PR_LABELS
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-pr-labels-best-effort.sh
      - name: Recipes — static guard validation scope (issue #495)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-static-guard-validation-scope.sh
      - name: Recipes — graceful degradation for missing runtime-artifact helper (issue #829)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-829-graceful-degradation.sh
      - name: Recipes — git-identity helper fallback resolution (issue #955)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-955-git-identity-fallback.sh
      - name: Recipes — doc-review failure is non-fatal-but-reported (issue #834)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-834-doc-review-non-fatal.sh
      - name: Recipes — leak-proof, self-healing worktree setup (issue #840)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-840-worktree-leak-proof.sh
      - name: Recipes — evidence gate resolves via full ladder + no-discard (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-implementation-evidence-fallback.sh
      - name: Recipes — step-17a testing-evidence gate three-outcome contract (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-step17a-testing-evidence-gate.sh
      - name: Recipes — canonical helper resolution ladders (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-runtime-artifact-ladders.sh
      - name: Recipes — fatal allowlist preserved; bookkeeping gates degraded (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-fatal-allowlist-preserved.sh
      - name: Recipes — SKILL mirror parity + gate-policy docs (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-skill-mirror-parity.sh
      - name: Recipes — ADO work items assigned + typed + fail-loud (issue #983)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-983-azdo-work-item-assignment.sh
      - name: Recipes — no prose-only skips (issue #1334)
        shell: bash
        run: bash scripts/check-prose-only-skips.sh
      - name: Gadugi — merge-validations scenario matches shipped contract (issue #1110)
        shell: bash
        run: bash tests/gadugi/test-merge-validations-scenario-contract.sh

      - name: Recipes — foreign-worktree branch deconfliction (concurrency)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-foreign-worktree-deconflict.sh
      - name: Recipes — relative repo_path idempotent worktree setup (issue #1121)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1121-relative-repo-path.sh
      - name: Recipes — shellcheck worktree sweep helper (issue #840)
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_sweep.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_sweep.sh
          fi
      - name: Recipes — shellcheck worktree deconflict helper (concurrency)
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_deconflict.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_deconflict.sh
          fi
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: clippy, rustfmt
      # sccache must be installed before the first cargo invocation in this
      # job. RUSTC_WRAPPER is set job-wide at the top, so any cargo running
      # before this step dies with "could not execute process `sccache`". The
      # proof gate below was the first cargo call and was doing exactly that,
      # turning Lint & Format red on main and on every PR branched from it.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Proof gate — spawn-accounting decisions (issue #1329)
        run: |
          set -euo pipefail
          # Kani proves each decision function for EVERY input, where the spec gate
          # above proves the ORDERING. The two real defects in this area were one of
          # each kind, so neither gate substitutes for the other.
          cargo install --locked kani-verifier
          cargo kani setup
          ./scripts/check-proofs.sh

      - name: Spec gate — OrchLedger invariants (issue #1326)
        env:
          TLA2TOOLS_VERSION: v1.7.2
          TLA2TOOLS_SHA256: fa18543e44ed5974a85bd2c60c0dc16620ae117680ea8e693d2691999ed90b22
        run: |
          set -euo pipefail
          curl -sSLo /tmp/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA2TOOLS_SHA256}  /tmp/tla2tools.jar" | sha256sum -c -
          TLA2TOOLS_JAR=/tmp/tla2tools.jar ./scripts/check-spec.sh

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - name: Disk + sccache stats (before)
        run: df -h / && sccache --show-stats
      # --locked: fail fast on Cargo.lock drift here in the first job (rather than
      # only downstream in test/build), closing a dependency-substitution gap so
      # clippy can never silently resolve unpinned deps (#744 supply-chain).
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Disk + sccache stats (after)
        if: always()
        run: df -h / && sccache --show-stats

  test:
    name: Test
    runs-on: ubuntu-latest
    # No `needs: check` — the lint/format job compiles the whole workspace for
    # clippy (~15 min under the no-artifact-cache policy), and gating the
    # expensive Test job behind it serialized the critical path to
    # check(~15m) -> test(~35m) ≈ 50 min. Under strict "up-to-date" branch
    # protection a fast-moving main then re-queued the branch before it could
    # merge. Running Test concurrently with Lint & Format drops the critical
    # path to ~35 min. `concurrency: cancel-in-progress` still supersedes stale
    # runs; a lint failure only costs redundant Test compute, not correctness.
    timeout-minutes: 45
    env:
      # Drop debug info from the workspace's large test-binary surface (60+
      # integration [[test]] targets plus per-crate unit tests): smaller links
      # and lower peak disk. The suite asserts behavior, not backtraces (#744).
      CARGO_PROFILE_TEST_DEBUG: "0"
      # SPIKE: sccache compiled-artifact caching (GHA backend). See check job.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        # Deterministic reclaim of tens of GB, replacing the fragile hand-rolled
        # `rm -rf`. tool-cache:false keeps the Rust toolchain cache we rely on.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Install cargo-nextest
        # Prebuilt binary (no slow `cargo install`); SHA-pinned for supply chain.
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: nextest
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The full workspace test profile links large native artifacts. Restoring
          # target/ can exhaust GitHub-hosted runner disk before tests start.
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Disk + sccache stats (before)
        run: df -h / && sccache --show-stats
      # nextest: better parallelism and lower peak disk than `cargo test`.
      - run: cargo nextest run --workspace --locked
      # Issue #1278: CI is the only place this suite runs WITHOUT git's hook
      # variables set, which is exactly why the unpassable pre-push gate stayed
      # invisible for so long. Re-run the crates that spawn git with GIT_DIR and
      # friends pointed at a decoy repository, the way a real hook exports them,
      # so a regression fails here instead of only on a developer's push.
      - name: Tests under a hook's git environment (issue #1278)
        shell: bash
        run: |
          decoy="$(mktemp -d)/decoy"
          git init --quiet "$decoy"
          export GIT_DIR="$decoy/.git"
          export GIT_WORK_TREE="$decoy"
          export GIT_INDEX_FILE="$decoy/.git/index"
          export GIT_PREFIX=""
          cargo nextest run --locked \
            -p amplihack-git \
            -p amplihack-safety \
            -p amplihack-recovery \
            -p amplihack-utils
          # The decoy must be untouched: if a test still reaches through the
          # environment it lands here, not in the checkout.
          test -z "$(git --git-dir="$decoy/.git" --work-tree="$decoy" status --porcelain)" \
            || { echo "ERROR: tests wrote into the ambient GIT_DIR"; exit 1; }
      # nextest does not execute doctests; keep them so coverage is not lost.
      - run: cargo test --workspace --doc --locked
      - name: Disk + sccache stats (after)
        if: always()
        run: df -h / && sccache --show-stats

  install-smoke:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    # No `needs: check` — parallelize with Lint & Format (see Test job note).
    timeout-minutes: 30
    env:
      # This job only asserts that `cargo install` succeeds and the binary
      # launches — it neither ships nor benchmarks the artifact. The workspace's
      # release profile (lto = true, codegen-units = 1) is the slowest-to-build
      # configuration and exists purely to optimize *shipped* binaries, so we
      # override it here for a much faster, behaviorally-identical smoke build.
      # Release artifacts come from the cross-compile/release jobs, which keep
      # full optimization (#744).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # SPIKE: sccache compiled-artifact caching (GHA backend). See check job.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Reuse the dependency-source cache namespace the native x86_64-linux
          # build in cross-compile populates. With cache-targets disabled only
          # the registry/git *source* cache is shared (not compiled artifacts),
          # so this saves re-downloading crates rather than re-linking them.
          key: x86_64-unknown-linux-gnu
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install from local checkout
        run: cargo install --path bins/amplihack --locked
      - name: Verify binary
        run: |
          amplihack --version
          amplihack --help
          amplihack recipe list || true

  cross-compile:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # No `needs: check` — parallelize with Lint & Format (see Test job note).
    timeout-minutes: 45
    env:
      # PR/branch runs only *verify* that each target compiles; the optimized
      # binaries are shipped exclusively by the `release` job on tag pushes.
      # Full-optimization release builds (lto = true, codegen-units = 1) are the
      # slowest configuration to compile, so disable them for non-tag runs to
      # cut build wall-clock substantially. Tag builds keep full optimization so
      # shipped artifacts are unchanged.
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}
      # SPIKE: sccache compiled-artifact caching (GHA backend). See check job.
      # All matrix entries build natively (cross: false), so RUSTC_WRAPPER wraps
      # the host rustc directly; sccache keys already include the target triple.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            gnu_cross_toolchain: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            gnu_cross_toolchain: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            gnu_cross_toolchain: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            gnu_cross_toolchain: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      # Install cross when a target really needs the container image
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Native build
      - name: Build (native)
        if: "!matrix.cross"
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p amplihack -p amplihack-hooks-bin
          --features amplihack-hooks-bin/signal

      # Cross build (Linux ARM64)
      - name: Build (cross)
        if: matrix.cross
        run: >
          cross build --release --locked --target ${{ matrix.target }}
          -p amplihack -p amplihack-hooks-bin
          --features amplihack-hooks-bin/signal

      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amplihack-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/amplihack
            target/${{ matrix.target }}/release/amplihack-hooks
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross-compile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Package binaries
        run: |
          cd artifacts
          for dir in amplihack-*; do
            target="${dir#amplihack-}"
            mkdir -p "../dist/${dir}"
            find "$dir" -type f \( -name amplihack -o -name amplihack-hooks \) -exec cp {} "../dist/${dir}/" \;
            test -f "../dist/${dir}/amplihack"
            test -f "../dist/${dir}/amplihack-hooks"
            tar czf "../${dir}.tar.gz" -C "../dist/${dir}" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: amplihack-*.tar.gz
          generate_release_notes: true
