name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Run the required checks inside a GitHub merge queue batch (when enabled in
  # branch protection) so approved PRs are validated together instead of each
  # forcing its own full serial CI cycle under strict "up-to-date" mode.
  merge_group:
  # Mondays and Thursdays, so no gap between runs reaches seven days.
  #
  # GitHub deletes an Actions cache that has not been read for 7 days. This
  # repository went 19 days without a run (3 to 22 September), every cache was
  # deleted, and the next pull request paid for all of it: Lint & Format went
  # from 10 minutes to over 25, Test from 15 to 28, each Build from 6 to 17,
  # Install Smoke from 7 to 18. sccache reported 0 hits against 1752 misses,
  # where a warm run reports 88.91%. None of that was caused by the pull
  # request that paid for it.
  #
  # The same 19 days hid two external breakages until a contributor found them:
  # kani 0.68.0 (16 Sep) crashed the proof gate, and RUSTSEC-2026-0285 (14 Sep)
  # failed the sibling repository's audit. A run every few days keeps the caches
  # alive and finds that kind of drift against main, where it belongs.
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

# Least-privilege default: every job gets a read-only token unless it opts up.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # github.event_name is in the key so a scheduled run and a push run on main do
  # not share a group. Without it the 06:00 schedule could cancel the CI run for
  # a merge that was already in flight, and a cancelled run reports as a failed
  # required check (issue #1372). github.ref stays in the key, which is what
  # keeps open pull requests from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    # actions: read lets the sccache composite actions list cache entries to
    # tell a rate-limited restore or save from a real miss.
    permissions:
      contents: read
      actions: read
    env:
      # Compiled-artifact caching via sccache (#1052 follow-up). Unlike
      # restoring the whole target/ dir (which exhausted runner disk, hence
      # cache-targets: false), sccache stores compact per-compilation-unit
      # outputs, keeping peak disk low.
      #
      # sccache uses its local disk cache, and the "Restore sccache disk cache"
      # and "Save sccache disk cache" steps carry that directory between runs
      # as one Actions cache entry per job. It used to talk to the Actions cache
      # service directly (SCCACHE_GHA_ENABLED), one API call per object read
      # and per object written. One CI run's seven jobs make thousands of those
      # calls in the first minutes, and the service answers HTTP 429 "rate limit
      # exceeded": 219 of 506 writes in one Test job failed that way, and 487
      # reads did too, which sccache counts as plain misses and recompiles.
      RUSTC_WRAPPER: sccache
      # Caps each job's local directory, and so its Actions cache entry. The
      # budget: 11 key prefixes (7 here, 4 in release.yml), and the prune job
      # keeps the newest 2 of each, so up to 22 entries, a 22 GB ceiling at
      # the cap. At the measured cold sizes (270-665 MB per job here, similar
      # for release) one generation is about 4 GB and two about 8 GB, before
      # rust-cache's ~1.3 GB, which is close to the repository's 10 GB limit.
      # Under pressure GitHub evicts least-recently-used entries first, which
      # is the older entry of each pair: restores always take the newest.
      SCCACHE_CACHE_SIZE: "1G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify cxx-build pin
        run: |
          version=$(grep -A1 'name = "cxx-build"' Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$version" != "1.0.138" ]; then
            echo "ERROR: cxx-build must be pinned to 1.0.138, found $version"
            echo "Run: cargo update -p cxx-build --precise 1.0.138"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: clippy, rustfmt
      # sccache must be installed before the first cargo invocation in this
      # job. RUSTC_WRAPPER is set job-wide at the top, so any cargo running
      # before this step dies with "could not execute process `sccache`". So the
      # toolchain, sccache and the registry cache come before the first gate that
      # builds, after only the cxx-build pin check (which needs no toolchain and
      # fails fast). The recipe gates below build the amplihack binary; when they
      # ran before this step they had to build it with RUSTC_WRAPPER='' --
      # uncached, about 17 minutes of this job on every run.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # sccache's disk cache travels as one Actions cache entry per job (and
      # target); see .github/actions/sccache-restore. Only main saves, so pull
      # requests start from main's entry and add none of their own.
      - name: Restore sccache disk cache
        uses: ./.github/actions/sccache-restore
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Recipes — no bare python invocations (issue #248)
        run: scripts/check-recipes-no-python.sh
      - name: Repository — no tracked Python assets
        run: scripts/check-no-python-assets.sh
      - name: Skills — no missing legacy Python helpers
        run: scripts/check-skills-no-missing-helpers.sh
      - name: Toolchain refs — cross-target steps pinned to channel (issue #935)
        run: scripts/check-toolchain-refs.sh
      - name: Branch-protection guard — strict-mode script logic (issue #1095)
        shell: bash
        run: bash tests/issue_1095_branch_protection_guard_test.sh
      - name: Migrate skill — ~/.simard not bundled by default (issue #1166)
        shell: bash
        run: bash tests/issue_1166_migrate_simard_not_bundled.sh
      - name: Recipes — no stale Python tool references (bug #666)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-666-stale-python-refs.sh
      - name: Recipes — worktrees are never created inside worktrees (issue #1134)
        shell: bash
        run: bash tests/issue_1134_nested_worktree_test.sh
      - name: Terminal state — agentic adjudication, no rubber stamp (issue #1268)
        shell: bash
        run: bash tests/issue_1268_terminal_state_adjudication.sh
      - name: Migrate skill — refuses the host it is running on (issue #1167)
        shell: bash
        run: bash tests/issue_1167_migrate_same_host_guard.sh
      - name: Migrate skill — a default-guess agent binary is not an instruction (issue #1481)
        shell: bash
        run: bash tests/issue_1481_migrate_detect_cli_default_tag.sh
      - name: Migrate skill — detect_cli agrees with the Rust resolver (issue #1525)
        shell: bash
        run: bash tests/issue_1525_migrate_detect_cli_parity.sh
      - name: Shipped docs — a detached recipe run carries the agent-binary hand-off, double-quoted (issue #1525)
        shell: bash
        run: bash tests/issue_1525_detached_launch_docs_carry_hand_off.sh
      - name: Shipped shell — bash 3.2 portable, no bash-4-only constructs (issue #1423)
        shell: bash
        run: bash tests/issue_1423_bash4_constructs.sh
      - name: Workflows — PR runs must not cancel each other (issue #1372)
        shell: bash
        run: bash tests/issue_1372_pr_workflows_scope_concurrency.sh
      - name: CI scripts — no early-exit pipeline stage (issue #1434)
        shell: bash
        run: bash tests/issue_1434_no_early_exit_pipelines.sh
      - name: Worktree — refuse a repo with no origin remote (issue #1323)
        shell: bash
        run: bash tests/issue_1323_multirepo_origin_precondition.sh
      - name: Install docs — every documented path installs a real binary (issue #1412)
        shell: bash
        run: bash tests/issue_1412_install_docs_name_a_real_package.sh
      - name: Recipes — every committing recipe prepares its identity (issue #1394)
        shell: bash
        run: bash tests/recipe_commit_identity_static_test.sh
      - name: Invisible-char scan — stays dependency-free (issue #1397)
        shell: bash
        run: bash tests/issue_1397_invisible_scan_stays_dependency_free.sh
      - name: External LiteLLM deployment fixture (issue #1413)
        shell: bash
        run: bash tests/issue_1413_external_litellm_gateway.sh
      - name: Pre-commit build cache — off /tmp, reclaimed, legible when full (issue #1440)
        shell: bash
        run: bash tests/issue_1440_precommit_cache_location.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Record Node.js test toolchain
        run: |
          node --version
          npm --version
      - name: Skill docs — BLOCKED-path steps exist (issue #1255)
        shell: bash
        run: bash tests/issue_1255_blocked_path_steps_exist.sh
      - name: Publish — a push must land the tested commit (issue #1269)
        shell: bash
        run: bash tests/issue_1269_verify_pushed_ref.sh
      - name: Worktree path — every execution site is fail-loud (issue #413)
        shell: bash
        run: bash tests/issue_413_fail_loud_worktree.sh
      - name: Phase bricks — fail-loud worktree path (issue #414)
        shell: bash
        run: bash tests/issue_414_fail_loud_phase_bricks.sh
      - name: Runtime artifacts — helper resolution never fails silently (issue #817)
        shell: bash
        run: bash tests/issue_817_runtime_artifact_resolution.sh
      - name: Identity — the acting account is verified before any work (issue #1290)
        shell: bash
        run: bash tests/issue_1290_identity_preflight.sh
      - name: Docs — launch-target frozen contract matches the code (issue #1274)
        shell: bash
        run: bash tests/issue_1274_launch_target_contract_matches_code.sh
      - name: Duplicate PRs — an issue already claimed is not started again (issue #1361)
        shell: bash
        run: bash tests/issue_1361_duplicate_pr_claim_check.sh
      - name: Tests — one environment lock per crate, in test_support (issue #1380)
        shell: bash
        run: bash tests/issue_1380_single_env_lock.sh
      - name: Claim check — working on an issue's own PR is not racing it (issue #1448)
        shell: bash
        run: bash tests/issue_1448_review_is_not_a_duplicate.sh
      - name: Branch names — from the branch or the issue, never task prose (issue #1426)
        shell: bash
        run: bash tests/issue_1426_branch_name_not_prose.sh
      - name: Git subprocesses — no unsanitised Command::new("git") (issue #1278)
        run: scripts/check-git-command-sanitised.sh
      - name: Git env isolation — hooks scrub GIT_DIR and friends (issue #1278)
        shell: bash
        run: |
          # Twice, deliberately. A clean run is what CI naturally provides, and
          # it is exactly the run that cannot see an environment-leak bug: this
          # test's own fixtures were once hijacked by the leak it describes
          # (`git init <path>` honours an ambient GIT_DIR and ignores its path
          # argument), and CI stayed green throughout. The second run supplies
          # the environment git actually hands a hook.
          bash tests/issue_1278_git_env_isolation.sh
          decoy="$(mktemp -d)/decoy"
          git init --quiet "$decoy"
          GIT_DIR="$decoy/.git" \
          GIT_WORK_TREE="$decoy" \
          GIT_INDEX_FILE="$decoy/.git/index" \
          GIT_PREFIX="" \
            bash tests/issue_1278_git_env_isolation.sh
      - name: Recipes — PR always opens after successful push (issue #495)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-pr-always-opens.sh
      - name: Recipes — existing open PR makes step-16 idempotent (issue #1060)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1060-existing-pr-is-idempotent.sh
      - name: Recipes — best-effort PR labels from WORKFLOW_PR_LABELS
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-pr-labels-best-effort.sh
      - name: Recipes — PR field arrays reload, not accumulate (issue #1423)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-pr-field-arrays-reload.sh
      - name: Recipes — static guard validation scope (issue #495)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-static-guard-validation-scope.sh
      - name: Recipes — graceful degradation for missing runtime-artifact helper (issue #829)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-829-graceful-degradation.sh
      - name: Recipes — git-identity helper fallback resolution (issue #955)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-955-git-identity-fallback.sh
      - name: Recipes — doc-review failure is non-fatal-but-reported (issue #834)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-bug-834-doc-review-non-fatal.sh
      - name: Recipes — leak-proof, self-healing worktree setup (issue #840)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-840-worktree-leak-proof.sh
      - name: Recipes — cleanup never deletes other runs' or uncommitted worktrees (issues #1494, #1560)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1494-1560-worktree-safety.sh
      - name: Recipes — re-run never destroys an existing worktree's work (issue #1565)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash amplifier-bundle/recipes/tests/test-issue-1565-rerun-preserves-dirty-worktree.sh
      - name: Recipes — evidence gate resolves via full ladder + no-discard (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-implementation-evidence-fallback.sh
      - name: Recipes — step-17a testing-evidence gate three-outcome contract (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-step17a-testing-evidence-gate.sh
      - name: Recipes — canonical helper resolution ladders (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-runtime-artifact-ladders.sh
      - name: Recipes — auto-drive QA evidence record is valid JSON (issue #1531)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1531-qa-evidence-json.sh
      - name: Recipes — fatal allowlist preserved; bookkeeping gates degraded (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-fatal-allowlist-preserved.sh
      - name: Recipes — SKILL mirror parity + gate-policy docs (issue #962)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-962-skill-mirror-parity.sh
      - name: Recipes — ADO work items assigned + typed + fail-loud (issue #983)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-983-azdo-work-item-assignment.sh
      - name: Recipes — no prose-only skips (issue #1334)
        shell: bash
        run: bash scripts/check-prose-only-skips.sh
      - name: Gadugi — merge-validations scenario matches shipped contract (issue #1110)
        shell: bash
        run: bash tests/gadugi/test-merge-validations-scenario-contract.sh

      - name: Recipes — foreign-worktree branch deconfliction (concurrency)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-foreign-worktree-deconflict.sh
      - name: Recipes — relative repo_path idempotent worktree setup (issue #1121)
        shell: bash
        run: bash amplifier-bundle/recipes/tests/test-issue-1121-relative-repo-path.sh
      - name: Recipes — shellcheck worktree sweep helper (issue #840)
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_sweep.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_sweep.sh
          fi
      - name: Recipes — shellcheck worktree deconflict helper (concurrency)
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_deconflict.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck -S warning amplifier-bundle/tools/workflow_worktree_deconflict.sh
          fi
      - name: Plugin — shellcheck claude-plugin/bin
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -s sh -S style claude-plugin/bin/*
      - name: Proof gate — spawn-accounting decisions (issue #1329)
        run: |
          set -euo pipefail
          # Kani proves each decision function for EVERY input, where the spec gate
          # above proves the ORDERING. The two real defects in this area were one of
          # each kind, so neither gate substitutes for the other.
          #
          # Pin the version. `--locked` fixes the dependency graph of whichever
          # version resolves, not the version itself, so an unpinned install
          # silently adopts each new kani release. 0.68.0 (16 Sep 2026) crashes
          # with an internal compiler error while codegenning this crate --
          #   kani-compiler/src/intrinsics.rs:243: assertion failed:
          #   matches!(output.kind(), TyKind::RigidTy(RigidTy::Int(IntTy::I32)))
          # -- which turned this gate red on every branch from the day it shipped.
          # Nothing in the repository changed; the tool did. The TLA2TOOLS step
          # below already pins a version and a checksum for the same reason.
          # Revisit when a kani release above 0.68.0 compiles this crate.
          cargo install --locked kani-verifier@0.67.0
          cargo kani setup
          ./scripts/check-proofs.sh

      - name: Spec gate — OrchLedger invariants (issue #1326)
        env:
          TLA2TOOLS_VERSION: v1.7.2
          TLA2TOOLS_SHA256: fa18543e44ed5974a85bd2c60c0dc16620ae117680ea8e693d2691999ed90b22
        run: |
          set -euo pipefail
          curl -sSLo /tmp/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA2TOOLS_SHA256}  /tmp/tla2tools.jar" | sha256sum -c -
          TLA2TOOLS_JAR=/tmp/tla2tools.jar ./scripts/check-spec.sh

      - run: cargo fmt --check
      - name: Disk + sccache stats (before)
        run: df -h / && sccache --show-stats
      # --locked: fail fast on Cargo.lock drift here in the first job (rather than
      # only downstream in test/build), closing a dependency-substitution gap so
      # clippy can never silently resolve unpinned deps (#744 supply-chain).
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Disk + sccache stats (after)
        if: always()
        run: df -h / && sccache --show-stats
      - name: Save sccache disk cache
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/sccache-save
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-

  test:
    name: Test
    runs-on: ubuntu-latest
    # actions: read lets the sccache composite actions list cache entries to
    # tell a rate-limited restore or save from a real miss.
    permissions:
      contents: read
      actions: read
    # No `needs: check` — the lint/format job compiles the whole workspace for
    # clippy (~15 min under the no-artifact-cache policy), and gating the
    # expensive Test job behind it serialized the critical path to
    # check(~15m) -> test(~35m) ≈ 50 min. Under strict "up-to-date" branch
    # protection a fast-moving main then re-queued the branch before it could
    # merge. Running Test concurrently with Lint & Format drops the critical
    # path to ~35 min. `concurrency: cancel-in-progress` still supersedes stale
    # runs; a lint failure only costs redundant Test compute, not correctness.
    env:
      # Drop debug info from the workspace's large test-binary surface (the
      # `integration` binary, per-crate integration and unit tests): smaller links
      # and lower peak disk. The suite asserts behavior, not backtraces (#744).
      CARGO_PROFILE_TEST_DEBUG: "0"
      # sccache compiled-artifact caching (local disk, carried by actions/cache).
      # See check job.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "1G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        # Deterministic reclaim of tens of GB, replacing the fragile hand-rolled
        # `rm -rf`. tool-cache:false keeps the Rust toolchain cache we rely on.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Install cargo-nextest
        # Prebuilt binary (no slow `cargo install`); SHA-pinned for supply chain.
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: nextest
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # sccache's disk cache travels as one Actions cache entry per job (and
      # target); see .github/actions/sccache-restore. Only main saves, so pull
      # requests start from main's entry and add none of their own.
      - name: Restore sccache disk cache
        uses: ./.github/actions/sccache-restore
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # The full workspace test profile links large native artifacts. Restoring
          # target/ can exhaust GitHub-hosted runner disk before tests start.
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned recipe runner
        shell: bash
        run: bash scripts/install-pinned-recipe-runner.sh
      - name: Disk + sccache stats (before)
        run: df -h / && sccache --show-stats
      # nextest: better parallelism and lower peak disk than `cargo test`.
      - run: cargo nextest run --workspace --locked
      # Issue #1278: CI is the only place this suite runs WITHOUT git's hook
      # variables set, which is exactly why the unpassable pre-push gate stayed
      # invisible for so long. Re-run the crates that spawn git with GIT_DIR and
      # friends pointed at a decoy repository, the way a real hook exports them,
      # so a regression fails here instead of only on a developer's push.
      - name: Tests under a hook's git environment (issue #1278)
        shell: bash
        run: |
          decoy="$(mktemp -d)/decoy"
          git init --quiet "$decoy"
          export GIT_DIR="$decoy/.git"
          export GIT_WORK_TREE="$decoy"
          export GIT_INDEX_FILE="$decoy/.git/index"
          export GIT_PREFIX=""
          cargo nextest run --locked \
            -p amplihack-git \
            -p amplihack-safety \
            -p amplihack-recovery \
            -p amplihack-utils
          # The decoy must be untouched: if a test still reaches through the
          # environment it lands here, not in the checkout.
          test -z "$(git --git-dir="$decoy/.git" --work-tree="$decoy" status --porcelain)" \
            || { echo "ERROR: tests wrote into the ambient GIT_DIR"; exit 1; }
      # nextest does not execute doctests; keep them so coverage is not lost.
      - run: cargo test --workspace --doc --locked
      - name: Disk + sccache stats (after)
        if: always()
        run: df -h / && sccache --show-stats
      - name: Save sccache disk cache
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/sccache-save
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-

  install-smoke:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    # actions: read lets the sccache composite actions list cache entries to
    # tell a rate-limited restore or save from a real miss.
    permissions:
      contents: read
      actions: read
    # No `needs: check` — parallelize with Lint & Format (see Test job note).
    env:
      # This job only asserts that `cargo install` succeeds and the binary
      # launches — it neither ships nor benchmarks the artifact. The workspace's
      # release profile (lto = true, codegen-units = 1) is the slowest-to-build
      # configuration and exists purely to optimize *shipped* binaries, so we
      # override it here for a much faster, behaviorally-identical smoke build.
      # Release artifacts come from the cross-compile/release jobs, which keep
      # full optimization (#744).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # sccache compiled-artifact caching (local disk, carried by actions/cache).
      # See check job.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "1G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # sccache's disk cache travels as one Actions cache entry per job (and
      # target); see .github/actions/sccache-restore. Only main saves, so pull
      # requests start from main's entry and add none of their own.
      - name: Restore sccache disk cache
        uses: ./.github/actions/sccache-restore
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Reuse the dependency-source cache namespace the native x86_64-linux
          # build in cross-compile populates. With cache-targets disabled only
          # the registry/git *source* cache is shared (not compiled artifacts),
          # so this saves re-downloading crates rather than re-linking them.
          key: x86_64-unknown-linux-gnu
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install from local checkout
        run: cargo install --path bins/amplihack --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Save sccache disk cache
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/sccache-save
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-host-
      - name: Verify binary
        run: |
          amplihack --version
          amplihack --help
          amplihack recipe list || true
      # Issue #1527: outside-in check of the --model that claude, copilot and
      # codex receive from the binary installed above. Runs the gadugi
      # scenario's driver directly, as Lint & Format does for the issue-820
      # scenario; CI does not run gadugi-test itself.
      - name: Outside-in — dotted Claude model ids (issue #1527)
        shell: bash
        run: AMPLIHACK_1527_QA_BIN="$(command -v amplihack)" bash tests/gadugi/run-issue-1527-model-scenario.sh
      # Issues #1481 and #1525: the scenario below needs tmux for its detached
      # launch cases and the pinned recipe runner for its recipe-run cases.
      - name: Install tmux and the pinned recipe runner (issues #1481, #1525)
        shell: bash
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          tmux -V
          bash scripts/install-pinned-recipe-runner.sh
      # Outside-in check of `amplihack agent-binary`, its --shell hand-off, the
      # agent binary a recipe step is handed, and a real detached tmux launch,
      # against the binary installed above. REQUIRE_ALL turns any case that
      # could not run into a failure, so a missing tool cannot pass as green.
      - name: Outside-in — agent binary resolution and hand-off (issues #1481, #1525)
        shell: bash
        run: AMPLIHACK_1481_QA_REQUIRE_ALL=1 AMPLIHACK_1481_QA_BIN="$(command -v amplihack)" bash tests/gadugi/run-issue-1481-1525-agent-binary-scenario.sh
      - name: Install — npx shim does not abort install (issue #1480)
        run: AMPLIHACK_BIN="$(command -v amplihack)" bash tests/issue_1480_npx_shim_install.sh
      - name: Install — bootstraps Rust toolchain when cargo is missing
        run: AMPLIHACK_BIN="$(command -v amplihack)" bash tests/rust_toolchain_bootstrap_install.sh

  cross-compile:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # actions: read lets the sccache composite actions list cache entries to
    # tell a rate-limited restore or save from a real miss.
    permissions:
      contents: read
      actions: read
    # No `needs: check` — parallelize with Lint & Format (see Test job note).
    env:
      # PR/branch runs only *verify* that each target compiles; the optimized
      # binaries are shipped exclusively by the `release` job on tag pushes.
      # Full-optimization release builds (lto = true, codegen-units = 1) are the
      # slowest configuration to compile, so disable them for non-tag runs to
      # cut build wall-clock substantially. Tag builds keep full optimization so
      # shipped artifacts are unchanged.
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}
      # sccache compiled-artifact caching (local disk, carried by actions/cache).
      # See check job.
      # All matrix entries build natively (cross: false), so RUSTC_WRAPPER wraps
      # the host rustc directly; sccache keys already include the target triple.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "1G"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            gnu_cross_toolchain: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            gnu_cross_toolchain: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            gnu_cross_toolchain: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            gnu_cross_toolchain: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # sccache's disk cache travels as one Actions cache entry per job (and
      # target); see .github/actions/sccache-restore. Only main saves, so pull
      # requests start from main's entry and add none of their own.
      - name: Restore sccache disk cache
        uses: ./.github/actions/sccache-restore
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      # Install cross when a target really needs the container image
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Native build
      - name: Build (native)
        if: "!matrix.cross"
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p amplihack -p amplihack-hooks-bin
          --features amplihack-hooks-bin/signal

      # Cross build (Linux ARM64)
      - name: Build (cross)
        if: matrix.cross
        run: >
          cross build --release --locked --target ${{ matrix.target }}
          -p amplihack -p amplihack-hooks-bin
          --features amplihack-hooks-bin/signal

      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Save sccache disk cache
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/sccache-save
        with:
          key-prefix: sccache-v1-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-
      - name: Upload binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amplihack-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/amplihack
            target/${{ matrix.target }}/release/amplihack-hooks
          if-no-files-found: error


  # Every main save adds one sccache entry per job; delete all but the newest
  # two for each job and target so they do not pile up against the 10 GB cache
  # limit. Only this job holds actions: write.
  sccache-prune:
    name: Prune sccache caches
    needs: [check, test, install-smoke, cross-compile]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      # The script finds every sccache-v1-<...>-<run>-<attempt> entry on main
      # and groups by prefix itself, so a new job or build target is pruned
      # without being listed here.
      - name: Delete older sccache entries (keep newest 2 per job)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-sccache-caches.sh refs/heads/main 2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross-compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Package binaries
        run: |
          cd artifacts
          for dir in amplihack-*; do
            target="${dir#amplihack-}"
            mkdir -p "../dist/${dir}"
            find "$dir" -type f \( -name amplihack -o -name amplihack-hooks \) -exec cp {} "../dist/${dir}/" \;
            test -f "../dist/${dir}/amplihack"
            test -f "../dist/${dir}/amplihack-hooks"
            tar czf "../${dir}.tar.gz" -C "../dist/${dir}" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: amplihack-*.tar.gz
          generate_release_notes: true
