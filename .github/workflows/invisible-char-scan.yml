name: Invisible Character Scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Skip for maintainers and bots
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'copilot[bot]'
    runs-on: ubuntu-latest
    environment: external-pr-scan
    timeout-minutes: 15
    steps:
      - name: Checkout base (safe — not PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Scan diff for invisible characters
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...pr-head \
            | cargo run --locked -p scan-invisible-chars-bin --bin scan-invisible-chars --quiet
