name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the `release` job, which pushes the tag and
# publishes the release, gets `contents: write` (#1526 SR-12).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Determine next version ────────────────────────────────────────────
  # Tag-based versioning: reads base version from Cargo.toml and increments
  # patch from the latest release tag. This job pushes nothing: the `release`
  # job creates an annotated tag on a stamped child commit of the released
  # `main` SHA (#1526); nothing is ever pushed to `main`, so this works with
  # branch protection.
  version-bump:
    name: Auto-bump version
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip if this push is already a version-bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Compute next version from tags
        id: bump
        run: |
          set -euo pipefail

          # Single source of truth: [workspace.package].version in Cargo.toml.
          CURRENT=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["workspace"]["package"]["version"])
          PY
          )
          echo "Cargo.toml version: ${CURRENT}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"

          # Find latest tag in the v${MAJOR}.${MINOR}.x series.
          #
          # Source of truth is `git tag --list` (the tag namespace) rather than
          # `gh release list`. When release publishing fails (e.g. a build leg
          # broke), tags advance but releases don't — `gh release list` then
          # returns stale data and the next run computes a colliding patch
          # number, falling back to the `while git rev-parse` bump loop.
          # Reading from git tags eliminates that drift entirely. (#359)
          LATEST_PATCH=$(git tag --list "v${MAJOR}.${MINOR}.*" \
            | sed -n "s/^v${MAJOR}\.${MINOR}\.\([0-9]\+\)$/\1/p" \
            | sort -n | tail -1)

          if [ -n "${LATEST_PATCH}" ]; then
            NEW_PATCH=$((LATEST_PATCH + 1))
            echo "Latest tag: v${MAJOR}.${MINOR}.${LATEST_PATCH} → next patch: ${NEW_PATCH}"
          else
            NEW_PATCH="${PATCH}"
            echo "No prior v${MAJOR}.${MINOR}.x tag found"
          fi

          HEAD_SHA=$(git rev-parse HEAD)

          # Check if this exact commit has already been released. Two shapes
          # count, so a re-run rebuilds the same version instead of a new one:
          #   - a series tag on HEAD itself: tags made before #1526, and the
          #     first release of a series, whose manifests already say X;
          #   - a series tag on a stamp commit (#1526): first parent HEAD,
          #     subject `chore(release): stamp vX`. The subject check keeps an
          #     old-style tag on HEAD's child commit from matching.
          EXISTING=$(git tag --points-at HEAD | grep -E "^v${MAJOR}\.${MINOR}\." || true)
          if [ -z "${EXISTING}" ]; then
            SERIES_TAGS=$(git tag --list "v${MAJOR}.${MINOR}.*")
            while IFS= read -r t; do
              [ -n "${t}" ] || continue
              # A root commit has no parent; empty PARENT then fails the
              # comparison below, which is the intended answer.
              PARENT=$(git rev-parse -q --verify "${t}^{commit}^1" || true)
              [ "${PARENT}" = "${HEAD_SHA}" ] || continue
              if [ "$(git log -1 --format=%s "${t}^{commit}")" = "chore(release): stamp ${t}" ]; then
                EXISTING="${t}"
                break
              fi
            done <<< "${SERIES_TAGS}"
          fi
          if [ -n "${EXISTING}" ]; then
            echo "Commit already tagged: ${EXISTING} — skipping"
            echo "version=${EXISTING#v}" >> "$GITHUB_OUTPUT"
            echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure the computed tag doesn't already exist on a different commit
          while git rev-parse "v${MAJOR}.${MINOR}.${NEW_PATCH}" >/dev/null 2>&1; do
            echo "Tag v${MAJOR}.${MINOR}.${NEW_PATCH} already exists, bumping"
            NEW_PATCH=$((NEW_PATCH + 1))
          done
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Releasing: v${NEW_VERSION} from ${HEAD_SHA}"

          # The tag is NOT pushed here. The `release` job creates it once the
          # artifacts exist (issue #1356).
          #
          # This workflow sets `cancel-in-progress: true`, so a push to main cancels
          # whatever release is running. Pushing the tag before the build meant a
          # cancelled run left a public tag with nothing behind it -- and the next run
          # reads `git tag --list` as its source of truth (above), sees that tag, and
          # bumps past it, so the version is burned and never retried.
          #
          # Eleven merges in one night produced eight stranded tags, and left
          # `amplihack update` reporting "already at the latest version" against a main
          # it would never fetch. A cancelled run must leave nothing behind: reserving
          # a number in a job output costs nothing if the run dies, publishing it does.

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build release binaries ────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: version-bump
    runs-on: ${{ matrix.runner }}
    # actions: read lets the sccache composite actions list cache entries to
    # tell a rate-limited restore or save from a real miss.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            gnu_cross_toolchain: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            gnu_cross_toolchain: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            gnu_cross_toolchain: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            gnu_cross_toolchain: false
    env:
      # Ported from ci.yml (issue #1358). Without this the release recompiles
      # the whole tree on every target every time: measured 12-28 min per
      # target (~59 min for the since-removed Windows target). With
      # cancel-in-progress set, an hour-wide window means any merge inside it kills the release --
      # five of six runs were cancelled on the night eleven PRs landed, and no
      # release published at all.
      #
      # cache-targets stays false: restoring the whole target/ dir exhausted
      # runner disk, which is exactly why sccache was adopted in ci.yml.
      #
      # sccache keeps a local disk cache that actions/cache restores and saves
      # once per job, as in ci.yml. Its per-object Actions cache backend
      # (SCCACHE_GHA_ENABLED) got HTTP 429 from the repository-wide cache rate
      # limit on most writes, and this workflow runs beside CI on every merge.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "1G"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}
      # sccache must be installed before the first cargo invocation: RUSTC_WRAPPER
      # is set job-wide above, so any cargo running before this step dies with
      # "could not execute process `sccache`". That defect turned Lint & Format
      # red on main and blocked every PR until #1341.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      # sccache's disk cache travels as one Actions cache entry per job (and
      # target); see .github/actions/sccache-restore. Only main saves, so pull
      # requests start from main's entry and add none of their own.
      - name: Restore sccache disk cache
        uses: ./.github/actions/sccache-restore
        with:
          key-prefix: sccache-v1-${{ runner.os }}-release-${{ matrix.target }}-

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Install GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      - name: Build release
        # `AMPLIHACK_RELEASE_VERSION` is read at build time by `option_env!` in
        # `amplihack_cli::VERSION` (and by the matching `const VERSION` in the
        # amplihack-hooks binary). Setting it here pins every released binary
        # to the tag computed in version-bump — without this, binaries still
        # bake in whatever `CARGO_PKG_VERSION` happens to be in `Cargo.toml`,
        # which is the bug that caused the self-update prompt to loop forever
        # after a "successful" upgrade.
        shell: bash
        env:
          AMPLIHACK_RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p amplihack -p amplihack-hooks-bin \
            --features amplihack-hooks-bin/signal

      - name: Save sccache disk cache
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/sccache-save
        with:
          key-prefix: sccache-v1-${{ runner.os }}-release-${{ matrix.target }}-

      - name: Package
        # Use bash on every runner so the .sha256 line format stays
        # byte-identical across platforms — the npm wrapper's
        # parseChecksumHex relies on the canonical "<hex>  <file>"
        # sha256sum format.
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/amplihack dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/amplihack-hooks dist/ 2>/dev/null || true
          cd dist && tar czf ../amplihack-${{ matrix.target }}.tar.gz *
          cd .. && sha256sum amplihack-${{ matrix.target }}.tar.gz > amplihack-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amplihack-${{ matrix.target }}
          path: |
            amplihack-${{ matrix.target }}.tar.gz
            amplihack-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # ── Create GitHub Release ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}
          # The token goes only to the steps that talk to origin, never to
          # the one that runs the stamp script.
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.sha256' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Check for an existing tag
        # Issue #1526: tag a one-commit child of the released `main` SHA whose
        # manifests say X, so a source build of the tag reports X. Only the
        # tag is pushed; `main` is never written. No git failure is ignored:
        # a failed push stops the job before the release is published, so
        # no tag or release exists and the version number is not burned
        # (#1356).
        id: existing
        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
          SHA: ${{ needs.version-bump.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Credentials for this step's git calls only (checkout kept none).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          TAG="v${VERSION}"
          SUBJECT="chore(release): stamp ${TAG}"

          # A re-run finds the tag the last attempt pushed. Accept it only if
          # it is ours: on SHA itself (a series' first release, or a tag made
          # before #1526), or on a stamp commit whose first parent is SHA.
          # Any other vX must not have these artifacts attached to it.
          status=0
          # `|| status=$?` records the exit code; 2 (no such tag) is expected.
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null || status=$?
          case "${status}" in
            0)
              git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
              TAGGED=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
              if [ "${TAGGED}" = "${SHA}" ]; then
                echo "${TAG} already exists on ${SHA}; publishing"
                echo "exists=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              # The fetched commit is a shallow boundary, so `^1` cannot see
              # its parent; the raw object's first `parent` header can.
              COMMIT_OBJECT=$(git cat-file -p "${TAGGED}")
              PARENT=""
              while IFS= read -r header; do
                case "${header}" in
                  "parent "*) PARENT="${header#parent }"; break ;;
                  "") break ;;
                esac
              done <<< "${COMMIT_OBJECT}"
              TAGGED_SUBJECT=$(git log -1 --format=%s "${TAGGED}")
              if [ "${PARENT}" = "${SHA}" ] && [ "${TAGGED_SUBJECT}" = "${SUBJECT}" ]; then
                echo "${TAG} already exists on stamp commit ${TAGGED} (parent ${SHA}); publishing"
                echo "exists=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              echo "::error::${TAG} already exists on ${TAGGED}, which is neither ${SHA} nor its stamp commit; refusing to publish these artifacts under it"
              exit 1
              ;;
            2)
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::checking origin for ${TAG} failed (git ls-remote exit ${status})"
              exit 1
              ;;
          esac

      - name: Stamp version and create tag
        # No token in this step: it runs repository code (the stamp script).
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
          SHA: ${{ needs.version-bump.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          SUBJECT="chore(release): stamp ${TAG}"

          HEAD_NOW=$(git rev-parse HEAD)
          if [ "${HEAD_NOW}" != "${SHA}" ]; then
            echo "::error::checkout is at ${HEAD_NOW}, expected the released main SHA ${SHA}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sh scripts/stamp-release-version.sh "${VERSION}"

          # The script edits Cargo.lock as text and assumes every workspace
          # member inherits the workspace version. Have cargo confirm that the
          # stamped lockfile matches the stamped manifests before anything is
          # committed or tagged: `cargo install --git ... --tag vX --locked`
          # fails on a lockfile cargo would rewrite. Not --offline: this runner
          # has no registry cache, and the crates it fetches are public.
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock stamped for ${VERSION} does not match the workspace manifests; a member probably pins its own version instead of version.workspace = true"
            exit 1
          fi

          # Stage by name: the downloaded artifacts/ and the collected
          # release-assets/ are in the working tree too.
          git add Cargo.toml Cargo.lock
          if [ -f package.json ]; then git add package.json; fi
          STAGED=$(git diff --cached --name-only)
          while IFS= read -r path; do
            case "${path}" in
              "" | Cargo.toml | Cargo.lock | package.json) ;;
              *)
                echo "::error::unexpected staged file ${path}; only the three manifests may be committed"
                exit 1
                ;;
            esac
          done <<< "${STAGED}"

          if git diff --cached --quiet; then
            # First release of a MAJOR.MINOR series: the manifests already say
            # X, so the tag goes on SHA itself.
            echo "Manifests already at ${VERSION}; tagging ${SHA}"
          else
            git commit -m "${SUBJECT}"
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"

      - name: Push tag
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          TAG="v${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: "amplihack-rs v${{ needs.version-bump.outputs.version }}"
          files: release-assets/*
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## Install

            ```bash
            # Linux x86_64
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin/

            # Linux ARM64
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-aarch64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin/

            # macOS ARM64 (Apple Silicon)
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-aarch64-apple-darwin.tar.gz | tar xz -C ~/.local/bin/
            ```

            Or: `amplihack update`

  # Each release build saves one sccache entry per target; keep the newest two.
  # Only this job holds actions: write.
  sccache-prune:
    name: Prune sccache caches
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
      # Groups every sccache-v1 entry on main by prefix (see ci.yml), so it
      # also covers CI's entries; keeping the newest 2 of each is the same rule.
      - name: Delete older sccache entries (keep newest 2 per target)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-sccache-caches.sh refs/heads/main 2
