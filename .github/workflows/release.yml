name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Determine next version and create tag ─────────────────────────────
  # Tag-based versioning: reads base version from Cargo.toml, increments
  # patch from the latest release tag, and creates a lightweight tag.
  # No commit to main required — works with branch protection.
  version-bump:
    name: Auto-bump version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prevent infinite loop: skip if this push is already a version-bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version from tags
        id: bump
        run: |
          set -euo pipefail

          # Single source of truth: [workspace.package].version in Cargo.toml.
          CURRENT=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["workspace"]["package"]["version"])
          PY
          )
          echo "Cargo.toml version: ${CURRENT}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"

          # Find latest tag in the v${MAJOR}.${MINOR}.x series.
          #
          # Source of truth is `git tag --list` (the tag namespace) rather than
          # `gh release list`. When release publishing fails (e.g. a build leg
          # broke), tags advance but releases don't — `gh release list` then
          # returns stale data and the next run computes a colliding patch
          # number, falling back to the `while git rev-parse` bump loop.
          # Reading from git tags eliminates that drift entirely. (#359)
          LATEST_PATCH=$(git tag --list "v${MAJOR}.${MINOR}.*" \
            | sed -n "s/^v${MAJOR}\.${MINOR}\.\([0-9]\+\)$/\1/p" \
            | sort -n | tail -1)

          if [ -n "${LATEST_PATCH}" ]; then
            NEW_PATCH=$((LATEST_PATCH + 1))
            echo "Latest tag: v${MAJOR}.${MINOR}.${LATEST_PATCH} → next patch: ${NEW_PATCH}"
          else
            NEW_PATCH="${PATCH}"
            echo "No prior v${MAJOR}.${MINOR}.x tag found"
          fi

          HEAD_SHA=$(git rev-parse HEAD)

          # Check if this exact commit already has a release tag
          EXISTING=$(git tag --points-at HEAD | grep -E "^v${MAJOR}\.${MINOR}\." || true)
          if [ -n "${EXISTING}" ]; then
            echo "Commit already tagged: ${EXISTING} — skipping"
            echo "version=${EXISTING#v}" >> "$GITHUB_OUTPUT"
            echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure the computed tag doesn't already exist on a different commit
          while git rev-parse "v${MAJOR}.${MINOR}.${NEW_PATCH}" >/dev/null 2>&1; do
            echo "Tag v${MAJOR}.${MINOR}.${NEW_PATCH} already exists, bumping"
            NEW_PATCH=$((NEW_PATCH + 1))
          done
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Tagging: v${NEW_VERSION} at ${HEAD_SHA}"

          # The tag is NOT pushed here. The `release` job creates it once the
          # artifacts exist (issue #1356).
          #
          # This workflow sets `cancel-in-progress: true`, so a push to main cancels
          # whatever release is running. Pushing the tag before the build meant a
          # cancelled run left a public tag with nothing behind it -- and the next run
          # reads `git tag --list` as its source of truth (above), sees that tag, and
          # bumps past it, so the version is burned and never retried.
          #
          # Eleven merges in one night produced eight stranded tags, and left
          # `amplihack update` reporting "already at the latest version" against a main
          # it would never fetch. A cancelled run must leave nothing behind: reserving
          # a number in a job output costs nothing if the run dies, publishing it does.

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build release binaries ────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: version-bump
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            gnu_cross_toolchain: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            gnu_cross_toolchain: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            gnu_cross_toolchain: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            gnu_cross_toolchain: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            gnu_cross_toolchain: false
            exe_suffix: ".exe"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: Install GNU cross toolchain
        if: matrix.gnu_cross_toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      - name: Build release
        # `AMPLIHACK_RELEASE_VERSION` is read at build time by `option_env!` in
        # `amplihack_cli::VERSION` (and by the matching `const VERSION` in the
        # amplihack-hooks binary). Setting it here pins every released binary
        # to the tag computed in version-bump — without this, binaries still
        # bake in whatever `CARGO_PKG_VERSION` happens to be in `Cargo.toml`,
        # which is the bug that caused the self-update prompt to loop forever
        # after a "successful" upgrade.
        shell: bash
        env:
          AMPLIHACK_RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          feature_args=()
          if [ "${{ matrix.target }}" != "x86_64-pc-windows-msvc" ]; then
            feature_args=(--features amplihack-hooks-bin/signal)
          fi
          cargo build --release --locked --target ${{ matrix.target }} \
            -p amplihack -p amplihack-hooks-bin \
            "${feature_args[@]}"

      - name: Package
        # Use bash on every runner (Git Bash on windows-latest provides
        # tar+sha256sum) so the .sha256 line format stays byte-identical
        # across platforms — the npm wrapper's parseChecksumHex relies on
        # the canonical "<hex>  <file>" sha256sum format. Do NOT switch
        # this to certutil on Windows; its output is not parseable.
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/amplihack${{ matrix.exe_suffix }} dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/amplihack-hooks${{ matrix.exe_suffix }} dist/ 2>/dev/null || true
          cd dist && tar czf ../amplihack-${{ matrix.target }}.tar.gz *
          cd .. && sha256sum amplihack-${{ matrix.target }}.tar.gz > amplihack-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amplihack-${{ matrix.target }}
          path: |
            amplihack-${{ matrix.target }}.tar.gz
            amplihack-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # ── Create GitHub Release ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.sha256' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create tag and release
        run: |
          TAG="v${{ needs.version-bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${{ needs.version-bump.outputs.sha }}" || true
          git push origin "${TAG}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.version-bump.outputs.version }}
          name: "amplihack-rs v${{ needs.version-bump.outputs.version }}"
          files: release-assets/*
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## Install

            ```bash
            # Linux x86_64
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin/

            # Linux ARM64
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-aarch64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin/

            # macOS ARM64 (Apple Silicon)
            curl -fsSL https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-aarch64-apple-darwin.tar.gz | tar xz -C ~/.local/bin/

            # Windows x86_64 (PowerShell)
            # iwr https://github.com/rysweet/amplihack-rs/releases/download/v${{ needs.version-bump.outputs.version }}/amplihack-x86_64-pc-windows-msvc.tar.gz -OutFile amplihack.tar.gz; tar xzf amplihack.tar.gz
            ```

            Or: `amplihack update`
