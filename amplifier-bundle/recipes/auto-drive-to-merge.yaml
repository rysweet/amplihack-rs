name: "auto-drive-to-merge"
description: |
  Wraps `default-workflow` and drives the resulting pull request all the way to
  a merge, through two agentically-terminated loops.

    1. BUILD        — run `default-workflow` on the task to produce a PR.
                      Phase 1 never merges; `no_merge: "true"` takes that
                      decision away from it.
    2. CRUSTY LOOP  — put the PR in front of the `crusty-old-engineer` skill
                      acting as the maintainer's proxy, address every concern,
                      re-review, and repeat until crusty has ZERO outstanding
                      concerns.
    3. MERGE-READY  — iterate until every merge-ready criterion holds: the
       LOOP           `merge-ready` skill's criteria, all `qa-team` scenarios
                      passing, CI green, no merge conflicts, review threads
                      resolved. Then merge behind an evidence gate.

  NO ITERATION CAP terminates either loop. Not a max-rounds integer, not a
  backstop, not a wall-clock budget. Both loops are terminated by
  `loop-health-evaluator` (issue #1337), which stops and looks at the data
  after every round and answers CONTINUE / DONE / STUCK. A cap cuts off work
  that was about to converge and lets a genuinely stuck loop burn the whole
  budget first; the signal worth acting on is absence of progress, not number
  of attempts.

  Host safety is enforced structurally one layer down — #1327 (sealed
  recursion ceiling) and #1332 (width cap + free-memory floor), both refusing
  with exit code 79 before a child runs. Rounds here are sequential at CONSTANT
  session depth, so a long loop never walks toward that ceiling, and the
  ceiling is never raised.

  NO SILENT MERGE. The merge gate re-verifies every criterion in the same run
  that merges, binds all of it to ONE head SHA, writes the evidence down before
  merging, and merges with a fixed argv that accepts no caller-supplied flags.
  An unreadable criterion is a failure, never a pass.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "workflow", "crusty", "merge-ready", "merge", "issue-1337"]

# DEPENDENCY: both loops invoke the `loop-health-evaluator` recipe by name. It
# ships with PR #1347 (issue #1337) together with
# `amplihack orch helper normalise-loop-verdict` and
# docs/reference/loop-health-evaluator.md. It is deliberately NOT reimplemented
# or copied here — one loop-health contract, used by every loop that needs one.
#
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY (issue #439): neither this recipe nor any of its phase
# bricks declares a per-step `timeout:` / `timeout_seconds:`, and none declares
# a `default_step_timeout`. CI polling, test suites, builds and model calls run
# to their natural end; a false timeout costs more than a slow run.
#
# TWO ABSOLUTE PROHIBITIONS, in the recipes, in the skill, and enforced by a
# guard test that fails if the strings ever appear in an executable position:
# a hook-skipping commit flag is NEVER passed to git, and a branch-protection
# bypass is NEVER passed to gh. When a hook or a check fails, the cause is
# fixed. See docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 120

context:
  # What to build. Passed straight through to default-workflow.
  task_description: ""
  requirements: ""
  repo_path: "."
  branch_prefix: "feat"

  # Resume / retarget: point the workflow at work that already exists.
  # `existing_branch` and `pr_number` both make phase 1 a no-op when the PR is
  # already open, so a re-run picks up at the crusty loop.
  existing_branch: ""
  pr_number: ""
  pr_url: ""

  # Durable state root for resumability. Empty means "derive it from the repo
  # remote and the PR/branch identity".
  autodrive_state_dir: ""

  # When "true", the merge gate verifies everything and reports what it WOULD
  # merge without merging. Every other guarantee is unchanged.
  autodrive_dry_run: "false"

  # Phase 1 never merges; auto-drive owns the merge decision.
  no_merge: "true"

  # #1543: the operator's own pr_number, captured by the autodrive-pr-input
  # step before any phase runs. It is not an input: the step overwrites it.
  # Both loops receive it under this name. `pr_number` itself cannot carry it,
  # because the runner copies a sub-recipe's whole context back into this one
  # when the sub-recipe returns, and the crusty loop is given
  # pr_number={{build_result.pr}}; after that phase `pr_number` holds the build
  # phase's PR, not what the operator typed. Every sub-recipe hands
  # autodrive_pr_input back unchanged, so it keeps the operator's value.
  autodrive_pr_input: ""

  # Populated as the phases run.
  build_result: ""
  crusty_loop_result: ""
  merge_gate_result: ""

steps:
  # Fail fast (PR #1520 review). Criterion 1 runs qa-team scenarios with
  # gadugi-test only where qa-team's repo-type table needs gadugi: a Node
  # repository, or an operator-set AUTODRIVE_QA_SCENARIO_DIR. The decision is
  # autodrive_gadugi_required in autodrive_trust.sh, the one the merge round
  # and the gate use. A Rust CLI or Python repository runs `cargo test` or
  # `pytest` and does not need gadugi-test. Where it is needed, neither
  # `amplihack install` nor any agent installs it, so it is checked here,
  # before the build and the crusty loop spend hours. Merge round step-00
  # checks it again in case it goes away during the run.
  - id: "autodrive-prerequisites"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || { echo "ERROR: cannot cd to REPO_PATH" >&2; exit 1; }
      TOP=""; T=""; SEARCHED=""
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        TOP="$(git rev-parse --show-toplevel 2>/dev/null)"
      else
        echo "[skip] not a git repo; the git toplevel is not searched for autodrive_trust.sh" >&2
      fi
      for c in "${AMPLIHACK_HOME:-}" "$PWD" "$TOP" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do
        [ -n "$c" ] || continue
        SEARCHED="${SEARCHED}${SEARCHED:+, }${c}/amplifier-bundle/tools"
        [ -f "$c/amplifier-bundle/tools/autodrive_trust.sh" ] && { T="$c/amplifier-bundle/tools/autodrive_trust.sh"; break; }
      done
      [ -n "$T" ] || { echo "ERROR: autodrive-tools-not-found: autodrive_trust.sh not found (searched ${SEARCHED:-no root})" >&2; exit 1; }
      REQ="$(. "$T" && autodrive_gadugi_required .)" || REQ=""
      if [ "$REQ" = "false" ]; then
        echo "INFO: auto-drive prerequisites: criterion 1 does not use gadugi-test in this repository (qa-team's repo-type table)" >&2
        printf '{"gadugi_test":"not-required"}\n'
        exit 0
      fi
      if ! command -v gadugi-test >/dev/null 2>&1; then
        echo "ERROR: gadugi-test-not-installed: gadugi-test is not on PATH. Criterion 1 runs this repository's qa-team scenarios" \
          "with it (a Node repository, or AUTODRIVE_QA_SCENARIO_DIR set), and no agent can install it. Install it" \
          "(npm install -g github:rysweet/gadugi-agentic-test#6c120657798995b1b53399a5acf3693d418a2d8b) and run auto-drive again." >&2
        exit 1
      fi
      echo "INFO: auto-drive prerequisites: gadugi-test at $(command -v gadugi-test)" >&2
      printf '{"gadugi_test":"found"}\n'
    output: "autodrive_prerequisites"

  # #1543: record the operator's pr_number once, before any sub-recipe can
  # overwrite `pr_number` (see autodrive_pr_input in the context above). The
  # prerequisites step before it runs no sub-recipe. The value is empty when
  # the operator gave none. That no longer turns PR worktree resolution off:
  # both loops also resolve on the build phase's PR (pr_number below), so a
  # fresh build whose default-workflow built in its own worktree is measured
  # there, not in the launch checkout. It is passed through verbatim; the
  # loop preflights refuse one that is not a pull request number.
  - id: "autodrive-pr-input"
    type: "bash"
    command: |
      # RECIPE_VAR_pr_number only: the runner sets it for every context value,
      # and a bare PR_NUMBER could be inherited from an enclosing run.
      printf '%s' "${RECIPE_VAR_pr_number:-}"
    output: "autodrive_pr_input"

  - id: "autodrive-build"
    type: "recipe"
    recipe: "autodrive-build"
    context:
      task_description: "{{task_description}}"
      requirements: "{{requirements}}"
      repo_path: "{{repo_path}}"
      branch_prefix: "{{branch_prefix}}"
      existing_branch: "{{existing_branch}}"
      pr_number: "{{pr_number}}"
      pr_url: "{{pr_url}}"
      autodrive_state_dir: "{{autodrive_state_dir}}"

  - id: "autodrive-crusty-loop"
    type: "recipe"
    recipe: "autodrive-crusty-loop"
    context:
      repo_path: "{{repo_path}}"
      pr_number: "{{build_result.pr}}"
      autodrive_pr_input: "{{autodrive_pr_input}}"
      existing_branch: "{{existing_branch}}"
      pr_url: "{{build_result.pr_url}}"
      task_description: "{{task_description}}"
      autodrive_state_dir: "{{build_result.state_dir}}"

  # Issue #1551: only the merge gate in phase 3 merges. A PR already MERGED
  # here was merged around the gh merge guard during phase 1 or 2; the run
  # stops with exit 1 instead of reporting it. Values come from the
  # environment only.
  - id: "autodrive-check-unmerged"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" || { echo "ERROR: #1551: cannot enter REPO_PATH; refusing to check PR state in the wrong repo [autodrive-check-unmerged]" >&2; exit 1; }
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      BR="${BUILD_RESULT:-${RECIPE_VAR_build_result:-}}"
      g() { printf '%s' "$BR" | amplihack orch helper extract-json --require-field "$1" \
              | amplihack orch helper extract-field --field "$1" --default ''; }
      PR="$(g pr)"
      if [ "$(g merged_before_run)" = "true" ]; then
        echo "INFO: PR #${PR} was already merged when this run started; nothing to check [autodrive-check-unmerged]" >&2
        exit 0
      fi
      case "$PR" in
        ''|*[!0-9]*) echo "ERROR: #1551: phase 1 reported no valid PR number; refusing to continue unverified [autodrive-check-unmerged]" >&2; exit 1 ;;
      esac
      # Only the installed bundle: REPO_PATH and cwd are the PR's own tree.
      STATE_HELPER="${AMPLIHACK_HOME:-}/amplifier-bundle/tools/autodrive_state.sh"
      case "${AMPLIHACK_HOME:-}" in /*) ;; *) STATE_HELPER="" ;; esac
      [ -n "$STATE_HELPER" ] && [ -f "$STATE_HELPER" ] || { echo "ERROR: #1551: autodrive_state.sh not found under AMPLIHACK_HOME; cannot check PR #${PR} before phase 3 [autodrive-check-unmerged]" >&2; exit 1; }
      . "$STATE_HELPER"
      # Reads autodrive_pr_state, once more if it is unreadable.
      autodrive_require_unmerged "$PR" "phase 2 (crusty loop)" || exit 1
      echo "INFO: PR #${PR} is unmerged after phase 2; phase 3 may run" >&2
    output: "autodrive_unmerged_check"

  - id: "autodrive-merge-loop"
    type: "recipe"
    recipe: "autodrive-merge-loop"
    context:
      repo_path: "{{repo_path}}"
      pr_number: "{{build_result.pr}}"
      autodrive_pr_input: "{{autodrive_pr_input}}"
      existing_branch: "{{existing_branch}}"
      pr_url: "{{build_result.pr_url}}"
      task_description: "{{task_description}}"
      autodrive_state_dir: "{{build_result.state_dir}}"
      autodrive_dry_run: "{{autodrive_dry_run}}"

  - id: "autodrive-report"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      g() { printf '%s' "${1:-}" | amplihack orch helper extract-json --require-field "$2" \
              | amplihack orch helper extract-field --field "$2" --default "$3"; }
      # The RECIPE_VAR_ fallbacks for the three phase outputs, and with them
      # the merge_result read that #1543's incident showed as NOT_MERGED after
      # a real merge, came from #1511 (PR #1563, cf1f3e71). #1543 changes only
      # where the PR number comes from: by this step `pr_number` holds the
      # build phase's PR (the loops hand back the build_result.pr they got),
      # which is the PR this run drove, and the gate's and build's reported
      # pr follow it. The composed-recipe run in
      # tests/test-issue-1543-pr-head-worktree.sh (T20, T21) checks the report
      # through the real runner.
      BR="${BUILD_RESULT:-${RECIPE_VAR_build_result:-}}"
      MG="${MERGE_GATE_RESULT:-${RECIPE_VAR_merge_gate_result:-}}"
      CR="${CRUSTY_LOOP_RESULT:-${RECIPE_VAR_crusty_loop_result:-}}"
      PR=""
      for C in "${PR_NUMBER:-}" "${RECIPE_VAR_pr_number:-}" "$(g "$MG" pr '')" "$(g "$BR" pr '')"; do
        case "$C" in ''|*[!0-9]*) continue ;; esac
        PR="$C"; break
      done
      MERGE="$(g "$MG" merge_result NOT_MERGED)"
      CRUSTY="$(g "$CR" loop_result unknown)"
      # Only plain tokens reach the report; anything else cannot forge a key.
      [[ "$MERGE" =~ ^[A-Za-z0-9_-]*$ ]] || MERGE="NOT_MERGED"
      [[ "$CRUSTY" =~ ^[A-Za-z0-9_-]*$ ]] || CRUSTY="unknown"
      case "$MERGE" in
        MERGED|ALREADY_MERGED) OUTCOME="MERGED" ;;
        DRY_RUN) OUTCOME="DRY_RUN" ;;
        *) OUTCOME="NOT_MERGED" ;;
      esac
      echo "AUTO_DRIVE_TO_MERGE: ${OUTCOME} — PR #${PR:-<none>} (crusty loop: ${CRUSTY}, merge gate: ${MERGE})" >&2
      printf '{"outcome":"%s","pr":"%s","crusty_loop":"%s","merge_result":"%s"}\n' \
        "$OUTCOME" "$PR" "$CRUSTY" "$MERGE"
    output: "autodrive_summary"

output:
  format: "markdown"
  template: |
    # auto-drive-to-merge

    **Outcome:** {{autodrive_summary.outcome}} — PR #{{autodrive_summary.pr}}

    | Phase | Result |
    | --- | --- |
    | 1. build (default-workflow) | {{build_result}} |
    | 2. crusty loop | {{autodrive_summary.crusty_loop}} |
    | 3. merge-ready loop + merge gate | {{autodrive_summary.merge_result}} |
