name: "auto-drive-to-merge"
description: |
  Build an open PR, then run the shared goal loop (#3129) with the goal "get this pull request merged under the owner's conditions". Each turn an agent reads a fresh reading of the live state (checks, GitHub's merge state, review verdicts, whether the base conflicts or changed the PR's files, the repository's settings) with the task text and guidance, and picks the next action: review, fix and push, bring the base in by merge commit when it is needed, install a missing host input, wait for an event, merge under the captured authorisation with --match-head-commit, or hand off to a named owner. Fixed code only reads state, pushes, merges and waits; it never decides that a run ends because of how the run is going. No hook or branch-protection bypass is permitted. docs/reference/autodrive-goal-loop.md.
version: "1.0.0"
author: "Amplihack Team"
tags:
  - "auto-drive"
  - "workflow"
  - "crusty"
  - "merge-ready"
  - "merge"
  - "issue-1337"
recursion:
  max_depth: 6
  max_total_steps: 40
context:
  autodrive_authorization: ""
  step_recovery_dir: ""
  base_branch: ""  # base for the pull request, passed on to default-workflow; empty: the PR's own base (docs/reference/workflow-delivery-inputs.md)
  task_description: ""
  requirements: ""
  repo_path: "."
  branch_prefix: "feat"
  existing_branch: ""
  pr_number: ""
  pr_url: ""
  plan_task_id: ""
  autodrive_state_dir: ""
  autodrive_dry_run: "false"
  no_merge: "false"
  # #1888: the merge method this drive is to use (merge, squash or rebase).
  # Empty leaves the choice to the repository's own allowed methods, which is
  # squash wherever squash is allowed. A method the repository does not allow
  # is never used; the drive hands the PR off instead.
  merge_method: ""
  # #3160: how minor review findings are treated: fix_all (the default, also
  # when empty), judge or file_all. Any other value is refused at the start.
  autodrive_minor_findings: ""
  autodrive_settings: ""
  autodrive_pr_input: ""
  # Retired (#3129): accepted for one release and ignored; the loop has no
  # round or time budget.
  autodrive_budget_loop_rounds: ""
  autodrive_budget_total_rounds: ""
  autodrive_budget_wall_seconds: ""
  build_result: ""
  crusty_loop_result: ""
  merge_loop_result: ""
  merge_loop_outcome: ""
  sync_loop_outcome: ""
  finalize_merge: ""
  autodrive_finalization: ""
  autodrive_goal_pr: ""
steps:
  # #3160: the one start-of-run check of the setting. It runs first, so a bad
  # value stops the run before any folder, build, gh call or agent turn. The
  # value is read from RECIPE_VAR_* only and echoed cleaned.
  - id: "autodrive-settings"
    type: "bash"
    command: |
      v="${RECIPE_VAR_autodrive_minor_findings:-}"
      v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
      case "$v" in
        ""|fix_all|judge|file_all) printf '%s' "${v:-fix_all}" ;;
        *) shown="$(printf '%s' "$v" | LC_ALL=C tr -cd '[:print:]' | head -c 80)"
           echo "ERROR: autodrive_minor_findings must be fix_all, judge or file_all (got '$shown')" >&2
           exit 2 ;;
      esac
    output: "autodrive_settings"
  - id: "step-recovery-init"
    type: "bash"
    command: |
      if [ -n "${RECIPE_VAR_step_recovery_dir:-}" ]; then
        exec amplihack orch helper step-recovery init --dir "$RECIPE_VAR_step_recovery_dir"
      fi
      exec amplihack orch helper step-recovery init --created-by auto-drive-to-merge
    output: "step_recovery_dir"
  - id: "autodrive-pr-input"
    type: "bash"
    command: |
      # RECIPE_VAR_pr_number only: the runner sets it for every context value,
      # and a bare PR_NUMBER could be inherited from an enclosing run.
      printf '%s' "${RECIPE_VAR_pr_number:-}"
    output: "autodrive_pr_input"
  - id: "autodrive-build"
    type: "recipe"
    recipe: "autodrive-build"
    context:
      base_branch: "{{base_branch}}"
      task_description: "{{task_description}}"
      requirements: "{{requirements}}"
      repo_path: "{{repo_path}}"
      branch_prefix: "{{branch_prefix}}"
      existing_branch: "{{existing_branch}}"
      pr_number: "{{pr_number}}"
      pr_url: "{{pr_url}}"
      autodrive_state_dir: "{{autodrive_state_dir}}"
      no_merge: "{{no_merge}}"
      autodrive_dry_run: "{{autodrive_dry_run}}"
      step_recovery_dir: "{{step_recovery_dir}}"
  # The PR the loop drives: the operator's pr_number when given, else the PR
  # the build stage resolved. Only digits pass; anything else is empty, and
  # the loop's reading then says no pull request was named.
  - id: "autodrive-goal-pr"
    type: "bash"
    command: |
      P="${RECIPE_VAR_pr_number:-}"
      [ -n "$P" ] || P="$(printf '%s' "${RECIPE_VAR_build_result:-}" | amplihack orch helper extract-field --field pr --default '' 2>/dev/null)"
      [[ "$P" =~ ^[1-9][0-9]{0,9}$ ]] && printf '%s' "$P"
      exit 0
    output: "autodrive_goal_pr"
  # #3129: one goal-driven loop replaces the crusty loop, the unmerged check,
  # the merge-ready loop and finalisation. The state folder is the
  # runner-bound one (#2959, #3053), never a folder an agent step reported.
  - id: "autodrive-loop"
    type: "recipe"
    recipe: "autodrive-goal-loop"
    condition: "build_result.merged_before_run != 'true'"
    context:
      goal_tool: "autodrive_pr_goal.sh"
      goal_file: "skills/auto-drive-to-merge/goal-merge-pr.md"
      goal_notes: ""
      repo_path: "{{repo_path}}"
      pr_number: "{{autodrive_goal_pr}}"
      task_description: "{{task_description}}"
      autodrive_state_dir: "{{autodrive_state_dir}}"
      autodrive_dry_run: "{{autodrive_dry_run}}"
      no_merge: "{{no_merge}}"
      merge_method: "{{merge_method}}"
      autodrive_minor_findings: "{{autodrive_minor_findings}}"
      step_recovery_dir: "{{step_recovery_dir}}"
  # The run's outcome is the runner's report (report.rs), built from the
  # driver's loop-end.json and the merge action's merge-result.json; this step
  # prints a short line and keeps the #2539 step-recovery report.
  - id: "autodrive-report"
    type: "bash"
    command: |
      SRD="${RECIPE_VAR_step_recovery_dir:-}"
      if [ -n "$SRD" ]; then
        amplihack orch helper step-recovery report --dir "$SRD" --remove-if-created-by auto-drive-to-merge >&2 || exit $?
      else
        echo "[step-recovery] recovery was disabled for this drive; see the step-recovery-init warning" >&2
      fi
      E="${RECIPE_VAR_autodrive_state_dir:-}/loop-end.json"
      if [ -f "$E" ] && [ ! -L "$E" ]; then
        jq -c '{loop_end:.end, detail, turn}' "$E" 2>/dev/null || echo '{"loop_end":null}'
      else
        printf '%s\n' "{\"loop_end\":null,\"merged_before_run\":\"$(printf '%s' "${RECIPE_VAR_build_result:-}" | amplihack orch helper extract-field --field merged_before_run --default false 2>/dev/null)\"}"
      fi
    output: "autodrive_summary"
output:
  format: "markdown"
  template: |
    Auto-drive outcome: {{autodrive_summary}}
    Step recovery directory (empty: recovery was off): {{step_recovery_dir}}
    Phase 1 terminal state: {{build_result.terminal_state}} (handed off: {{build_result.handed_off}})
    Build: {{build_result}}
    Goal loop: {{autodrive_finalization}}
