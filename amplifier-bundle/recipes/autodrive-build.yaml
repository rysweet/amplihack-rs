name: "autodrive-build"
description: |
  Phase 1 of auto-drive-to-merge: run `default-workflow` on the task to produce
  a pull request.

  The merge decision is deliberately taken away from default-workflow here
  (`no_merge: "true"`). Phase 1 builds and publishes; nothing merges until the
  crusty loop and the merge-ready loop have both converged and the merge gate
  has verified every criterion in the run that merges.

  Resumable: a run that already produced a PR for this branch does NOT rebuild
  it, and a PR that is already merged short-circuits the whole workflow. The
  platform is the authority on both — local state is a cache, never a claim.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "build", "default-workflow", "pr"]

# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY (issue #439): no step declares `timeout` or
# `timeout_seconds`; the recipe declares no `default_step_timeout`.
#
# PROHIBITIONS: a hook-skipping commit flag and a branch-protection bypass are
# NEVER used anywhere in this workflow. See
# docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 80

context:
  task_description: ""
  requirements: ""
  repo_path: "."
  branch_prefix: "feat"
  existing_branch: ""
  pr_number: ""
  pr_url: ""
  autodrive_state_dir: ""
  # Set by step-02's default-workflow sub-recipe; step-03 reads the worktree
  # path and branch from its JSON (#1676, #1561).
  worktree_setup: ""
  # Phase 1 never merges. auto-drive-to-merge owns that decision.
  no_merge: "true"

steps:
  - id: "step-01-build-preflight"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      STATE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || { echo "ERROR: autodrive state helper not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $STATE_HELPER; cwd=$(pwd)" >&2; exit 1; }
      . "$STATE_HELPER"

      PR="${PR_NUMBER:-}"
      case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      GIT_OK="true"
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        GIT_OK="false"; echo "[skip] not a git repo; branch evidence is unobserved, never assumed" >&2
      fi
      BRANCH="${EXISTING_BRANCH:-}"
      [ -n "$BRANCH" ] || { [ "$GIT_OK" = "true" ] && BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || printf '')"; }
      if [ -z "$PR" ] && [ -n "$BRANCH" ] && [ "$BRANCH" != "HEAD" ]; then
        PR="$(gh pr list --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || printf '')"
        case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      fi
      IDENT="${PR:-${BRANCH:-detached}}"
      DIR="${AUTODRIVE_STATE_DIR:-}"
      [ -n "$DIR" ] || DIR="$(autodrive_state_dir "${REPO_PATH:-.}" "$IDENT")" || exit 1
      # Private whatever the caller's umask: the merge gate refuses state
      # that anyone else could have written (autodrive_state.sh).
      autodrive_private_dir "$DIR" || exit 1

      STATE="$(autodrive_pr_state "$PR")"
      RUN="true"; WHY="no pull request exists yet for this work"
      if [ "$STATE" = "MERGED" ]; then
        RUN="false"; WHY="PR #${PR} is already merged; merged work is never rebuilt"
      elif [ "$STATE" = "OPEN" ]; then
        RUN="false"; WHY="PR #${PR} already exists and is open; phase 1 does not rebuild it"
      fi
      PR_URL_OUT="${PR_URL:-}"
      if [ -z "$PR_URL_OUT" ] && [ -n "$PR" ]; then
        PR_URL_OUT="$(gh pr view "$PR" --json url --jq .url 2>/dev/null || printf '')"
      fi
      echo "INFO: build preflight: branch=${BRANCH:-<none>} pr=${PR:-<none>} pr_state=${STATE} run=${RUN} (${WHY})" >&2
      printf '{"should_run":"%s","pr":"%s","pr_url":"%s","pr_state":"%s","branch":"%s","state_dir":"%s","reason":"%s"}\n' \
        "$RUN" "$PR" "$PR_URL_OUT" "$STATE" "$BRANCH" "$DIR" "$WHY"
    output: "build_preflight"

  - id: "step-01b-no-merge-directive"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      # Issue #1551: tell phase 1's agents not to merge. Advice only: the gh
      # merge guard on PATH is the control. Values come from the environment
      # and leave through jq, so no text is pasted into this script.
      DIRECTIVE='[amplihack:no-merge] Do NOT run "gh pr merge" or call the pulls/<N>/merge API, and do not list merging in requirements or acceptance criteria. Leave the PR open. Auto-drive'"'"'s merge gate merges it after a Crusty CLEAN and the merge-ready loop; any other merge attempt is refused.'
      normalise_no_merge_flag() {
        # $1 structured flag value. Truthy tokens suppress auto-merge; anything
        # else (including empty/false) preserves the default merge behavior.
        local flag
        flag="$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
        case "$flag" in true|1|yes|on) printf 'true\n' ;; *) printf 'false\n' ;; esac
      }
      NM="$(normalise_no_merge_flag "${RECIPE_VAR_no_merge:-}")"
      # NO_MERGE override (#1561): a bare NO_MERGE can only switch merging off.
      # See docs/reference/auto-drive-to-merge.md#no_merge-override
      [ "$(normalise_no_merge_flag "${NO_MERGE:-}")" = "true" ] && { NM=true; echo "INFO: autodrive-build/step-01b-no-merge-directive: no_merge=true from bare NO_MERGE env (override, #1561)" >&2; }
      with_directive() {
        if [ "$NM" != "true" ]; then printf '%s' "$1"; return; fi
        case "$1" in
          *"$DIRECTIVE"*) printf '%s' "$1" ;;
          '') printf '%s' "$DIRECTIVE" ;;
          *) printf '%s\n\n%s' "$1" "$DIRECTIVE" ;;
        esac
      }
      # jq is a hard dependency: both branches emit their output through it.
      TD="$(with_directive "${RECIPE_VAR_task_description:-}"; printf x)"
      RQ="$(with_directive "${RECIPE_VAR_requirements:-}"; printf x)"
      OUT="$(jq -n --arg t "${TD%x}" --arg r "${RQ%x}" '{task_description: $t, requirements: $r}')"
      RC=$?
      if [ "$RC" -ne 0 ] || [ -z "$OUT" ]; then
        echo "ERROR: jq could not encode phase 1's task and requirements (exit ${RC}) [autodrive-build/step-01b]" >&2
        exit 1
      fi
      # Fail closed: step-02 must never start with the directive silently
      # missing. Both fields carry the marker, so it appears at least twice.
      MARKER='[amplihack:no-merge]'
      REST="${OUT#*"$MARKER"}"
      if [ "$NM" = "true" ] && { [ "$REST" = "$OUT" ] || [[ "$REST" != *"$MARKER"* ]]; }; then
        echo "ERROR: #1551: phase 1's task and requirements lack the no-merge directive; refusing to start default-workflow without it [autodrive-build/step-01b]" >&2
        exit 1
      fi
      printf '%s\n' "$OUT"
    output: "no_merge_directive"

  - id: "step-02-default-workflow"
    condition: "build_preflight.should_run == 'true'"
    type: "recipe"
    recipe: "default-workflow"
    context:
      # Issue #1551: the copies that carry the no-merge directive.
      task_description: "{{no_merge_directive.task_description}}"
      requirements: "{{no_merge_directive.requirements}}"
      repo_path: "{{repo_path}}"
      branch_prefix: "{{branch_prefix}}"
      existing_branch: "{{existing_branch}}"
      # Phase 1 publishes a PR and stops. The merge belongs to phase 3's gate.
      no_merge: "true"
      should_merge: "false"

  - id: "step-03-resolve-pr"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" || { echo "ERROR: #1551: cannot enter REPO_PATH; refusing to check PR state in the wrong repo [autodrive-build/step-03]" >&2; exit 1; }
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      g() { printf '%s' "${RECIPE_VAR_build_preflight:-}" | amplihack orch helper extract-json --require-field "$1" \
              | amplihack orch helper extract-field --field "$1" --default ''; }
      PR="$(g pr)"; DIR="$(g state_dir)"; BRANCH="$(g branch)"
      # An empty state_dir means there is nothing to record; an unsafe one is
      # refused before anything touches it.
      case "$DIR" in
        '') echo "INFO: no state_dir from the preflight; nothing to record." >&2 ;;
        /|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-build/step-03]" >&2; exit 1 ;;
      esac
      if [ -z "$PR" ]; then
        [ -n "$BRANCH" ] && [ "$BRANCH" != "HEAD" ] && \
          PR="$(gh pr list --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || printf '')"
      fi
      if [ -z "$PR" ]; then
        PR="$(gh pr view --json number --jq .number 2>/dev/null || printf '')"
      fi
      # Issue #1676: an agent step can open the PR on the branch default-workflow
      # created in its own worktree, which neither lookup above sees (they ask
      # about REPO_PATH's branch). worktree_setup comes back from step-02's
      # sub-recipe; the helper applies #1596's open-PR check there, plus head ==
      # the worktree's HEAD. Only the installed bundle's copy is sourced (#1551).
      case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      if [ -z "$PR" ]; then
        # #1561: only the JSON in the base key belongs to this run; nested
        # names and bare WORKTREE_SETUP_* can hold a parent run's values.
        RUN_DIR="$(printf '%s' "${RECIPE_VAR_worktree_setup:-}" \
          | jq -r 'if type=="object" then .worktree_path // empty else empty end' 2>/dev/null)" \
          || { echo "WARNING: step-03-resolve-pr: worktree_setup is not valid JSON; treated as missing (#1561)" >&2; RUN_DIR=""; }
        RUN_BRANCH="$(printf '%s' "${RECIPE_VAR_worktree_setup:-}" \
          | jq -r 'if type=="object" then .branch_name // empty else empty end' 2>/dev/null)" \
          || { echo "WARNING: step-03-resolve-pr: worktree_setup is not valid JSON; treated as missing (#1561)" >&2; RUN_BRANCH=""; }
        # A branch that is not a valid branch name is dropped; the helper then
        # takes the branch from the worktree.
        case "$RUN_BRANCH" in -*) RUN_BRANCH="" ;; esac
        [ -z "$RUN_BRANCH" ] || git check-ref-format --branch "$RUN_BRANCH" >/dev/null 2>&1 || RUN_BRANCH=""
        # The path must be one absolute line, not a symlink, already resolved
        # and a worktree root; anything else skips the lookup.
        if [ -n "$RUN_DIR" ]; then
          RUN_DIR_OK="false"
          case "$RUN_DIR" in
            *$'\n'*) ;;
            /*) if [ -d "$RUN_DIR" ] && [ ! -L "$RUN_DIR" ] \
                   && [ "$(realpath -- "$RUN_DIR" 2>/dev/null)" = "$RUN_DIR" ] \
                   && [ "$(git -C "$RUN_DIR" rev-parse --show-toplevel 2>/dev/null)" = "$RUN_DIR" ]; then
                  RUN_DIR_OK="true"
                fi ;;
          esac
          if [ "$RUN_DIR_OK" != "true" ]; then
            echo "INFO: #1676: worktree_setup.worktree_path is not a worktree root; skipping the run-branch lookup [autodrive-build/step-03]" >&2
            RUN_DIR=""
          fi
        fi
        RUN_PR_HELPER="${AMPLIHACK_HOME:-}/amplifier-bundle/tools/autodrive_run_pr.sh"
        case "${AMPLIHACK_HOME:-}" in /*) ;; *) RUN_PR_HELPER="" ;; esac
        if [ -n "$RUN_DIR" ] && [ -n "$RUN_PR_HELPER" ] && [ -f "$RUN_PR_HELPER" ] && . "$RUN_PR_HELPER"; then
          PR="$(autodrive_open_pr_for_run_branch "$RUN_DIR" "$RUN_BRANCH")"
          [ -z "$PR" ] || echo "INFO: #1676: found open PR #${PR} for the run's branch ${RUN_BRANCH:-<from worktree>} at its HEAD" >&2
        fi
      fi
      case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      if [ -z "$PR" ]; then
        echo "ERROR: phase 1 finished without a pull request. Phases 2 and 3 have nothing to review or merge, so the workflow stops here rather than reporting progress it did not make." >&2
        exit 1
      fi
      # Issue #1551: only the installed bundle. REPO_PATH and cwd are the
      # PR's own tree, which phase 1's agents could edit.
      STATE_HELPER="${AMPLIHACK_HOME:-}/amplifier-bundle/tools/autodrive_state.sh"
      case "${AMPLIHACK_HOME:-}" in /*) ;; *) STATE_HELPER="" ;; esac
      HAVE_HELPER="false"
      [ -n "$STATE_HELPER" ] && [ -f "$STATE_HELPER" ] && . "$STATE_HELPER" && HAVE_HELPER="true"
      # Issue #1680: with no PR, the preflight keyed state_dir by REPO_PATH's
      # branch (main, say), which every fresh run in this repository shares.
      # Now the PR is known, key the state by it, as a later pr_number=N run's
      # preflight does. An explicit autodrive_state_dir is kept: the check is
      # that neither spelling is set, so neither name outranks the other (#1561).
      if [ -n "$DIR" ] && [ -z "$(g pr)" ] && [ -z "${RECIPE_VAR_autodrive_state_dir:-}" ] && [ -z "${AUTODRIVE_STATE_DIR:-}" ]; then
        NEW_DIR=""
        [ "$HAVE_HELPER" = "true" ] && NEW_DIR="$(autodrive_state_dir "${REPO_PATH:-.}" "$PR")"
        if [ -n "$NEW_DIR" ]; then
          [ "$NEW_DIR" = "$DIR" ] || echo "INFO: #1680: state for PR #${PR} is kept in ${NEW_DIR}, not ${DIR}" >&2
          DIR="$NEW_DIR"
        else
          echo "WARNING: #1680: could not key the state by PR #${PR}; keeping ${DIR}" >&2
        fi
      fi
      # Issue #1551: a phase 1 that built under no_merge must leave its PR
      # unmerged. MERGED here means something merged around the gh merge guard.
      normalise_no_merge_flag() {
        # $1 structured flag value. Truthy tokens suppress auto-merge; anything
        # else (including empty/false) preserves the default merge behavior.
        local flag
        flag="$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
        case "$flag" in true|1|yes|on) printf 'true\n' ;; *) printf 'false\n' ;; esac
      }
      NM="$(normalise_no_merge_flag "${RECIPE_VAR_no_merge:-}")"
      # NO_MERGE override (#1561): a bare NO_MERGE can only switch merging off.
      # See docs/reference/auto-drive-to-merge.md#no_merge-override
      [ "$(normalise_no_merge_flag "${NO_MERGE:-}")" = "true" ] && { NM=true; echo "INFO: autodrive-build/step-03-resolve-pr: no_merge=true from bare NO_MERGE env (override, #1561)" >&2; }
      PRE_STATE="$(g pr_state)"
      if [ "$(g should_run)" = "true" ] && [ "$NM" = "true" ]; then
        [ "$HAVE_HELPER" = "true" ] || { echo "ERROR: #1551: autodrive_state.sh not found under AMPLIHACK_HOME; cannot check that phase 1 left PR #${PR} unmerged [autodrive-build/step-03]" >&2; exit 1; }
        autodrive_require_unmerged "$PR" "phase 1 (build)" || exit 1
      fi
      URL="$(gh pr view "$PR" --json url --jq .url 2>/dev/null || printf '')"
      if [ -n "$DIR" ]; then
        if [ "$HAVE_HELPER" = "true" ]; then
          autodrive_mark_phase_done "$DIR" "build"
        else
          echo "WARNING: autodrive state helper not found; this run stays correct but a resumed run will re-probe phase 1." >&2
        fi
      fi
      # merged_before_run: the PR was already MERGED when this run started (a
      # resumed run), so the phase-2 check in auto-drive-to-merge skips it.
      MBR="false"; [ "$PRE_STATE" = "MERGED" ] && MBR="true"
      echo "INFO: phase 1 complete: PR #${PR} ${URL}" >&2
      printf '{"pr":"%s","pr_url":"%s","state_dir":"%s","merged_before_run":"%s"}\n' "$PR" "$URL" "$DIR" "$MBR"
    output: "build_result"

output:
  format: "markdown"
  template: |
    # Build phase

    **Preflight:** {{build_preflight}}

    **PR:** {{build_result.pr_url}} (#{{build_result.pr}})
