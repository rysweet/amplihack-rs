name: "autodrive-crusty-loop"
description: |
  Phase 2 of auto-drive-to-merge: iterate `autodrive-crusty-round` — the
  `crusty-old-engineer` skill acting as the maintainer's proxy — until crusty
  has ZERO outstanding concerns, or until the agentic loop-health evaluator
  says the loop has stopped making progress.

  There is NO iteration cap here. Not a max-rounds integer, not a backstop, not
  a wall-clock budget. The terminator is `loop-health-evaluator` (issue #1337):
  after each round it reads measured evidence — what the round actually
  produced, which concerns are new / recurring / resolved, whether signals
  moved — and answers CONTINUE / DONE / STUCK. Absence of progress stops the
  loop; number of attempts does not.

  Host safety is enforced structurally one layer down by #1327 (sealed
  recursion ceiling) and #1332 (width cap + free-memory floor), which refuse
  with exit code 79. Rounds run sequentially at CONSTANT session depth, so a
  long loop never walks toward that ceiling — and the ceiling is never raised.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "crusty", "loop", "verdict", "issue-1337"]

# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY (issue #439): no step declares `timeout` or
# `timeout_seconds`; the recipe declares no `default_step_timeout`.
#
# PROHIBITIONS: a hook-skipping commit flag and a branch-protection bypass are
# NEVER used anywhere in this workflow. See
# docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 30

context:
  repo_path: "."
  pr_number: ""
  pr_url: ""
  task_description: ""
  autodrive_state_dir: ""
  # #1543: the user's own pr_number (empty when phase 1 built the PR) and
  # existing_branch. Non-empty autodrive_pr_input turns on PR worktree
  # resolution in the preflight.
  autodrive_pr_input: ""
  existing_branch: ""
  crusty_loop_result: ""

steps:
  - id: "step-01-crusty-loop-preflight"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      STATE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || { echo "ERROR: autodrive state helper not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $STATE_HELPER; cwd=$(pwd)" >&2; exit 1; }
      . "$STATE_HELPER"

      # #1543: the operator's own pr_number outranks a guess from the launch checkout.
      PR="${PR_NUMBER:-}"
      case "$PR" in ''|*[!0-9]*) PR="${AUTODRIVE_PR_INPUT:-}" ;; esac
      [ -n "$PR" ] || PR="$(gh pr view --json number --jq .number 2>/dev/null || printf '')"
      case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      [ -z "${AUTODRIVE_PR_INPUT:-}" ] || [ -n "$PR" ] \
        || { echo "ERROR: pr_number '${AUTODRIVE_PR_INPUT}' is not a pull request number; refusing to enter the crusty loop (#1543)" >&2; exit 1; }
      BRANCH="detached"
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || printf 'detached')"
      else
        echo "[skip] not a git repo; the branch identity falls back to 'detached' rather than being assumed" >&2
      fi
      IDENT="${PR:-$BRANCH}"
      DIR="${AUTODRIVE_STATE_DIR:-}"
      [ -n "$DIR" ] || DIR="$(autodrive_state_dir "${REPO_PATH:-.}" "$IDENT")" || exit 1
      # Private whatever the caller's umask: the merge gate refuses state
      # that anyone else could have written (autodrive_state.sh).
      autodrive_private_dir "$DIR" || exit 1

      # Resume: merged work is never redone, and a phase this workflow already
      # completed is not repeated. Platform state wins over any local record.
      RUN="true"; WHY="crusty loop not yet completed for this PR"
      STATE="$(autodrive_pr_state "$PR")"
      if [ "$STATE" = "MERGED" ]; then
        RUN="false"; WHY="PR #${PR} is already merged; nothing to review"
      elif autodrive_phase_done "$DIR" "crusty-loop"; then
        RUN="false"; WHY="the crusty loop already completed for this PR in an earlier run"
      fi
      # #1543: with pr_number supplied, every evidence step measures the PR
      # head, wherever the run started. Resolve the PR branch's EXISTING
      # worktree and hand it to the loop; refuse rather than measure cwd.
      json_esc() { case "$1" in *[[:cntrl:]]*) return 1 ;; esac; local s="${1//\\/\\\\}"; printf '%s' "${s//\"/\\\"}"; }
      REPO="${REPO_PATH:-.}"; HEAD_SHA=""
      if [ "$RUN" = "true" ] && [ -n "${AUTODRIVE_PR_INPUT:-}" ]; then
        PR_HEAD="${STATE_HELPER%/autodrive_state.sh}/autodrive_pr_head.sh"
        [ -f "$PR_HEAD" ] || { echo "ERROR: crusty loop: autodrive_pr_head.sh not found next to $STATE_HELPER; refusing to enter the crusty loop (#1543)" >&2; exit 1; }
        RES="$(bash "$PR_HEAD" --pr "$PR" --branch "${EXISTING_BRANCH:-}" --repo "${REPO_PATH:-.}")"
        PRC=$?
        if [ "$PRC" -eq 3 ]; then
          echo "ERROR: PR #${PR} head branch '${EXISTING_BRANCH:-<headRefName>}' has no single worktree (searched REPO_PATH=${REPO_PATH:-.} and git worktree list); refusing to enter the crusty loop (#1543)" >&2
          exit 1
        elif [ "$PRC" -ne 0 ]; then
          echo "ERROR: PR #${PR} head resolution refused (autodrive_pr_head exit ${PRC}; reason on the line above); refusing to enter the crusty loop (#1543)" >&2
          exit 1
        fi
        REPO="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field worktree | amplihack orch helper extract-field --field worktree --default '')"
        HEAD_SHA="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field head_sha | amplihack orch helper extract-field --field head_sha --default '')"
        if [ -z "$REPO" ] || [ ! -d "$REPO" ] || ! [[ "$HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
          echo "ERROR: autodrive_pr_head returned no usable worktree/head_sha for PR #${PR}; refusing to enter the crusty loop (#1543)" >&2
          exit 1
        fi
        echo "INFO: PR #${PR} head ${HEAD_SHA} resolved to worktree ${REPO}" >&2
      fi
      E_DIR="$(json_esc "$DIR")" && E_REPO="$(json_esc "$REPO")" \
        || { echo "ERROR: state_dir or repo contains control characters; refusing to enter the crusty loop" >&2; exit 1; }
      echo "INFO: crusty-loop preflight: pr=${PR:-<none>} pr_state=${STATE} run=${RUN} (${WHY}) state_dir=${DIR}" >&2
      printf '{"should_run":"%s","pr":"%s","pr_state":"%s","state_dir":"%s","repo":"%s","head_sha":"%s","reason":"%s"}\n' \
        "$RUN" "$PR" "$STATE" "$E_DIR" "$E_REPO" "$HEAD_SHA" "$WHY"
    output: "crusty_loop_preflight"

  - id: "step-02-crusty-loop"
    condition: "crusty_loop_preflight.should_run == 'true'"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      LOOP_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || { echo "ERROR: autodrive loop helper not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $LOOP_HELPER; cwd=$(pwd)" >&2; exit 1; }
      DIR="$(printf '%s' "${CRUSTY_LOOP_PREFLIGHT:-${RECIPE_VAR_crusty_loop_preflight:-}}" \
        | amplihack orch helper extract-json --require-field state_dir \
        | amplihack orch helper extract-field --field state_dir --default '')"
      PR="$(printf '%s' "${CRUSTY_LOOP_PREFLIGHT:-${RECIPE_VAR_crusty_loop_preflight:-}}" \
        | amplihack orch helper extract-json --require-field pr \
        | amplihack orch helper extract-field --field pr --default '')"
      # Refuse an empty or unsafe state_dir before anything touches it.
      case "$DIR" in
        ''|/|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-crusty-loop/step-02]" >&2; exit 1 ;;
      esac
      REPO="$(printf '%s' "${CRUSTY_LOOP_PREFLIGHT:-${RECIPE_VAR_crusty_loop_preflight:-}}" \
        | amplihack orch helper extract-json --require-field repo \
        | amplihack orch helper extract-field --field repo --default '')"
      [ -n "$REPO" ] || { echo "ERROR: preflight produced no repo; refusing to run a loop that would measure the launch checkout (#1543) [autodrive-crusty-loop/step-02]" >&2; exit 1; }
      # #1543: the loop runs in the preflight's repo (the PR worktree when
      # pr_number was supplied). Tools stay on the launch side: pin
      # AMPLIHACK_HOME, when it is unset, to the tree this step took its loop
      # helper from (the launch checkout or ~/.copilot / ~/.amplihack), so the
      # rounds' tool ladders never fall through to PR-authored tools.
      if [ -z "${AMPLIHACK_HOME:-}" ]; then
        AMPLIHACK_HOME="$(cd "$(dirname "$LOOP_HELPER")/../.." && pwd -P)" \
          || { echo "ERROR: cannot resolve the tool root of $LOOP_HELPER; refusing to run the loop" >&2; exit 1; }
        export AMPLIHACK_HOME
      fi

      # Issue #1570: task_description is read with write_context_value
      # (RECIPE_VAR_* or AMPLIHACK_CONTEXT_FILE) into a private file that the
      # loop copies to its state directory. The uppercase TASK_DESCRIPTION
      # alias is not used: the runner omits it for large values.
      H=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/recipe_context_value.sh" ] && { H="$c/amplifier-bundle/tools"; break; }; done
      [ -n "$H" ] || { echo "ERROR: amplifier-bundle/tools/recipe_context_value.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$H/recipe_context_value.sh" || exit 1
      TASK_IN="$(umask 077; mktemp)" || exit 1
      trap 'rm -f -- "$TASK_IN"' EXIT
      write_context_value task_description "$TASK_IN" || { echo "ERROR: task_description unavailable" >&2; exit 1; }
      bash "$LOOP_HELPER" --task-file "$TASK_IN" \
        --loop-name "crusty" \
        --round-recipe "autodrive-crusty-round" \
        --clean-token "CLEAN" \
        --verdict-field "crusty_verdict" \
        --repo "$REPO" \
        --state-dir "$DIR" \
        --context "repo_path=${REPO}" \
        --context "pr_number=${PR}" \
        --context "pr_url=${PR_URL:-}"
      RC=$?
      if [ "$RC" -eq 79 ]; then
        echo "ERROR: exit 79 terminal policy refusal in the crusty loop (#1327/#1332). Final — surfaced and stopped, never retried into the guard." >&2
        exit 79
      fi
      exit "$RC"
    output: "crusty_loop_result"

  - id: "step-03-record-crusty-phase"
    condition: "crusty_loop_preflight.should_run == 'true'"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      STATE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || { echo "WARNING: autodrive state helper not found; this run stays correct but a resumed run will redo the crusty loop." >&2; exit 0; }
      . "$STATE_HELPER"
      DIR="$(printf '%s' "${CRUSTY_LOOP_PREFLIGHT:-${RECIPE_VAR_crusty_loop_preflight:-}}" \
        | amplihack orch helper extract-json --require-field state_dir \
        | amplihack orch helper extract-field --field state_dir --default '')"
      PR="$(printf '%s' "${CRUSTY_LOOP_PREFLIGHT:-${RECIPE_VAR_crusty_loop_preflight:-}}" \
        | amplihack orch helper extract-json --require-field pr \
        | amplihack orch helper extract-field --field pr --default '')"
      # Refuse an empty or unsafe state_dir before anything touches it.
      case "$DIR" in
        ''|/|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-crusty-loop/step-03]" >&2; exit 1 ;;
      esac
      RESULT="$(printf '%s' "${CRUSTY_LOOP_RESULT:-${RECIPE_VAR_crusty_loop_result:-}}" \
        | amplihack orch helper extract-json --require-field loop_result \
        | amplihack orch helper extract-field --field loop_result --default '')"
      if [ "$RESULT" != "DONE" ]; then
        echo "INFO: crusty loop result is '${RESULT:-unknown}', not DONE; the phase is NOT recorded complete." >&2
        exit 0
      fi
      # Every concern crusty raised during this loop is now settled: the loop
      # only reports DONE on a round whose own verdict was CLEAN. Record the
      # ids so a resumed run does not reopen them, then the marker. The
      # re-review between merge rounds records its loop the same way.
      autodrive_record_crusty_loop_done "$DIR"
      echo "INFO: crusty loop recorded complete for PR #${PR:-<none>}." >&2
    output: "crusty_phase_record"

output:
  format: "markdown"
  template: |
    # Crusty loop

    **Preflight:** {{crusty_loop_preflight}}

    **Result:** {{crusty_loop_result}}
