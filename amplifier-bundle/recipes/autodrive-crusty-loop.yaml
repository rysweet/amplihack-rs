name: "autodrive-crusty-loop"
description: |
  One-release alias (#3049, #3129). The Crusty loop, with its no-progress and
  loop-health stops, is replaced by the shared goal loop, whose agent chooses
  a review when the head needs one. This recipe runs one review action
  (autodrive_pr_goal.sh review: one autodrive-crusty-round at the worktree's
  head) and returns. Every old context key is still declared; the
  autodrive_budget_* keys are accepted and ignored. It brings back no stop.
  docs/reference/autodrive-goal-loop.md.
version: "1.0.0"
author: "Amplihack Team"
tags:
  - "auto-drive"
  - "alias"
  - "issue-3129"
recursion:
  max_depth: 6
  max_total_steps: 4
context:
  step_recovery_dir: ""
  repo_path: "."
  pr_number: ""
  pr_url: ""
  task_description: ""
  plan_task_id: ""
  autodrive_state_dir: ""
  autodrive_dry_run: "false"
  autodrive_pr_input: ""
  existing_branch: ""
  autodrive_budget_loop_rounds: ""
  autodrive_budget_total_rounds: ""
  autodrive_budget_wall_seconds: ""
  crusty_loop_result: ""
  no_merge: "true"
  autodrive_finalization: ""
  # Read by the review action's goal tool; declared so no enclosing run's value
  # reaches it (#1561).
  merge_method: ""
steps:
  - id: "review"
    type: "bash"
    command: |
      set -uo pipefail
      case "${AMPLIHACK_HOME:-}" in /*) ;; *) echo "ERROR: autodrive-crusty-loop: AMPLIHACK_HOME must be the absolute launch-bundle home" >&2; exit 2 ;; esac
      T="${AMPLIHACK_HOME}/amplifier-bundle/tools"
      echo "autodrive-crusty-loop is a one-release alias (#3129): it runs one review action; the goal loop replaces the Crusty loop." >&2
      W="$(mktemp -d)" || exit 1
      trap 'rm -rf -- "$W"' EXIT
      . "$T/recipe_context_value.sh"
      write_context_value task_description "$W/task" 2>/dev/null || : > "$W/task"
      AUTODRIVE_GOAL_CONTRACT=1 AUTODRIVE_STATE_DIR="${RECIPE_VAR_autodrive_state_dir:-}" \
        AUTODRIVE_REPO="${RECIPE_VAR_repo_path:-.}" AUTODRIVE_LOOP_HOME="$T" AUTODRIVE_TASK_FILE="$W/task" \
        bash "$T/autodrive_pr_goal.sh" review
    output: "crusty_loop_result"
output:
  format: "markdown"
  template: |
    Review (the autodrive-crusty-loop alias, #3129): {{crusty_loop_result}}
