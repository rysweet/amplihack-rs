name: "autodrive-merge-evidence"
description: |
  Deterministic evidence collection for one round of the auto-drive-to-merge
  merge-ready loop: bring the branch up to date with its base, run the
  repository's own tests and validate and run the `qa-team` scenarios with
  gadugi-test, and wait for CI on the current head to reach a terminal state.

  Everything here is MEASURED. No step in this brick forms an opinion, and
  nothing it reports is a model's impression. Unreadable is never reported as
  passing: a criterion that cannot be read comes back as a failure, because
  "we do not know" must not merge.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "merge-ready", "qa-team", "ci", "evidence"]

# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY (issue #439): no step declares `timeout` or
# `timeout_seconds`. The CI wait below polls on a 60-second interval and stops
# when CI reaches a terminal state or becomes unreadable — it is bounded by the
# build finishing, not by a seconds-scale or single-digit-minute stopwatch. A
# test suite is likewise never cut off mid-run.
#
# PROHIBITIONS: a hook-skipping commit flag and a branch-protection bypass are
# NEVER used anywhere in this workflow. See
# docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 30

context:
  repo_path: "."
  pr_number: ""
  autodrive_qa_evidence: ""
  autodrive_round_label: "round"

steps:
  - id: "step-01-sync-with-base"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      # `main` requires branches to be up to date before merge (the strict
      # policy — see docs/reference/merge-flow.md). A BEHIND branch is brought
      # forward here so CI runs on what will actually be merged.
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "[skip] not a git repo; the branch cannot be brought up to date and is reported unsynced, never as clean" >&2
        printf '{"base":"","synced":"false","conflict":"unknown","head_sha":"","git_observed":"false"}\n'
        exit 0
      fi
      BASE="$(gh pr view "${PR_NUMBER:-}" --json baseRefName --jq .baseRefName 2>/dev/null || printf '')"
      [ -n "$BASE" ] || BASE="main"
      SYNCED="false"; CONFLICT="false"
      if git fetch origin "$BASE" >/dev/null 2>&1; then
        BEHIND="$(git rev-list --count "HEAD..origin/${BASE}" 2>/dev/null || printf 0)"
        if [ "${BEHIND:-0}" != "0" ]; then
          if git merge --no-edit "origin/${BASE}" >/dev/null 2>&1; then
            SYNCED="true"
            git push >/dev/null 2>&1 || echo "WARNING: merged origin/${BASE} but the push failed; CI will still be reading the old head." >&2
          else
            CONFLICT="true"
            git merge --abort >/dev/null 2>&1 || true
            echo "ERROR: merge conflict against origin/${BASE}. Conflicts are resolved by fixing the branch, never by bypassing the gate." >&2
          fi
        fi
      else
        echo "WARNING: could not fetch origin/${BASE}; up-to-date state is unknown and will be reported as unverified." >&2
      fi
      printf '{"base":"%s","synced":"%s","conflict":"%s","head_sha":"%s","git_observed":"true"}\n' \
        "$BASE" "$SYNCED" "$CONFLICT" "$(git rev-parse HEAD 2>/dev/null || printf '')"
    output: "merge_sync"

  - id: "step-02-qa-team-scenarios"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      ROOT="$(pwd -P)"
      EVIDENCE="${AUTODRIVE_QA_EVIDENCE:-}"
      # Criterion 1 is two measurements, and both always run so the evidence
      # lists every cause at once: the repository's suite commands, and the
      # qa-team scenarios validated and run with gadugi-test. qa_status is
      # PASS only when both pass; qa_reason names the first failing check.
      # Free text is sanitised before it reaches the JSON below: no quotes,
      # backslashes or control bytes, so a hostile log line or directory name
      # can neither break the evidence nor carry terminal escapes.
      san() { tr '\n' ' ' | LC_ALL=C tr -d '\000-\037\177"\\'; }
      num() { case "$1" in ''|*[!0-9]*) printf '0' ;; *) printf '%s' "$1" ;; esac; }
      CAUSES=""
      cause() { CAUSES="${CAUSES}${CAUSES:+; }$1"; }
      # The evidence binds to the tree it was measured on. The merge gate
      # refuses evidence whose head_sha is not the SHA being merged, so a
      # PASS left behind by an earlier round cannot stand in for this one.
      HEAD_SHA=""
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || printf '')"
      else
        echo "[skip] not a git repo; the qa evidence records no head sha, so the merge gate refuses it rather than merging unbound evidence" >&2
      fi

      # --- suite commands --------------------------------------------------
      # AUTODRIVE_QA_COMMAND, AUTODRIVE_QA_DIR and AUTODRIVE_QA_COMMANDS come
      # from the environment only (no recipe declares them as context; an
      # empty context default would hide the exported value). Set but empty
      # means "no command", never "detect one".
      #   AUTODRIVE_QA_COMMAND   one command, word-split with globbing off, run
      #                          in AUTODRIVE_QA_DIR (the issue #1516 semantics)
      #   AUTODRIVE_QA_COMMANDS  one command per line (blank and # lines skipped),
      #                          each run alone with bash -c from the repo root
      # With neither set, the command comes from the repository type.
      QA_DIR="${AUTODRIVE_QA_DIR:-.}"
      TYPE="unknown"; KINDS=(); TEXTS=()
      if [ -n "${AUTODRIVE_QA_COMMAND+x}" ] || [ -n "${AUTODRIVE_QA_COMMANDS+x}" ]; then
        TYPE="configured"
        if [ -n "${AUTODRIVE_QA_COMMAND:-}" ]; then KINDS+=(word); TEXTS+=("$AUTODRIVE_QA_COMMAND"); fi
        while IFS= read -r line || [ -n "$line" ]; do
          case "$(printf '%s' "$line" | sed 's/^[[:space:]]*//')" in ''|'#'*) continue ;; esac
          KINDS+=(entry); TEXTS+=("$line")
        done <<< "${AUTODRIVE_QA_COMMANDS:-}"
      elif [ -f Cargo.toml ]; then
        TYPE="rust-cli"; KINDS+=(detected); TEXTS+=("cargo test --workspace --locked --no-fail-fast")
      elif [ -f package.json ]; then
        TYPE="node"; KINDS+=(detected); TEXTS+=("npm test")
      elif [ -f pyproject.toml ] || [ -f setup.py ]; then
        TYPE="python"; KINDS+=(detected); TEXTS+=("pytest")
      fi
      LOG="$(mktemp -t autodrive-qa-XXXXXX)"
      CMDTEXT=""; RAN=0; FIRST_NZ=""; S_FAILED="false"; S_MISSING="false"; S_NOTINST="false"
      [ "${#TEXTS[@]}" -gt 0 ] || { S_MISSING="true"; cause "no repository test command for repository type ${TYPE}"; }
      i=0
      while [ "$i" -lt "${#TEXTS[@]}" ]; do
        kind="${KINDS[$i]}"; text="${TEXTS[$i]}"; i=$((i + 1))
        CMDTEXT="${CMDTEXT}${CMDTEXT:+; }${text}"
        if [ "$kind" = "entry" ]; then
          # Its own process from the repository root: a `cd` in one entry
          # never reaches the next, and entries are never joined or sourced.
          ( cd -- "$ROOT" && bash -c "$text" ) >>"$LOG" 2>&1 </dev/null
          rc=$?
        else
          dir="."; [ "$kind" = "word" ] && dir="$QA_DIR"
          first="$(set -f; set -- $text; printf '%s' "${1:-}")"
          if ! ( cd -- "$dir" 2>/dev/null && { command -v "$first" >/dev/null 2>&1 || [ -x "./${first}" ]; } ); then
            S_NOTINST="true"; cause "$(printf '%s' "$first" | san | cut -c1-80) not installed"
            continue
          fi
          # No timeout: a test suite is never cut off mid-run.
          # shellcheck disable=SC2086
          ( set -f; cd -- "$dir" && $text ) >>"$LOG" 2>&1 </dev/null
          rc=$?
        fi
        RAN=$((RAN + 1))
        echo "INFO: qa-team (${TYPE}) suite command exited ${rc}: $(printf '%s' "$text" | san | cut -c1-200)" >&2
        if [ "$rc" -ne 0 ]; then S_FAILED="true"; [ -n "$FIRST_NZ" ] || FIRST_NZ="$rc"; fi
      done
      [ "$S_FAILED" = "true" ] && cause "repository test failure"
      RC=""; [ "$RAN" -gt 0 ] && RC="${FIRST_NZ:-0}"
      TAIL="$(tail -n 5 "$LOG" | san | cut -c1-300)"
      tail -n 60 "$LOG" >&2 || true
      rm -f "$LOG"

      # --- the scenario directory ------------------------------------------
      # AUTODRIVE_QA_SCENARIO_DIR from the environment only, then
      # tests/agentic, then scenarios. An override naming a missing directory
      # means no scenarios, not a fallback.
      SDIR_IN="${AUTODRIVE_QA_SCENARIO_DIR:-}"
      if [ -z "$SDIR_IN" ]; then
        SDIR_IN="tests/agentic"
        [ ! -d tests/agentic ] && [ -d scenarios ] && SDIR_IN="scenarios"
      fi
      [ "$SDIR_IN" = "/" ] || SDIR_IN="${SDIR_IN%/}"
      case "$SDIR_IN" in /*) SDIR="$SDIR_IN" ;; *) SDIR="${ROOT}/${SDIR_IN}" ;; esac
      case "$SDIR" in "${ROOT}/"*) SREL="${SDIR#"${ROOT}/"}" ;; *) SREL="$SDIR" ;; esac
      # Top-level regular files only: gadugi-test validate -d does not read
      # subdirectories, and a symlinked scenario is not followed.
      COUNT=0; SCEN=""; FILES=()
      if [ -d "$SDIR" ]; then
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          COUNT=$((COUNT + 1)); SCEN="${SCEN}${SCEN:+ }${SREL}/${f##*/}"; FILES+=("$f")
        done < <(find "$SDIR" -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) 2>/dev/null | LC_ALL=C sort)
      fi

      # --- gadugi-test -----------------------------------------------------
      # A missing gadugi-test stops every gadugi check, and a failed validate
      # stops every run; once validate passes, every scenario runs. Its own
      # per-command default limit applies; nothing here adds one.
      G_STATUS=""; G_VRC=""; G_RRC=""; RUN_NZ=""; VALIDATED=0; RUNS=0; PASSED=0; FAILED=0
      UNNAMED=""; RUNFAIL=""; STAGEFAIL=""
      if ! command -v gadugi-test >/dev/null 2>&1; then
        G_STATUS="NOT_INSTALLED"; cause "gadugi-test not installed"
      elif [ "$COUNT" = "0" ]; then
        # gadugi-test run exits 0 on an empty directory, so zero is checked here.
        G_STATUS="NO_SCENARIOS"; cause "no scenarios in $(printf '%s' "$SREL" | san)"
      else
        GLOG="$(mktemp -t autodrive-gadugi-XXXXXX)"
        # gadugi-test writes logs/ and outputs/ into its working directory. Only
        # the ones this step creates are removed afterwards, so the artifact
        # guard does not block the next commit on this run's leftovers.
        NEW_DIRS=""
        for d in logs outputs; do [ -e "$d" ] || [ -L "$d" ] || NEW_DIRS="${NEW_DIRS} ${d}"; done
        gadugi-test validate -d "$SDIR" >"$GLOG" 2>&1 </dev/null
        G_VRC=$?
        if [ "$G_VRC" -ne 0 ]; then
          G_STATUS="VALIDATE_FAILED"; cause "gadugi-test validation failure"
        else
          VALIDATED="$COUNT"
          # One gadugi-test process per scenario file: a whole-directory run
          # lets a scenario read state an earlier one left behind
          # (gadugi-agentic-test #207). --scenario matches a substring of the
          # scenario's name:, not a path, so each file is copied ALONE into its
          # own temporary directory outside the repository and run from there,
          # and the match cannot pick up a second scenario. There is no
          # fallback to running $SDIR itself.
          # An explicit template: macOS `mktemp -d` alone ignores TMPDIR.
          STAGE_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/autodrive-gadugi.XXXXXX" 2>/dev/null)" || STAGE_ROOT=""
          STAGE_OK="false"
          if [ -n "$STAGE_ROOT" ] && [ -d "$STAGE_ROOT" ]; then
            trap '[ -n "${STAGE_ROOT:-}" ] && [ -d "$STAGE_ROOT" ] && rm -rf -- "$STAGE_ROOT"' EXIT
            case "$(cd -- "$STAGE_ROOT" && pwd -P)/" in
              "${ROOT}/"*) echo "WARNING: the temporary directory is inside the repository; no scenario is staged there." >&2 ;;
              *) STAGE_OK="true" ;;
            esac
          fi
          for f in ${FILES[@]+"${FILES[@]}"}; do
            rel="${SREL}/${f##*/}"
            # The scenario's name: a top-level `name:`, or `name:` directly
            # under a top-level `scenario:`, with quotes and comments removed.
            name="$(LC_ALL=C awk '
              { sub(/\r$/, "") }
              /^[^[:space:]#]/ {
                top = $0; sub(/[[:space:]]*:.*$/, "", top); insc = (top == "scenario"); ind = -1
                if ($0 ~ /^name[[:space:]]*:/) { v = $0; got = 1; exit }
                next
              }
              insc && /^[[:space:]]+[^[:space:]#]/ {
                match($0, /^[[:space:]]+/); if (ind < 0) ind = RLENGTH
                if (RLENGTH == ind && $0 ~ /^[[:space:]]+name[[:space:]]*:/) { v = $0; got = 1; exit }
              }
              END {
                if (!got) exit
                sub(/^[[:space:]]*name[[:space:]]*:[[:space:]]*/, "", v)
                q = substr(v, 1, 1)
                if (q == "\"" || q == "\047") {
                  v = substr(v, 2); n = index(v, q); v = (n > 0) ? substr(v, 1, n - 1) : ""
                } else {
                  sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]+$/, "", v)
                  if (v ~ /^[|>\[{&*!]/) v = ""
                }
                print v
              }' "$f" 2>/dev/null)"
            # A name gadugi-test could read as an option, or one carrying a
            # control byte, or one over 200 bytes, is no name: the file fails.
            ok="true"
            case "$name" in ''|-*) ok="false" ;; esac
            printf '%s' "$name" | LC_ALL=C grep -q '[[:cntrl:]]' && ok="false"
            [ "$(printf '%s' "$name" | LC_ALL=C wc -c | tr -d ' ')" -le 200 ] || ok="false"
            if [ "$ok" != "true" ]; then
              UNNAMED="${UNNAMED}${UNNAMED:+ }${rel}"; FAILED=$((FAILED + 1)); continue
            fi
            stage=""
            [ "$STAGE_OK" = "true" ] && stage="$(mktemp -d "${STAGE_ROOT}/scenario.XXXXXX" 2>/dev/null)" \
              && cp -P -- "$f" "${stage}/" 2>/dev/null || stage=""
            if [ -z "$stage" ]; then
              STAGEFAIL="${STAGEFAIL}${STAGEFAIL:+ }${rel}"; FAILED=$((FAILED + 1)); continue
            fi
            (cd -- "$ROOT" && gadugi-test run -d "$stage" --scenario "$name") >>"$GLOG" 2>&1 </dev/null
            rrc=$?
            RUNS=$((RUNS + 1))
            if [ "$rrc" -eq 0 ]; then PASSED=$((PASSED + 1))
            else FAILED=$((FAILED + 1)); RUNFAIL="${RUNFAIL}${RUNFAIL:+ }${rel}"; [ -n "$RUN_NZ" ] || RUN_NZ="$rrc"; fi
          done
          [ "$RUNS" -gt 0 ] && G_RRC="${RUN_NZ:-0}"
          [ -n "$UNNAMED" ] && cause "gadugi scenario without a name: ${UNNAMED}"
          [ -n "$STAGEFAIL" ] && cause "gadugi scenario could not be staged: ${STAGEFAIL}"
          [ -n "$RUNFAIL" ] && cause "$(printf 'gadugi-test %s failure: %s' run "$RUNFAIL")"
          if [ -n "${UNNAMED}${STAGEFAIL}${RUNFAIL}" ]; then G_STATUS="RUN_FAILED"; else G_STATUS="PASS"; fi
        fi
        echo "INFO: gadugi-test on ${SREL} (${COUNT} scenario(s), ${RUNS} run, ${PASSED} passed): ${G_STATUS}" >&2
        tail -n 60 "$GLOG" >&2 || true
        rm -f "$GLOG"
        for d in $NEW_DIRS; do [ -d "$d" ] && [ ! -L "$d" ] && rm -rf -- "./${d}"; done
      fi

      # --- qa_status and qa_reason -----------------------------------------
      # qa_reason is the first token that applies, in this fixed order; the
      # FAIL tokens come first because the merge round can act on them.
      REASON=""
      pick() { [ -n "$REASON" ] || REASON="$1"; }
      [ "$S_FAILED" = "true" ] && pick "qa-command-failed"
      [ "$G_STATUS" = "NO_SCENARIOS" ] && pick "no-scenarios"
      [ "$G_STATUS" = "VALIDATE_FAILED" ] && pick "gadugi-validate-failed"
      [ -n "$UNNAMED" ] && pick "gadugi-scenario-unnamed"
      [ -n "${RUNFAIL}${STAGEFAIL}" ] && pick "gadugi-run-failed"
      [ "$S_MISSING" = "true" ] && pick "qa-command-missing"
      [ "$S_NOTINST" = "true" ] && pick "qa-command-not-installed"
      [ "$G_STATUS" = "NOT_INSTALLED" ] && pick "gadugi-test-missing"
      if [ -z "$REASON" ] && { [ "$RAN" -eq 0 ] || [ "$G_STATUS" != "PASS" ] || [ "$PASSED" != "$COUNT" ]; }; then
        echo "ERROR: no check failed by name, yet the evidence is incomplete (suite commands run=${RAN}, gadugi=${G_STATUS}); refusing to report PASS." >&2
        REASON="qa-command-missing"
      fi
      case "$REASON" in
        '') STATUS="PASS" ;;
        qa-command-failed|no-scenarios|gadugi-validate-failed|gadugi-scenario-unnamed|gadugi-run-failed) STATUS="FAIL" ;;
        qa-command-missing|qa-command-not-installed|gadugi-test-missing) STATUS="BLOCKED" ;;
        *) echo "ERROR: unknown qa_reason '${REASON}'; reporting FAIL." >&2; STATUS="FAIL"; REASON="gadugi-run-failed" ;;
      esac
      SUMMARY="$(printf '%s' "${CAUSES}${CAUSES:+${TAIL:+: }}${TAIL}" | san)"
      OUT="$(printf '{"qa_status":"%s","qa_reason":"%s","qa_repo_type":"%s","qa_command":"%s","qa_suite_commands_count":"%s","qa_scenarios":"%s","qa_exit_code":"%s","qa_summary":"%s","qa_round":"%s","head_sha":"%s","gadugi_status":"%s","gadugi_validate_exit_code":"%s","gadugi_run_exit_code":"%s","gadugi_scenario_count":"%s","gadugi_scenario_dir":"%s","gadugi_scenarios_validated":"%s","gadugi_scenarios_run":"%s","gadugi_scenarios_passed":"%s","gadugi_scenarios_failed":"%s","gadugi_failed_scenarios":"%s"}\n' \
        "$STATUS" "$REASON" "$TYPE" "$(printf '%s' "$CMDTEXT" | san | cut -c1-500)" "$(num "$RAN")" \
        "$(printf '%s' "$SCEN" | san)" "$RC" "$SUMMARY" "$(printf '%s' "${AUTODRIVE_ROUND_LABEL:-round}" | san)" "$HEAD_SHA" \
        "$G_STATUS" "$G_VRC" "$G_RRC" "$(num "$COUNT")" "$(printf '%s' "$SREL" | san)" \
        "$(num "$VALIDATED")" "$(num "$RUNS")" "$(num "$PASSED")" "$(num "$FAILED")" \
        "$(printf '%s' "${UNNAMED} ${STAGEFAIL} ${RUNFAIL}" | san | tr -s ' ' | sed 's/^ //; s/ $//')")"
      [ -n "$EVIDENCE" ] && printf '%s' "$OUT" > "$EVIDENCE"
      printf '%s\n' "$OUT"
    output: "qa_evidence"

  - id: "step-03-wait-for-ci"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GH_PAGER=cat PAGER=cat LESS=FRX
      PR="${PR_NUMBER:-}"
      case "$PR" in ''|*[!0-9]*) PR="$(gh pr view --json number --jq .number 2>/dev/null || printf '')" ;; esac
      if [ -z "$PR" ] || ! command -v jq >/dev/null 2>&1; then
        echo "ERROR: cannot read CI (pr='${PR:-none}', jq present=$(command -v jq >/dev/null 2>&1 && echo yes || echo no)). Unreadable CI is a FAILURE, not a pass." >&2
        printf '{"ci_status":"UNREADABLE","ci_total":"0","ci_pending":"","ci_failing":"","ci_signal":"unreadable"}\n'
        exit 0
      fi
      # Poll until CI reaches a terminal state. The loop is bounded by the
      # build finishing or by the status becoming unreadable — never by a
      # seconds-scale or single-digit-minute stopwatch, and never by a count.
      while :; do
        JSON="$(gh pr checks "$PR" --json name,state,bucket 2>/dev/null)"
        if [ -z "$JSON" ]; then
          echo "ERROR: CI status for #${PR} became unreadable while waiting. Unreadable is a FAILURE, not a pass." >&2
          printf '{"ci_status":"UNREADABLE","ci_total":"0","ci_pending":"","ci_failing":"","ci_signal":"unreadable"}\n'
          exit 0
        fi
        TOTAL="$(printf '%s' "$JSON" | jq -r 'length' 2>/dev/null)"
        PENDING="$(printf '%s' "$JSON" | jq -r '[.[]|select(.bucket=="pending")]|length' 2>/dev/null)"
        FAILING="$(printf '%s' "$JSON" | jq -r '[.[]|select(.bucket=="fail" or .bucket=="cancel")]|length' 2>/dev/null)"
        [ -n "${PENDING:-}" ] || PENDING="unreadable"
        if [ "$PENDING" = "0" ] || [ "$PENDING" = "unreadable" ]; then break; fi
        echo "INFO: waiting on CI for #${PR}: ${PENDING}/${TOTAL} pending, ${FAILING} failing." >&2
        sleep 60
      done
      if [ "$PENDING" = "unreadable" ]; then
        STATUS="UNREADABLE"
      elif [ "${TOTAL:-0}" = "0" ]; then
        STATUS="NO_CHECKS"
        echo "ERROR: #${PR} reports zero CI checks. Zero checks is not a green build." >&2
      elif [ "${FAILING:-1}" = "0" ]; then
        STATUS="GREEN"
      else
        STATUS="RED"
      fi
      echo "INFO: CI for #${PR}: ${STATUS} (total=${TOTAL:-?} failing=${FAILING:-?})" >&2
      printf '{"ci_status":"%s","ci_total":"%s","ci_pending":"%s","ci_failing":"%s","ci_signal":"%s:%s/%s"}\n' \
        "$STATUS" "${TOTAL:-0}" "$PENDING" "${FAILING:-}" "$STATUS" "${FAILING:-?}" "${TOTAL:-?}"
    output: "ci_evidence"

output:
  format: "markdown"
  template: |
    # Merge evidence ({{autodrive_round_label}})

    **Sync:** {{merge_sync}}

    **qa-team:** {{qa_evidence}}

    **CI:** {{ci_evidence}}
