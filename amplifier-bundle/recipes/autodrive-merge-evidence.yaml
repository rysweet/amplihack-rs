name: "autodrive-merge-evidence"
description: |
  Deterministic evidence collection for one round of the auto-drive-to-merge
  merge-ready loop: bring the branch up to date with its base, run the
  repository's own tests and, where qa-team's repo-type table requires
  gadugi, validate and run the `qa-team` scenarios with gadugi-test, and wait
  read CI on the current head once (pending is a wait, #2472).

  Everything here is MEASURED. No step in this brick forms an opinion, and
  nothing it reports is a model's impression. Unreadable is never reported as
  passing: a criterion that cannot be read comes back as a failure, because
  "we do not know" must not merge.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "merge-ready", "qa-team", "ci", "evidence"]

# NO-TIMEOUT POLICY (issue #439): no step declares `timeout` or
# `timeout_seconds`. CI is read once (#2333): pending CI is recorded as a wait
# and the loop ends WAITING, so nothing polls or sleeps. A test suite is never
# cut off mid-run.
# PROHIBITIONS: a hook-skipping commit flag and a branch-protection bypass are
# NEVER used anywhere in this workflow. See
# docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 30

context:
  repo_path: "."
  pr_number: ""
  autodrive_qa_evidence: ""
  autodrive_round_label: "round"
  # The round's step-00-tools-dir result; empty when this recipe runs alone.
  autodrive_tools_dir: ""

steps:
  - id: "step-01-sync-with-base"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      # #2033: inherited GIT_* (a hook's GIT_DIR, GIT_WORK_TREE, ...) and the outer
      # run's AMPLIHACK_* identity are cleared before any git command, so the
      # repository's own hooks and tests act on this checkout. The helper comes from
      # the tools directory autodrive-merge-round's step-00-tools-dir found once
      # (it requires git-repo-env.sh there); run alone, from AMPLIHACK_HOME. Never
      # through git, which those variables could redirect. Same line as merge-round step-04.
      TOOLS_D="${RECIPE_VAR_autodrive_tools_dir:-}"
      [ -n "$TOOLS_D" ] || TOOLS_D="${AMPLIHACK_HOME:-}/amplifier-bundle/tools"
      [ ! -L "$TOOLS_D/git-repo-env.sh" ] && . "$TOOLS_D/git-repo-env.sh" && amplihack_clear_git_repo_env && amplihack_clear_run_identity_env || { echo "STOP: cannot load git-repo-env.sh from the tools directory (#2033)" >&2; exit 1; }
      echo "INFO: cleared git env: ${AMPLIHACK_GIT_ENV_CLEARED}; run env: ${AMPLIHACK_RUN_ENV_CLEARED} (#2033)" >&2
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      # `main` requires branches to be up to date before merge (the strict
      # policy — see docs/reference/merge-flow.md). A BEHIND branch is brought
      # forward here so CI runs on what will actually be merged.
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "[skip] not a git repo; the branch cannot be brought up to date and is reported unsynced, never as clean" >&2
        printf '{"base":"","synced":"false","conflict":"unknown","head_sha":"","git_observed":"false"}\n'
        exit 0
      fi
      # #2333: the base comes from GraphQL, then REST; never a guessed `main`. An
      # unavailable base merges nothing and says so (merge_sync.reason base-unavailable).
      BASE="$(gh pr view "${PR_NUMBER:-}" --json baseRefName --jq .baseRefName 2>/dev/null \
        || amplihack orch helper autodrive-gh-read pr "${PR_NUMBER:-}" 2>/dev/null | jq -r '.base_ref // empty' 2>/dev/null)"
      case "$BASE" in -*|/*|*/|*..*|*//*|*[!A-Za-z0-9._/-]*) BASE="" ;; esac
      if [ -z "$BASE" ]; then
        echo "WARNING: the PR's base branch is unavailable on every read path; nothing is merged this round, and the next round reads it again." >&2
        printf '{"base":"","synced":"false","conflict":"unknown","head_sha":"%s","git_observed":"true","reason":"base-unavailable"}\n' "$(git rev-parse HEAD 2>/dev/null || printf '')"
        exit 0
      fi
      SYNCED="false"; CONFLICT="false"; RECOMPUTE=""
      if git fetch origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}" >/dev/null 2>&1; then
        BEHIND="$(git rev-list --count "HEAD..refs/remotes/origin/${BASE}" 2>/dev/null || printf 0)"
        if [ "${BEHIND:-0}" != "0" ]; then
          if git merge --no-edit "refs/remotes/origin/${BASE}" >/dev/null 2>&1; then
            SYNCED="true"
            git push >/dev/null 2>&1 || echo "WARNING: merged origin/${BASE} but the push failed; CI will still be reading the old head." >&2
          else
            CONFLICT="true"
            git merge --abort >/dev/null 2>&1 || true
            echo "ERROR: merge conflict against origin/${BASE}. Conflicts are resolved by fixing the branch, never by bypassing the gate." >&2
          fi
        fi
      else
        echo "WARNING: could not fetch origin/${BASE}; up-to-date state is unknown and will be reported as unverified." >&2
      fi
      # R7 (#2472): GitHub left the merge state UNKNOWN at this head last round and
      # still does, so the branch is brought up to date with its base once, which
      # makes GitHub compute it again: the merge above when behind, else
      # update-branch with the expected head SHA. Never retried, never a merge of the PR.
      PREV="${AMPLIHACK_AUTODRIVE_STATE_DIR:-}/merge-ready-latest.json"; HEAD_NOW="$(git rev-parse HEAD 2>/dev/null || printf '')"
      if [ "$CONFLICT" = "false" ] && [ -n "${AMPLIHACK_AUTODRIVE_STATE_DIR:-}" ] && [ -f "$PREV" ] && [ ! -L "$PREV" ] \
         && [ "$(jq -r '.merge_state // ""' "$PREV" 2>/dev/null)" = "UNKNOWN" ]; then
        if [ "$SYNCED" = "true" ]; then
          RECOMPUTE="$(jq -cn --arg s "$HEAD_NOW" '{action:"merge-push",result:"ok",pushed_sha:$s}')"
        elif [ "$(jq -r '.head_sha // ""' "$PREV" 2>/dev/null)" = "$HEAD_NOW" ] \
             && amplihack orch helper autodrive-gh-read pr "${PR_NUMBER:-}" 2>/dev/null | jq -e --arg h "$HEAD_NOW" '.merge_state == "UNKNOWN" and .head_sha == $h' >/dev/null 2>&1; then
          RECOMPUTE="$(amplihack orch helper autodrive-gh-update-branch "${PR_NUMBER:-}" --expected-head-sha "$HEAD_NOW" 2>/dev/null \
            | jq -c '{action, result, rate_limited: (.rate_limited == true), reset_epoch: (.reset_epoch // null)}' 2>/dev/null)"
        fi
        [ -z "$RECOMPUTE" ] || echo "INFO: merge state UNKNOWN at ${HEAD_NOW} two rounds running; recompute: ${RECOMPUTE}" >&2
      fi
      printf '{"base":"%s","synced":"%s","conflict":"%s","head_sha":"%s","git_observed":"true"%s}\n' \
        "$BASE" "$SYNCED" "$CONFLICT" "$(git rev-parse HEAD 2>/dev/null || printf '')" "${RECOMPUTE:+,\"recompute\":${RECOMPUTE}}"
    output: "merge_sync"

  # Criterion 1 is measured by amplifier-bundle/tools/autodrive_qa_evidence.sh:
  # the repository's suite commands, then, only where autodrive_gadugi_required
  # says true (a Node repository, or AUTODRIVE_QA_SCENARIO_DIR set), the qa-team
  # scenarios validated and run with gadugi-test, one process per scenario
  # file. A Rust CLI or Python repository gets gadugi_status NOT_REQUIRED, as
  # qa-team's repo-type table says. It prints one JSON line and writes the
  # same line, private, to autodrive_qa_evidence. A missing tool is an
  # installation fault, so the step fails by name rather than reporting
  # evidence it did not measure.
  - id: "step-02-qa-team-scenarios"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      # #2033: inherited GIT_* (a hook's GIT_DIR, GIT_WORK_TREE, ...) and the outer
      # run's AMPLIHACK_* identity are cleared before any git command, so the
      # repository's own hooks and tests act on this checkout. The helper comes from
      # the tools directory autodrive-merge-round's step-00-tools-dir found once
      # (it requires git-repo-env.sh there); run alone, from AMPLIHACK_HOME. Never
      # through git, which those variables could redirect. Same line as merge-round step-04.
      TOOLS_D="${RECIPE_VAR_autodrive_tools_dir:-}"
      [ -n "$TOOLS_D" ] || TOOLS_D="${AMPLIHACK_HOME:-}/amplifier-bundle/tools"
      [ ! -L "$TOOLS_D/git-repo-env.sh" ] && . "$TOOLS_D/git-repo-env.sh" && amplihack_clear_git_repo_env && amplihack_clear_run_identity_env || { echo "STOP: cannot load git-repo-env.sh from the tools directory (#2033)" >&2; exit 1; }
      echo "INFO: cleared git env: ${AMPLIHACK_GIT_ENV_CLEARED}; run env: ${AMPLIHACK_RUN_ENV_CLEARED} (#2033)" >&2
      cd "${REPO_PATH:-.}" 2>/dev/null || { echo "ERROR: cannot cd to REPO_PATH" >&2; exit 1; }
      T=""; SEARCHED=""
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "[skip] not a git repo once GIT_* is cleared (REPO_PATH); head_sha and the changed paths will be empty" >&2
      fi
      # The QA tool is found by the same path search, never through the git
      # toplevel: an inherited GIT_WORK_TREE could plant one there (#2033).
      for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do
        [ -n "$c" ] || continue
        SEARCHED="${SEARCHED}${SEARCHED:+, }${c}/amplifier-bundle/tools"
        [ -f "$c/amplifier-bundle/tools/autodrive_qa_evidence.sh" ] && { T="$c/amplifier-bundle/tools/autodrive_qa_evidence.sh"; break; }
      done
      if [ -z "$T" ]; then
        echo "ERROR: autodrive-qa-evidence-tool-not-found: autodrive_qa_evidence.sh not found (searched ${SEARCHED:-no root})" >&2
        exit 1
      fi
      # Executed, never sourced, on this directory: REPO_PATH is passed absolute
      # so a relative one is not applied twice. It reads AUTODRIVE_QA_EVIDENCE,
      # AUTODRIVE_ROUND_LABEL and the AUTODRIVE_QA_* overrides from this
      # environment, and returns 0 whenever it produced evidence.
      # #1763: the base branch from step-01 (merge_sync) scopes the QA command
      # to the changed paths; an empty base gives `(unknown)` paths.
      B="$(printf '%s' "${RECIPE_VAR_merge_sync:-}" | amplihack orch helper extract-json --require-field base 2>/dev/null \
        | amplihack orch helper extract-field --field base --default '' 2>/dev/null)" || B=""
      AUTODRIVE_QA_BASE="$B" REPO_PATH="$PWD" bash "$T"
    output: "qa_evidence"

  - id: "step-03-wait-for-ci"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      export GH_PAGER=cat PAGER=cat LESS=FRX
      PR="${PR_NUMBER:-}"
      case "$PR" in ''|*[!0-9]*) PR="$(gh pr view --json number --jq .number 2>/dev/null || printf '')" ;; esac
      if [ -z "$PR" ] || ! command -v jq >/dev/null 2>&1; then
        echo "ERROR: cannot read CI (pr='${PR:-none}', jq present=$(command -v jq >/dev/null 2>&1 && echo yes || echo no)). Unreadable CI is a FAILURE, not a pass." >&2
        printf '{"ci_status":"UNREADABLE","ci_total":"0","ci_pending":"","ci_failing":"","ci_signal":"unreadable"}\n'
        exit 0
      fi
      # #2333/#2472: CI is read ONCE, through GraphQL then REST (autodrive-gh-read
      # checks). Pending or queued checks at the head end the step as PENDING, a
      # wait the loop ends WAITING on (ci@<sha>) and a later drive resumes after.
      # Nothing here sleeps or polls.
      JSON="$(gh pr checks "$PR" --json name,state,bucket 2>/dev/null)"
      [ -n "$JSON" ] || JSON="$(amplihack orch helper autodrive-gh-read checks "$PR" 2>/dev/null | jq -c '.checks // empty' 2>/dev/null)"
      if [ -z "$JSON" ]; then
        echo "ERROR: CI status for #${PR} is unavailable on every read path. Unreadable is never a pass; the round waits on the read." >&2
        printf '{"ci_status":"UNREADABLE","ci_total":"0","ci_pending":"","ci_failing":"","ci_signal":"unreadable"}\n'
        exit 0
      fi
      TOTAL="$(printf '%s' "$JSON" | jq -r 'length' 2>/dev/null)"
      PENDING="$(printf '%s' "$JSON" | jq -r '[.[]|select(.bucket=="pending")]|length' 2>/dev/null)"
      FAILING="$(printf '%s' "$JSON" | jq -r '[.[]|select(.bucket=="fail" or .bucket=="cancel")]|length' 2>/dev/null)"
      [ -n "${PENDING:-}" ] || PENDING="unreadable"
      if [ "$PENDING" = "unreadable" ]; then
        STATUS="UNREADABLE"
      elif [ "$PENDING" != "0" ]; then
        STATUS="PENDING"
        echo "INFO: CI for #${PR} is still running: ${PENDING}/${TOTAL} pending, ${FAILING} failing; recorded as a wait." >&2
      elif [ "${TOTAL:-0}" = "0" ]; then
        STATUS="NO_CHECKS"
        echo "ERROR: #${PR} reports zero CI checks. Zero checks is not a green build." >&2
      elif [ "${FAILING:-1}" = "0" ]; then
        STATUS="GREEN"
      else
        STATUS="RED"
      fi
      SIG="${STATUS}:${FAILING:-?}/${TOTAL:-?}"
      # #2186: a green rollup only lists the checks that exist. Every expected
      # check must exist at the head and pass, so GREEN is lowered to the
      # verdict of autodrive_expected_checks.sh, run read-only and only from
      # AMPLIHACK_HOME (never from a path the PR fills). No new wait.
      if [ "$STATUS" = "GREEN" ]; then
        HB="$(gh pr view "$PR" --json headRefOid,baseRefName --jq '.headRefOid + " " + .baseRefName' 2>/dev/null \
          || amplihack orch helper autodrive-gh-read pr "$PR" 2>/dev/null | jq -r '.head_sha + " " + .base_ref' 2>/dev/null)" || HB=""
        H="${HB%% *}"; B="${HB#* }"; ECS=""; EC_RC=1
        if [ -n "${AMPLIHACK_HOME:-}" ] && [ -f "${AMPLIHACK_HOME}/amplifier-bundle/tools/autodrive_expected_checks.sh" ] \
           && [ -n "$H" ] && [ -n "$B" ] && [ "$H" != "$HB" ]; then
          EC_OUT="$(/bin/bash -p "${AMPLIHACK_HOME}/amplifier-bundle/tools/autodrive_expected_checks.sh" "$H" "$B" 2>/dev/null)"; EC_RC=$?
          EC_LAST="$(printf '%s\n' "$EC_OUT" | tail -n1)"
          ECS="$(printf '%s' "$EC_LAST" | jq -r '.ci_status // empty' 2>/dev/null)"
        fi
        case "${ECS}:${EC_RC}" in
          GREEN:0) ;;
          RED:*|PENDING:*|MISSING:*)
            STATUS="$ECS"
            M="$(printf '%s' "$EC_LAST" | jq -r '.missing | join(",")' 2>/dev/null | tr -cd 'A-Za-z0-9 ._/()&:,+-')"
            SIG="$(printf '%s' "${STATUS}:missing=${M}" | cut -c1-300)" ;;
          *) STATUS="UNREADABLE"; SIG="expected-checks-unreadable" ;;
        esac
      fi
      echo "INFO: CI for #${PR}: ${STATUS} (total=${TOTAL:-?} failing=${FAILING:-?} signal=${SIG})" >&2
      printf '{"ci_status":"%s","ci_total":"%s","ci_pending":"%s","ci_failing":"%s","ci_signal":"%s"}\n' \
        "$STATUS" "${TOTAL:-0}" "$PENDING" "${FAILING:-}" "$SIG"
    output: "ci_evidence"

output:
  format: "markdown"
  template: |
    # Merge evidence ({{autodrive_round_label}})

    **Sync:** {{merge_sync}}

    **qa-team:** {{qa_evidence}}

    **CI:** {{ci_evidence}}
