name: "autodrive-merge-loop"
description: |
  One-release alias (#3049, #3129). The merge-ready loop, its finalisation and
  its base sync are replaced by the shared goal loop: this recipe runs
  autodrive-goal-loop with the pull request goal until the goal ends, a
  hand-off, or the owner stops the run. Every old context key is still
  declared; the autodrive_budget_* keys are accepted and ignored. It brings
  back no stop and no automatic base merge. docs/reference/autodrive-goal-loop.md.
version: "1.0.0"
author: "Amplihack Team"
tags:
  - "auto-drive"
  - "alias"
  - "issue-3129"
recursion:
  max_depth: 6
  max_total_steps: 8
context:
  step_recovery_dir: ""
  repo_path: "."
  pr_number: ""
  pr_url: ""
  task_description: ""
  plan_task_id: ""
  autodrive_state_dir: ""
  autodrive_pr_input: ""
  existing_branch: ""
  autodrive_dry_run: "false"
  autodrive_budget_loop_rounds: ""
  autodrive_budget_total_rounds: ""
  autodrive_budget_wall_seconds: ""
  merge_loop_result: ""
  merge_loop_outcome: ""
  finalize_merge: ""
  base_sync: ""
  sync_loop_result: ""
  sync_loop_outcome: ""
  handoff_result: ""
  no_merge: "true"
  autodrive_invocation_file: ""
  autodrive_authorization: ""
  autodrive_finalization: ""
  build_result: ""
  merge_method: ""
steps:
  - id: "goal-loop"
    type: "recipe"
    recipe: "autodrive-goal-loop"
    context:
      goal_tool: "autodrive_pr_goal.sh"
      goal_file: "skills/auto-drive-to-merge/goal-merge-pr.md"
      goal_once: "false"
output:
  format: "markdown"
  template: |
    Goal loop (the autodrive-merge-loop alias, #3129): {{autodrive_finalization}}
