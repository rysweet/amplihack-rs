name: "autodrive-merge-loop"
description: |
  Phase 3 of auto-drive-to-merge: iterate `autodrive-merge-round` until every
  merge-ready criterion holds — the `merge-ready` skill's criteria, all
  `qa-team` scenarios passing, CI green, no merge conflicts, review threads
  resolved — and then merge behind an evidence gate.

  Before every merge round, `autodrive_crusty_rereview.sh` sends commits made
  after the clean crusty round back to the crusty loop. It runs in this
  phase's loop shell, so that crusty loop runs at the same session depth as
  phase 2's; no round recipe starts a loop.

  There is NO iteration cap here. The terminator is `loop-health-evaluator`
  (issue #1337), which judges absence of progress rather than counting
  attempts. Host safety stays where it belongs: structurally one layer down in
  #1327 and #1332, which refuse with exit code 79.

  NO SILENT MERGE. The merge gate re-verifies every criterion in the run that
  merges, binds all of it to ONE head SHA, writes the evidence down first, and
  merges with a fixed argv that accepts no caller-supplied flags. An unreadable
  criterion is a failure, never a pass.
version: "1.0.0"
author: "Amplihack Team"
tags: ["auto-drive", "merge-ready", "merge", "loop", "issue-1337"]

# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY (issue #439): no step declares `timeout` or
# `timeout_seconds`; the recipe declares no `default_step_timeout`.
#
# PROHIBITIONS: a hook-skipping commit flag and a branch-protection bypass are
# NEVER used anywhere in this workflow. See
# docs/reference/auto-drive-to-merge.md#two-absolute-prohibitions.

recursion:
  max_depth: 6
  max_total_steps: 30

context:
  repo_path: "."
  pr_number: ""
  pr_url: ""
  task_description: ""
  autodrive_state_dir: ""
  # #1543: the user's own pr_number (empty when phase 1 built the PR) and
  # existing_branch. A PR number in pr_number (the build phase's) or in
  # autodrive_pr_input turns on PR worktree resolution in the preflight.
  autodrive_pr_input: ""
  existing_branch: ""
  autodrive_dry_run: "false"
  merge_loop_result: ""

steps:
  - id: "step-01-merge-loop-preflight"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      REPO_CD_OK=0; cd "${REPO_PATH:-.}" 2>/dev/null && REPO_CD_OK=1
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      STATE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || { echo "ERROR: autodrive state helper not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $STATE_HELPER; cwd=$(pwd)" >&2; exit 1; }
      . "$STATE_HELPER"
      # #1543: the operator's own pr_number outranks a guess from the launch checkout.
      # The composer produces autodrive_pr_input as a step output, so it is
      # read through its RECIPE_VAR_ name as well.
      PR_INPUT="${AUTODRIVE_PR_INPUT:-${RECIPE_VAR_autodrive_pr_input:-}}"
      PR="${PR_NUMBER:-}"
      case "$PR" in ''|*[!0-9]*) PR="$PR_INPUT" ;; esac
      # PR_GIVEN: the PR this loop was handed, either the build phase's PR
      # (the composer passes build_result.pr as pr_number) or the operator's.
      # Either names the PR from the platform's side; only the guess below
      # comes from the launch checkout, and a guess never turns resolution on.
      PR_GIVEN="$PR"
      [ -n "$PR" ] || PR="$(gh pr view --json number --jq .number 2>/dev/null || printf '')"
      case "$PR" in ''|*[!0-9]*) PR="" ;; esac
      [ -z "$PR_INPUT" ] || [ -n "$PR" ] \
        || { echo "ERROR: pr_number '${PR_INPUT}' is not a pull request number; refusing to enter the merge loop (#1543)" >&2; exit 1; }
      BRANCH="detached"
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || printf 'detached')"
      else
        echo "[skip] not a git repo; the branch identity falls back to 'detached' rather than being assumed" >&2
      fi
      IDENT="${PR:-$BRANCH}"
      DIR="${AUTODRIVE_STATE_DIR:-}"
      [ -n "$DIR" ] || DIR="$(autodrive_state_dir "${REPO_PATH:-.}" "$IDENT")" || exit 1
      # Private whatever the caller's umask: the merge gate refuses state
      # that anyone else could have written (autodrive_state.sh).
      autodrive_private_dir "$DIR" || exit 1
      STATE="$(autodrive_pr_state "$PR")"
      RUN="true"; WHY="merge-ready loop not yet completed for this PR"
      if [ "$STATE" = "MERGED" ]; then
        RUN="false"; WHY="PR #${PR} is already merged; merged work is never redone"
      elif [ -z "$PR" ]; then
        RUN="false"; WHY="no pull request could be resolved; there is nothing to drive to merge"
      fi
      # #1543: whenever this loop was handed a PR number (the operator's, or
      # the build phase's on a fresh build, where default-workflow builds in
      # its own worktree and the launch checkout stays on main), every
      # evidence step measures the PR head, wherever the run started. Resolve
      # the PR branch's EXISTING worktree and hand it to the loop; refuse
      # rather than measure cwd, and refuse a worktree that is not at the PR
      # head rather than spend rounds that cannot succeed on it.
      json_esc() { case "$1" in *[[:cntrl:]]*) return 1 ;; esac; local s="${1//\\/\\\\}"; printf '%s' "${s//\"/\\\"}"; }
      REPO="${REPO_PATH:-.}"
      if [ "$RUN" = "true" ] && [ -n "$PR_GIVEN" ]; then
        PR_HEAD="${STATE_HELPER%/autodrive_state.sh}/autodrive_pr_head.sh"
        [ -f "$PR_HEAD" ] || { echo "ERROR: merge loop: autodrive_pr_head.sh not found next to $STATE_HELPER; refusing to enter the merge loop (#1543)" >&2; exit 1; }
        # The preflight already changed into REPO_PATH, so the resolver gets
        # $PWD: passing REPO_PATH again would look a relative path up twice
        # (sub/sub). A REPO_PATH it could not enter is refused, never
        # replaced by the launch directory.
        [ "$REPO_CD_OK" = 1 ] || { echo "ERROR: cannot cd to REPO_PATH='${REPO_PATH:-.}'; refusing to enter the merge loop (#1543)" >&2; exit 1; }
        RES="$(bash "$PR_HEAD" --pr "$PR" --branch "${EXISTING_BRANCH:-}" --repo "$PWD")"
        PRC=$?
        if [ "$PRC" -eq 3 ]; then
          echo "ERROR: PR #${PR} head branch '${EXISTING_BRANCH:-<headRefName>}' has no single worktree (searched REPO_PATH=${REPO_PATH:-.} and git worktree list); refusing to enter the merge loop (#1543)" >&2
          exit 1
        elif [ "$PRC" -ne 0 ]; then
          echo "ERROR: PR #${PR} head resolution refused (autodrive_pr_head exit ${PRC}; reason on the line above); refusing to enter the merge loop (#1543)" >&2
          exit 1
        fi
        REPO="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field worktree | amplihack orch helper extract-field --field worktree --default '')"
        HEAD_SHA="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field head_sha | amplihack orch helper extract-field --field head_sha --default '')"
        if [ -z "$REPO" ] || [ ! -d "$REPO" ] || ! [[ "$HEAD_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
          echo "ERROR: autodrive_pr_head returned no usable worktree/head_sha for PR #${PR}; refusing to enter the merge loop (#1543)" >&2
          exit 1
        fi
        # The resolver reports a stale worktree (head_matches=false) and leaves
        # the decision here. Entering the loop on it cannot succeed: the merge
        # gate would refuse every round's evidence, and the loop would end
        # STUCK after paying for evaluator calls.
        MATCH="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field head_matches | amplihack orch helper extract-field --field head_matches --default '')"
        if [ "$MATCH" != "true" ]; then
          WT_HEAD="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field worktree_head | amplihack orch helper extract-field --field worktree_head --default '')"
          REL="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field worktree_relation | amplihack orch helper extract-field --field worktree_relation --default '')"
          FIX="$(printf '%s' "$RES" | amplihack orch helper extract-json --require-field remedy | amplihack orch helper extract-field --field remedy --default '')"
          # The remedy depends on the direction: `pull --ff-only` for a
          # worktree behind the PR head, `push` for one ahead of it (a round
          # whose push failed left its commits here), a merge for diverged.
          echo "ERROR: pr-worktree-stale: worktree ${REPO} is at ${WT_HEAD:-<unreadable>}, PR #${PR} head is ${HEAD_SHA} (worktree ${REL:-not at the PR head}); run: ${FIX:-git -C ${REPO} status, and bring it to the PR head}, then re-run. Refusing to enter the merge loop: the merge gate would refuse every round's evidence (#1543)" >&2
          exit 1
        fi
        echo "INFO: PR #${PR} head ${HEAD_SHA} resolved to worktree ${REPO}" >&2
      fi
      E_DIR="$(json_esc "$DIR")" && E_REPO="$(json_esc "$REPO")" \
        || { echo "ERROR: state_dir or repo contains control characters; refusing to enter the merge loop" >&2; exit 1; }
      echo "INFO: merge-loop preflight: pr=${PR:-<none>} pr_state=${STATE} run=${RUN} (${WHY}) state_dir=${DIR}" >&2
      # No head_sha here: each round reads its own `git rev-parse HEAD` in
      # `repo`, and the check above is what binds `repo` to the PR head.
      printf '{"should_run":"%s","pr":"%s","pr_state":"%s","state_dir":"%s","repo":"%s","reason":"%s"}\n' \
        "$RUN" "$PR" "$STATE" "$E_DIR" "$E_REPO" "$WHY"
    output: "merge_loop_preflight"

  - id: "step-02-merge-ready-loop"
    condition: "merge_loop_preflight.should_run == 'true'"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      LOOP_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || LOOP_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_loop.sh"
      [ -f "$LOOP_HELPER" ] || { echo "ERROR: autodrive loop helper not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $LOOP_HELPER; cwd=$(pwd)" >&2; exit 1; }
      g() { printf '%s' "${MERGE_LOOP_PREFLIGHT:-${RECIPE_VAR_merge_loop_preflight:-}}" | amplihack orch helper extract-json --require-field "$1" \
              | amplihack orch helper extract-field --field "$1" --default ''; }
      DIR="$(g state_dir)"; PR="$(g pr)"; REPO="$(g repo)"
      # Refuse an empty or unsafe state_dir before anything touches it.
      case "$DIR" in
        ''|/|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-merge-loop/step-02]" >&2; exit 1 ;;
      esac
      # Issue #1570: task_description is read with write_context_value
      # (RECIPE_VAR_* or AMPLIHACK_CONTEXT_FILE) into a private file that the
      # loop copies to its state directory. The uppercase TASK_DESCRIPTION
      # alias is not used: the runner omits it for large values.
      H=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/recipe_context_value.sh" ] && { H="$c/amplifier-bundle/tools"; break; }; done
      [ -n "$H" ] || { echo "ERROR: amplifier-bundle/tools/recipe_context_value.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$H/recipe_context_value.sh" || exit 1
      TASK_IN="$(umask 077; mktemp)" || exit 1
      trap 'rm -f -- "$TASK_IN"' EXIT
      write_context_value task_description "$TASK_IN" || { echo "ERROR: task_description unavailable" >&2; exit 1; }
      # Commits after the clean crusty round go back to crusty BEFORE each
      # merge round, from this shell, so that crusty loop runs at this step's
      # depth like phase 2's. Started from a merge round step it would be one
      # runner deeper and refused with exit 79 (PR #1520 review).
      REREVIEW="$(dirname "$LOOP_HELPER")/autodrive_crusty_rereview.sh"
      [ -f "$REREVIEW" ] || { echo "ERROR: autodrive-tools-not-found: ${REREVIEW} (the crusty re-review must come from the loop driver's install)" >&2; exit 1; }
      [ -n "$REPO" ] || { echo "ERROR: preflight produced no repo; refusing to run a loop that would measure the launch checkout (#1543) [autodrive-merge-loop/step-02]" >&2; exit 1; }
      # #1543: the loop runs in the preflight's repo (the PR worktree when
      # pr_number was supplied). Tools stay on the launch side: pin
      # AMPLIHACK_HOME, when it is unset, to the tree this step took its loop
      # helper from (the launch checkout or ~/.copilot / ~/.amplihack), so the
      # rounds' tool ladders never fall through to PR-authored tools. The
      # round recipe is passed by absolute path from that same tree: by name,
      # `recipe run --working-dir <PR worktree>` would take the PR branch's own
      # amplifier-bundle/recipes first and let the PR judge itself (PR #1588).
      ROUND_RECIPE="$(cd "$(dirname "$LOOP_HELPER")/../recipes" 2>/dev/null && pwd -P)/autodrive-merge-round.yaml"
      [ -f "$ROUND_RECIPE" ] || { echo "ERROR: autodrive-recipe-not-found: ${ROUND_RECIPE} (the round recipe must come from the loop driver's install, never the PR worktree) [autodrive-merge-loop/step-02]" >&2; exit 1; }
      if [ -z "${AMPLIHACK_HOME:-}" ]; then
        AMPLIHACK_HOME="$(cd "$(dirname "$LOOP_HELPER")/../.." && pwd -P)" \
          || { echo "ERROR: cannot resolve the tool root of $LOOP_HELPER; refusing to run the loop" >&2; exit 1; }
        export AMPLIHACK_HOME
      fi

      # The review dir is the main checkout of the repository that holds the
      # preflight's repo ($REPO, #1543): the PR head's worktree when a PR
      # number was supplied, else repo_path. The read-only judging agents
      # (review, merge-ready assessment, loop-health analyzer) start there,
      # never in the PR worktree, so the branch under review does not supply
      # their AGENTS.md, CLAUDE.md or .claude hooks; it is never `pwd`, which
      # may be the PR worktree. The PR worktree is resolved from the same
      # $REPO: the #1528 resolver refuses the main checkout and returns the
      # PR's one linked worktree, where only each round's commit step works.
      REVIEW_DIR="$(bash "$(dirname "$LOOP_HELPER")/autodrive_worktree_guard.sh" review-dir "$REPO")" || { echo "STOP: cannot resolve the review dir from the preflight repo ($REPO) [autodrive-merge-loop/step-02] (#1528)" >&2; exit 1; }
      PR_WORKTREE="$(bash "$(dirname "$LOOP_HELPER")/autodrive_pr_worktree.sh" resolve --repo "$REPO" --pr "$PR")" || { echo "STOP: cannot resolve the PR's linked worktree; rounds never run in the launch checkout (#1528)" >&2; exit 1; }
      bash "$LOOP_HELPER" --task-file "$TASK_IN" \
        --loop-name "merge-ready" \
        --before-round "$REREVIEW" \
        --round-recipe "$ROUND_RECIPE" \
        --clean-token "MERGE_READY" \
        --verdict-field "merge_ready_verdict" \
        --repo "$PR_WORKTREE" \
        --review-dir "$REVIEW_DIR" \
        --state-dir "$DIR" \
        --context "repo_path=$PR_WORKTREE" \
        --context "pr_number=${PR}" \
        --context "pr_url=${PR_URL:-}" \
        --context "autodrive_qa_evidence=${DIR}/qa-evidence.json" \
        --context "autodrive_state_dir=${DIR}"
      RC=$?
      if [ "$RC" -eq 79 ]; then
        echo "ERROR: exit 79 terminal policy refusal in the merge-ready loop (#1327/#1332). Final — surfaced and stopped, never retried into the guard." >&2
        exit 79
      fi
      exit "$RC"
    output: "merge_loop_result"

  - id: "step-03-merge-gate"
    condition: "merge_loop_preflight.should_run == 'true'"
    type: "bash"
    parse_json: true
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      GATE="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_merge_gate.sh"
      [ -f "$GATE" ] || GATE="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_merge_gate.sh"
      [ -f "$GATE" ] || GATE="$(pwd)/amplifier-bundle/tools/autodrive_merge_gate.sh"
      [ -f "$GATE" ] || GATE="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_merge_gate.sh"
      [ -f "$GATE" ] || GATE="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_merge_gate.sh"
      [ -f "$GATE" ] || { echo "ERROR: autodrive merge gate not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack): $GATE; cwd=$(pwd)" >&2; exit 1; }
      # Issue #1551: the gh merge guard trusts only [<root bash>, -p, <physical gate path>, ...].
      GATE_PHYS="$(cd "$(dirname "$GATE")" && pwd -P)/$(basename "$GATE")"
      g() { printf '%s' "${MERGE_LOOP_PREFLIGHT:-${RECIPE_VAR_merge_loop_preflight:-}}" | amplihack orch helper extract-json --require-field "$1" \
              | amplihack orch helper extract-field --field "$1" --default ''; }
      DIR="$(g state_dir)"; PR="$(g pr)"
      # Refuse an empty or unsafe state_dir before anything touches it.
      case "$DIR" in
        ''|/|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-merge-loop/step-03]" >&2; exit 1 ;;
      esac
      ARGS=(--pr "$PR" --repo "${REPO_PATH:-.}" --state-dir "$DIR" \
            --round-record "${DIR}/merge-ready-latest.json" \
            --qa-evidence "${DIR}/qa-evidence.json")
      [ "${AUTODRIVE_DRY_RUN:-false}" = "true" ] && ARGS+=(--dry-run)
      # Issue #1551: the guard trusts the gate only with a clean environ: no
      # exported functions, shell-option or loader variables. Cleared in a
      # subshell; exec keeps the gate's argv [/bin/bash, -p, <gate>, ...].
      ( unset -f $(compgen -A function) 2>/dev/null
        export -n SHELLOPTS BASHOPTS 2>/dev/null
        unset BASH_ENV ENV PS4
        exec env -u LD_PRELOAD -u LD_AUDIT -u LD_LIBRARY_PATH /bin/bash -p "$GATE_PHYS" "${ARGS[@]}" )
      RC=$?
      if [ "$RC" -eq 79 ]; then
        echo "ERROR: exit 79 terminal policy refusal at the merge gate. Final — never retried." >&2
        exit 79
      fi
      exit "$RC"
    output: "merge_gate_result"

  - id: "step-04-record-merge-phase"
    condition: "merge_loop_preflight.should_run == 'true'"
    type: "bash"
    command: |
      set -uo pipefail
      cd "${REPO_PATH:-.}" 2>/dev/null || true
      STATE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="$(pwd)/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || STATE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/autodrive_state.sh"
      [ -f "$STATE_HELPER" ] || { echo "WARNING: autodrive state helper not found; this run stays correct but a resumed run will redo the merge-ready loop." >&2; exit 0; }
      . "$STATE_HELPER"
      g() { printf '%s' "${1:-}" | amplihack orch helper extract-json --require-field "$2" \
              | amplihack orch helper extract-field --field "$2" --default ''; }
      DIR="$(g "${MERGE_LOOP_PREFLIGHT:-${RECIPE_VAR_merge_loop_preflight:-}}" state_dir)"; PR="$(g "${MERGE_LOOP_PREFLIGHT:-${RECIPE_VAR_merge_loop_preflight:-}}" pr)"
      # Refuse an empty or unsafe state_dir before anything touches it.
      case "$DIR" in
        ''|/|-*|*$'\n'*) echo "ERROR: no state_dir (empty or unsafe: refusing to touch it) [autodrive-merge-loop/step-04]" >&2; exit 1 ;;
      esac
      RESULT="$(g "${MERGE_GATE_RESULT:-${RECIPE_VAR_merge_gate_result:-}}" merge_result)"
      case "$RESULT" in
        MERGED|ALREADY_MERGED)
          autodrive_mark_phase_done "$DIR" "merge-ready-loop"
          autodrive_mark_phase_done "$DIR" "merged"
          echo "INFO: PR #${PR} recorded as merged (${RESULT})." >&2
          ;;
        *)
          echo "INFO: merge gate result '${RESULT:-unknown}'; the merge phase is NOT recorded complete." >&2
          ;;
      esac
    output: "merge_phase_record"

output:
  format: "markdown"
  template: |
    # Merge-ready loop

    **Preflight:** {{merge_loop_preflight}}

    **Loop result:** {{merge_loop_result}}

    **Merge gate:** {{merge_gate_result}}
