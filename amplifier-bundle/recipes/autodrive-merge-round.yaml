name: "autodrive-merge-round"
description: |
  One-release alias (#3049, #3129). In the old drive this recipe ran one merge-ready round.
  The shared goal loop replaces it: this recipe runs one turn of
  autodrive-goal-loop with the pull request goal (goal_once) and returns.
  Every old context key is still declared. It brings back no gate, no stop and
  no automatic base merge. docs/reference/autodrive-goal-loop.md.
version: "1.0.0"
author: "Amplihack Team"
tags:
  - "auto-drive"
  - "alias"
  - "issue-3129"
recursion:
  max_depth: 6
  max_total_steps: 8
context:
  step_recovery_dir: ""
  repo_path: "."
  reviewed_head_sha: ""
  autodrive_launch_tools: ""
  pr_number: ""
  pr_url: ""
  task_description: ""
  autodrive_round_record: ""
  autodrive_round_label: "round"
  autodrive_qa_evidence: ""
  autodrive_base_branch: ""
  autodrive_resolved_concerns_file: ""
  autodrive_state_dir: ""
  ci_evidence: ""
  qa_evidence: ""
  merge_sync: ""
  qa_evidence_hash: ""
  merge_ready_writeup: ""
  merge_ready_outcome: ""
  merge_ready_word: ""
  merge_ready_assessed_head: ""
  prior_writeup: ""
  platform_facts: ""
  crusty_evidence: ""
  autodrive_tools_dir: ""
  no_merge: "true"
  checks_watch_interval: ""
  autodrive_dry_run: "false"
  merge_method: ""
  autodrive_invocation_file: ""
  autodrive_authorization: ""
  autodrive_finalization: ""
steps:
  - id: "goal-loop"
    type: "recipe"
    recipe: "autodrive-goal-loop"
    context:
      checks_watch_interval: "{{checks_watch_interval}}"
      goal_tool: "autodrive_pr_goal.sh"
      goal_file: "skills/auto-drive-to-merge/goal-merge-pr.md"
      goal_once: "true"
output:
  format: "markdown"
  template: |
    Goal loop (the autodrive-merge-round alias, #3129): {{autodrive_finalization}}
