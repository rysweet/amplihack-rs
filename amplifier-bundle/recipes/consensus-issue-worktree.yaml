name: "consensus-issue-worktree"
description: "Phase 2: issue creation + worktree/branch setup (steps 2-3)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["consensus", "prep", "issue", "worktree"]

# consensus-issue-worktree: extracted from consensus-workflow.yaml as a composable phase brick.
#
# Preserves every original step verbatim — every debate round, every panel
# perspective, every consensus gate. The user's design constraint: the LLM
# converges on correct behaviour through many recursive review layers, so
# no layer may be silently dropped. Context flows in from the parent
# consensus-workflow context via _execute_sub_recipe()'s automatic merging;
# outputs propagate back to the parent for subsequent phase recipes.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 100

context: {}

steps:
  - id: "step2-create-issue"
    type: "bash"
    command: |
      # Create GitHub issue from consensus requirements.
      # Issue #1570: the task and requirement fields are read with
      # write_context_value (RECIPE_VAR_* or AMPLIHACK_CONTEXT_FILE) into private
      # files, and the body reaches gh with --body-file, never through argv.
      H=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/recipe_context_value.sh" ] && { H="$c/amplifier-bundle/tools"; break; }; done
      [ -n "$H" ] || { echo "ERROR: amplifier-bundle/tools/recipe_context_value.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$H/recipe_context_value.sh" || exit 1
      . "$H/workflow_body_file.sh" || exit 1
      umask 077
      V=$(mktemp -d) || exit 1
      trap 'rm -rf -- "$V"' EXIT
      write_context_value task_description "$V/task" || { echo "ERROR: task_description unavailable" >&2; exit 1; }
      for f in explicit_requirements success_criteria constraints consensus_mechanism_used agents_involved confidence_level; do
        write_context_value final_requirements.$f "$V/$f" || { echo "WARN: final_requirements.$f is not available; leaving it empty" >&2; : > "$V/$f"; }
      done
      _CRITICALITY="${CRITICALITY:-}"
      echo "Creating GitHub issue for: $(tr '\n\r' ' ' < "$V/task" | cut -c1-200)"
      sec() { printf '%s\n' "$1"; cat -- "$2"; printf '\n\n'; }
      {
        sec '## Task Description' "$V/task"
        sec '## Requirements (Consensus-Validated)' "$V/explicit_requirements"
        sec '## Success Criteria' "$V/success_criteria"
        sec '## Constraints' "$V/constraints"
        printf '## Consensus Process\n- Mechanism Used: '; cat -- "$V/consensus_mechanism_used"
        printf '\n- Agents Involved: '; cat -- "$V/agents_involved"
        printf '\n- Confidence: '; cat -- "$V/confidence_level"
        printf '\n\n---\nLabels: consensus-validated, %s\n' "$_CRITICALITY"
      } | write_body_file "$V/body" "the consensus-issue-worktree step2 log" || exit 1

      # Create issue (truncate title to 200 chars)
      ISSUE_TITLE=$(tr '\n\r' ' ' < "$V/task" | cut -c1-200)
      gh issue create \
        --title "$ISSUE_TITLE" \
        --body-file "$V/body" \
        --label "consensus,$_CRITICALITY" 2>/dev/null || echo "Issue creation skipped (no gh CLI or not in repo)"

      echo '{"issue_created": true, "step": "step2-create-issue"}'
    output: "issue_creation"
    parse_json: true

  # ============================================================================
  # STEP 3: SETUP WORKTREE AND BRANCH
  # ============================================================================

  - id: "step3-setup-worktree"
    agent: "amplihack:worktree-manager"
    working_dir: "{{worktree_setup.worktree_path}}"
    prompt: |
      Setup git worktree and branch for isolated development:

      **Task:** {{task_description}}
      **Issue:** {{issue_number}}
      **Requirements:** {{final_requirements}}
      **Worktree Directory:** {{worktree_dir}}

      Create worktree setup:
      1. Branch name format: `feat/issue-{number}-{brief-description}` or `feat/{brief-description}`
      2. Create worktree in `{{worktree_dir}}/{branch-name}`
      3. Push branch to remote with tracking

      Commands to execute:
      ```bash
      # NOTE: This pipeline mirrors default-workflow.yaml step-04-setup-worktree with a
      # 30-char limit (vs 50). Keep both in sync on security patches. See Issue #2952.
      # FIX (issue #3041): Use heredoc instead of single-quote wrapping.

      # ========================================================================
      # MIRROR (#342): Existing-branch / PR targeting path.
      # When EXISTING_BRANCH or PR_NUMBER is set, reuse the named branch instead
      # of deriving a slug. EXISTING_BRANCH wins on tie (WARNING to stderr).
      # Keep in sync with default-workflow.yaml step-04-setup-worktree.
      # ========================================================================
      EXISTING_BRANCH="${EXISTING_BRANCH:-}"
      PR_NUMBER="${PR_NUMBER:-}"
      if [ -n "$EXISTING_BRANCH" ] || [ -n "$PR_NUMBER" ]; then
        if [ -n "$EXISTING_BRANCH" ] && [ -n "$PR_NUMBER" ]; then
          echo "WARNING: both 'existing_branch' and 'pr_number' set — using existing_branch ('$EXISTING_BRANCH'), ignoring pr_number ('$PR_NUMBER')." >&2
        fi
        if [ -n "$EXISTING_BRANCH" ]; then
          BRANCH_NAME="$EXISTING_BRANCH"
        else
          # SECURITY: PR_NUMBER must be a positive integer before passing to gh.
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: pr_number '$PR_NUMBER' is not a valid positive integer (arg-injection guard)." >&2
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: pr_number is set but the 'gh' CLI is not on PATH." >&2
            exit 1
          fi
          BRANCH_NAME="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || true)"
          if [ -z "$BRANCH_NAME" ]; then
            echo "ERROR: 'gh pr view $PR_NUMBER' returned no branch name." >&2
            exit 1
          fi
        fi
        # SECURITY: validate (or re-validate) branch name via authoritative checker.
        if ! git check-ref-format --branch "$BRANCH_NAME" >/dev/null 2>&1; then
          echo "ERROR: branch name '$BRANCH_NAME' is invalid (git check-ref-format rejection)." >&2
          exit 1
        fi
        echo "INFO: Targeting existing branch '$BRANCH_NAME' (issue #342 path)." >&2
        git fetch origin "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" >&2 2>/dev/null || true
        WORKTREE_PATH="$WORKTREE_DIR/$BRANCH_NAME"
        EXISTING_WT="$(git worktree list --porcelain | awk -v b="refs/heads/$BRANCH_NAME" '
          $1=="worktree" { wt=$2 }
          $1=="branch" && $2==b { print wt; exit }
        ')"
        if [ -n "$EXISTING_WT" ]; then
          # #858: never reuse the caller checkout itself as a task worktree — it
          # may carry unrelated local commits or uncommitted files.
          REPO_REAL="$(pwd -P)"
          # Gate A (#858): git reports a worktree for the branch but its path is
          # inaccessible (stale registration leaked by a prior failed run). Refuse
          # and advise `git worktree prune` rather than emitting a bogus path.
          if ! EXISTING_WT_REAL="$(cd "$EXISTING_WT" 2>/dev/null && pwd -P)"; then
            echo "ERROR: git reports an existing worktree for branch '$BRANCH_NAME' at '$EXISTING_WT', but that path is not accessible." >&2
            echo "ERROR: run 'git worktree prune' or remove the stale registration before retrying; refusing to guess a fallback worktree (issue #858)." >&2
            exit 1
          fi
          if [ "$EXISTING_WT_REAL" = "$REPO_REAL" ]; then
            echo "ERROR: existing branch '$BRANCH_NAME' is checked out in the caller repository — refusing to use the caller checkout as a recipe task worktree (issue #858)." >&2
            echo "ERROR: run the recipe from a clean base checkout or detach/switch the caller checkout before targeting this branch." >&2
            exit 1
          fi
          WORKTREE_PATH="$EXISTING_WT"
        elif [ "$(git symbolic-ref --short HEAD 2>/dev/null || true)" = "$BRANCH_NAME" ]; then
          # #858: the caller checkout is sitting on the target branch. Do NOT reuse
          # $(pwd) as the worktree — that leaks the caller's dirty tree and any
          # unrelated local commits into the recipe's branch. Fail closed instead.
          echo "ERROR: existing branch '$BRANCH_NAME' is checked out in the caller repository — refusing to use the caller checkout as a recipe task worktree (issue #858)." >&2
          echo "ERROR: run the recipe from a clean base checkout or detach/switch the caller checkout before targeting this branch." >&2
          exit 1
        elif git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
          git worktree add -- "$WORKTREE_PATH" "$BRANCH_NAME" >&2
        elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
          git worktree add --track -b "$BRANCH_NAME" -- "$WORKTREE_PATH" "origin/$BRANCH_NAME" >&2
        else
          echo "ERROR: branch '$BRANCH_NAME' not found locally or on origin." >&2
          exit 1
        fi
        printf '{"branch_name": "%s", "worktree_path": "%s", "commands_executed": ["existing-branch path #342"], "setup_complete": true}\n' \
          "$BRANCH_NAME" "$WORKTREE_PATH"
        exit 0
      fi

      # --- #858: remote-only base-ref resolution (NO caller-HEAD fallback) ---
      # A recipe task worktree must ALWAYS branch off a freshly-fetched remote
      # base ref, never the caller checkout's (possibly dirty, non-main) HEAD.
      # The old BASE_REF="HEAD" bootstrap fallback baked the caller's unrelated
      # local commits + uncommitted tree into the task branch, tangling
      # concurrent recipes. We now fetch origin and resolve a remote base ref;
      # if none resolves we FAIL CLOSED and visibly rather than inherit caller
      # state. Mirrors workflow-worktree.yaml step-04-setup-worktree.
      resolve_base_ref() {
        local candidate

        candidate="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        if [ -n "$candidate" ] && git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
          printf '%s\n' "$candidate"
          return 0
        fi

        git remote set-head origin -a >/dev/null 2>&1 || true
        candidate="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        if [ -n "$candidate" ] && git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
          printf '%s\n' "$candidate"
          return 0
        fi

        for candidate in origin/main origin/master origin/develop; do
          if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then
            printf '%s\n' "$candidate"
            return 0
          fi
        done

        echo "ERROR: no supported remote base ref found. Expected origin/HEAD, origin/main, origin/master, or origin/develop." >&2
        return 1
      }

      fetch_origin_with_retry() {
        local attempt status delay=1 max_attempts=3
        for attempt in 1 2 3; do
          if git fetch origin --no-tags >&2; then
            return 0
          fi
          status=$?
          if [ "$attempt" -lt "$max_attempts" ]; then
            echo "WARNING: git fetch origin failed (exit ${status}); retrying (${attempt}/${max_attempts})." >&2
            sleep "$delay"
            delay=$((delay * 2))
            continue
          fi
          echo "WARNING: git fetch origin failed after ${max_attempts} attempts (exit ${status}); continuing with local refs." >&2
          return 0
        done
      }

      if ! git remote get-url origin >/dev/null 2>&1; then
        echo "ERROR: no 'origin' remote configured — refusing to create a task worktree off the caller's HEAD (issue #858)." >&2
        echo "ERROR: a recipe task worktree must branch off a fetched remote base ref, never the caller checkout." >&2
        exit 1
      fi
      fetch_origin_with_retry
      if ! BASE_REF="$(resolve_base_ref)"; then
        echo "ERROR: could not resolve a remote base ref — refusing to fall back to caller HEAD (issue #858)." >&2
        exit 1
      fi
      BASE_BRANCH="${BASE_REF#origin/}"
      BOOTSTRAP=false

      # FIX (#469/#311): Use env var — safe against injection and word-splitting.
      TASK_DESC="$TASK_DESCRIPTION"
      TASK_SLUG=$(printf '%s' "$TASK_DESC" | tr '\n\r' '  ' | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-' | sed 's/-\{2,\}/-/g;s/^-//;s/-$//' | cut -c1-30 | sed 's/-$//')
      # Guard: empty slug (blank/all-symbol input) produces a trailing-hyphen branch that
      # git check-ref-format accepts as valid but is undesirable. Catch it explicitly first.
      if [ -z "$TASK_SLUG" ]; then
        echo "WARNING: task_description produced an empty slug — falling back to task-unnamed" >&2
        BRANCH_NAME="feat/task-unnamed-$(date +%s)"
      else
        BRANCH_NAME="feat/consensus-${TASK_SLUG}"
        if ! git check-ref-format --branch "${BRANCH_NAME}" >/dev/null 2>&1; then
          echo "WARNING: derived branch name '${BRANCH_NAME}' is invalid — falling back to task-unnamed" >&2
          BRANCH_NAME="feat/task-unnamed-$(date +%s)"
        fi
      fi

      # Create worktree (base ref already resolved to a remote ref above; #858).

      # --- Foreign-worktree deconfliction (concurrency-safety) ---
      # MIRROR of workflow-worktree.yaml step-04-setup-worktree. Before the
      # idempotency guard's `git branch -D`, check whether BRANCH_NAME is held by
      # a FOREIGN worktree at a DIFFERENT path (a concurrent recipe that derived
      # the same slug). If so the helper returns a NEW provably-free branch name
      # (recompute WORKTREE_PATH) instead of deleting the foreign branch; else it
      # returns the candidate unchanged. Best-effort (#829/#840): a missing helper
      # is a graceful no-op. Keep this mirror in sync with the executable recipe.
      DECONFLICT_HELPER="${AMPLIHACK_HOME:-$(pwd)}/amplifier-bundle/tools/workflow_worktree_deconflict.sh"
      [ -f "$DECONFLICT_HELPER" ] || DECONFLICT_HELPER="$(pwd)/amplifier-bundle/tools/workflow_worktree_deconflict.sh"
      [ -f "$DECONFLICT_HELPER" ] || DECONFLICT_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_worktree_deconflict.sh"
      if [ -f "$DECONFLICT_HELPER" ]; then
        # Let helper diagnostics (stderr) surface; branch on EXIT CODE so a clean
        # resolution (exit 0) is distinguished from exhaustion/misconfig (non-zero).
        # On failure, fail loud instead of silently reusing the CONFLICTING name
        # (which would re-abort at the idempotency guard's `git branch -D`).
        if RESOLVED_BRANCH="$(bash "$DECONFLICT_HELPER" resolve "$BRANCH_NAME" "$WORKTREE_DIR/$BRANCH_NAME" "$(pwd)")"; then
          if [ -n "$RESOLVED_BRANCH" ] && [ "$RESOLVED_BRANCH" != "$BRANCH_NAME" ]; then
            echo "INFO: branch '$BRANCH_NAME' is owned by a foreign worktree — deconflicting to '$RESOLVED_BRANCH'." >&2
            BRANCH_NAME="$RESOLVED_BRANCH"
          fi
        else
          echo "ERROR: worktree branch deconfliction failed for '$BRANCH_NAME' (helper exhausted its bounded retries or hit a misconfiguration; see stderr above). Aborting to avoid clobbering a concurrent foreign worktree." >&2
          exit 1
        fi
      fi

      # Idempotency guard (mirrors default-workflow three-state check)
      WORKTREE_PATH="$WORKTREE_DIR/$BRANCH_NAME"
      BRANCH_EXISTS=$(git branch --list "$BRANCH_NAME")
      WORKTREE_EXISTS=$(git worktree list --porcelain | grep -Fx "worktree $WORKTREE_PATH" || true)

      if [ -n "$BRANCH_EXISTS" ] && [ -n "$WORKTREE_EXISTS" ]; then
        # FIX (issue #200): Verify branch cleanliness before reusing.
        WORKTREE_DIRTY=$(git -C "$WORKTREE_PATH" status --porcelain 2>/dev/null || true)
        COMMITS_AHEAD=$(git -C "$WORKTREE_PATH" rev-list --count "$BASE_REF"..HEAD 2>/dev/null || echo "0")
        if [ -n "$WORKTREE_DIRTY" ] || [ "$COMMITS_AHEAD" -gt 0 ]; then
          echo "WARNING: Existing branch '$BRANCH_NAME' is dirty — resetting to $BASE_REF." >&2
          git -C "$WORKTREE_PATH" checkout -- . 2>/dev/null || true
          git -C "$WORKTREE_PATH" clean -fd 2>/dev/null || true
          git -C "$WORKTREE_PATH" reset --hard "$BASE_REF" >&2
        else
          echo "INFO: Branch '$BRANCH_NAME' and worktree already exist and are clean — reusing." >&2
        fi
      elif [ -n "$BRANCH_EXISTS" ] && [ -z "$WORKTREE_EXISTS" ]; then
        # FIX (issue #200): Check for unmerged commits before reattaching.
        COMMITS_AHEAD=$(git rev-list --count "$BASE_REF".."$BRANCH_NAME" 2>/dev/null || echo "0")
        if [ "$COMMITS_AHEAD" -gt 0 ]; then
          echo "WARNING: Existing branch '$BRANCH_NAME' has unmerged commits — resetting." >&2
          git branch -D "$BRANCH_NAME" >&2
          git worktree add "$WORKTREE_PATH" -b "$BRANCH_NAME" "$BASE_REF"
        else
          echo "INFO: Branch '$BRANCH_NAME' exists (clean) but worktree missing — adding without -b." >&2
          git worktree add "$WORKTREE_PATH" "$BRANCH_NAME"
        fi
      else
        git worktree add "$WORKTREE_PATH" -b "$BRANCH_NAME" "$BASE_REF"
      fi

      # Push with tracking (bootstrap-aware)
      cd "$WORKTREE_PATH"
      if [ "$BOOTSTRAP" = "true" ]; then
        echo "BOOTSTRAP: Skipping push — no remote main branch available." >&2
      else
        git push -u origin "$BRANCH_NAME" > /dev/null 2>&1 || \
          echo "WARNING: Initial push of '$BRANCH_NAME' failed — will retry at PR creation." >&2
      fi
      ```

      Return setup details as JSON:
      ```json
      {
        "branch_name": "the branch name created",
        "worktree_path": "full path to worktree",
        "commands_executed": ["list of git commands"],
        "setup_complete": true/false
      }
      ```
    output: "worktree_setup"
    parse_json: true

  # ============================================================================
  # STEP 4: RESEARCH AND DESIGN WITH TDD (ALWAYS CONSENSUS)
  # MANDATORY CONSENSUS TRIGGER: Design decisions have long-term architectural impact
  # ============================================================================

  # ---------------------------------------------------------------------------
  # CONSENSUS GATE 2: Multi-Agent Debate for Architecture (MANDATORY)
  # Deploy 5 agents in parallel: architect, api-designer, database, security, tester
  # ---------------------------------------------------------------------------
