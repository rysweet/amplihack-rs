name: "consensus-pr-feedback"
description: "Phase 9: implement PR feedback + push + 4-perspective philosophy panel (steps 12-13)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["consensus", "feedback", "philosophy"]

# consensus-pr-feedback: extracted from consensus-workflow.yaml as a composable phase brick.
#
# Preserves every original step verbatim — every debate round, every panel
# perspective, every consensus gate. The user's design constraint: the LLM
# converges on correct behaviour through many recursive review layers, so
# no layer may be silently dropped. Context flows in from the parent
# consensus-workflow context via _execute_sub_recipe()'s automatic merging;
# outputs propagate back to the parent for subsequent phase recipes.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 100

context: {}

steps:
  - id: "step12-push-updates"
    condition: "pr_review_consensus.final_verdict == 'needs_work'"
    type: "bash"
    working_dir: "{{worktree_setup.worktree_path}}"
    command: |
      set -euo pipefail
      export GIT_PAGER=cat
      export PAGER=cat
      export LESS=FRX
      echo "Pushing review updates..."
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "ERROR: step12-push-updates requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2
        exit 1
      fi
      S=""; case "${WORKFLOW_STAGE_CHANGES_HELPER:-}" in /*) if [ -f "$WORKFLOW_STAGE_CHANGES_HELPER" ]; then S="$WORKFLOW_STAGE_CHANGES_HELPER"; fi;; esac; [ -n "$S" ] || for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/workflow_stage_changes.sh" ] && { S="$c/amplifier-bundle/tools/workflow_stage_changes.sh"; break; }; done
      [ -n "$S" ] || { echo "ERROR: amplifier-bundle/tools/workflow_stage_changes.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$S"  # #2839: private root run/reports/ stays on disk and out of the index
      amplihack hygiene artifact-guard --repo . --mode pre-publish
      stage_workflow_changes; amplihack hygiene artifact-guard --repo . --mode pre-publish
      STAGED=$(git diff --cached --name-only)
      if [ -n "$STAGED" ]; then
        GIT_IDENTITY_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(git rev-parse --show-toplevel)}}/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(git rev-parse --show-toplevel)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(pwd)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || { echo "ERROR: git identity helper not found: $GIT_IDENTITY_HELPER" >&2; exit 2; }; . "$GIT_IDENTITY_HELPER"
        amplihack_prepare_git_commit_identity
        git commit -m "Address PR review feedback"
      else
        echo "Nothing to commit (working tree clean)" >&2
      fi
      UPDATES_PUSHED=false
      PUSH_REASON="no_remote"
      if git remote get-url origin >/dev/null 2>&1; then
        # #2994: merge a moved remote, never rebase; #2839: autostash keeps the unstaged report. One pull, then one push.
        # git's output goes to stderr with URL user-info redacted (step-20b's expression); a failure goes to step12-push-recovery.
        redact_to_stderr() { ( set -o pipefail; "$@" 2>&1 | sed -E 's#(https?://)[^@[:space:]]+@#\1REDACTED@#g' >&2 ); }
        # #1930: setup pushes nothing, so a new branch has no upstream. Its first push here sets it with -u; there is nothing to pull yet. MIRROR: consensus-publish.yaml step9.
        FIRST_PUSH_BRANCH=""; git rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1 || FIRST_PUSH_BRANCH="$(git branch --show-current)"
        pull_rc=0; [ -n "$FIRST_PUSH_BRANCH" ] || redact_to_stderr workflow_pull_merge || pull_rc=$?
        if [ "$pull_rc" -ne 0 ]; then
          echo "ERROR: git pull --no-rebase failed during consensus step12-push-updates (exit $pull_rc); nothing was pushed" >&2
          PUSH_REASON="push_failed"
        else
          push_rc=0; redact_to_stderr git push ${FIRST_PUSH_BRANCH:+-u origin "HEAD:$FIRST_PUSH_BRANCH"} || push_rc=$?
          if [ "$push_rc" -eq 0 ]; then
            UPDATES_PUSHED=true
            PUSH_REASON="success"
          else
            echo "ERROR: git push failed during consensus step12-push-updates (exit $push_rc)" >&2
            PUSH_REASON="push_failed"
          fi
        fi
      else
        echo "Skipping push — no remote configured" >&2
      fi
      echo "{\"updates_pushed\": $UPDATES_PUSHED, \"push_reason\": \"$PUSH_REASON\"}"
    output: "review_updates"
    parse_json: true

  # #2994: a refused merge or push goes to the agent, which merges, resolves or explains.
  - id: "step12-push-recovery"
    type: "recipe"
    recipe: "push-failure-recovery"
    condition: "pr_review_consensus.final_verdict == 'needs_work' && review_updates.push_reason == 'push_failed'"
    context: { push_step: "step12-push-updates", push_output_key: "review_updates", push_recovery_snapshot: "", push_recovery: "", push_recovery_result: "" }

  # ============================================================================
  # STEP 13: PHILOSOPHY COMPLIANCE CHECK (EXPERT PANEL)
  # MANDATORY CONSENSUS TRIGGER: Final philosophy validation
  # ============================================================================

  # ---------------------------------------------------------------------------
  # CONSENSUS GATE 6: Philosophy Compliance Panel (MANDATORY)
  # Deploy: reviewer, patterns, cleanup + philosophy-guardian
  # ---------------------------------------------------------------------------

  - id: "step13-philosophy-reviewer"
    agent: "amplihack:reviewer"
    working_dir: "{{worktree_setup.worktree_path}}"
    prompt: |
      PHILOSOPHY COMPLIANCE - Reviewer Agent

      **Implementation:** {{refined_implementation}}
      **Requirements:** {{final_requirements}}

      Final philosophy validation:
      - Zero-BS verification (no stubs, TODOs, placeholders)
      - Ruthless simplicity achieved WITHIN user requirements
      - All tests passing

      Return as JSON:
      ```json
      {
        "perspective": "reviewer",
        "zero_bs_violations": ["any violations"],
        "simplicity_assessment": "achieved/needs_work",
        "complexity_justified": ["complexity justified by requirements"],
        "approved": true/false
      }
      ```
    output: "philosophy_reviewer"
    parse_json: true

  - id: "step13-philosophy-patterns"
    agent: "amplihack:patterns"
    working_dir: "{{worktree_setup.worktree_path}}"
    prompt: |
      PHILOSOPHY COMPLIANCE - Patterns Agent

      **Implementation:** {{refined_implementation}}
      **Design:** {{design_consensus}}

      Pattern compliance verification:
      - Bricks & studs pattern followed
      - Regeneratable design verified
      - Clean module boundaries

      Return as JSON:
      ```json
      {
        "perspective": "patterns",
        "bricks_studs_compliant": true/false,
        "regeneratable": true/false,
        "module_boundaries_clean": true/false,
        "violations": ["any violations"],
        "approved": true/false
      }
      ```
    output: "philosophy_patterns"
    parse_json: true

  - id: "step13-philosophy-cleanup"
    agent: "amplihack:cleanup"
    working_dir: "{{worktree_setup.worktree_path}}"
    prompt: |
      PHILOSOPHY COMPLIANCE - Cleanup Agent

      **Implementation:** {{refined_implementation}}
      **Requirements:** {{final_requirements}}

      Final cleanup verification:
      - No dead code
      - No stubs remaining
      - Ruthless simplicity achieved

      Return as JSON:
      ```json
      {
        "perspective": "cleanup",
        "dead_code_found": ["any dead code"],
        "stubs_found": ["any stubs"],
        "simplicity_achieved": true/false,
        "approved": true/false
      }
      ```
    output: "philosophy_cleanup"
    parse_json: true

  - id: "step13-philosophy-guardian"
    agent: "amplihack:philosophy-guardian"
    working_dir: "{{worktree_setup.worktree_path}}"
    prompt: |
      PHILOSOPHY GUARDIAN - Final Validation

      **Implementation:** {{refined_implementation}}
      **Requirements:** {{final_requirements}}
      **Panel Reviews:**
      - Reviewer: {{philosophy_reviewer}}
      - Patterns: {{philosophy_patterns}}
      - Cleanup: {{philosophy_cleanup}}

      As the Philosophy Guardian, perform final validation:
      1. All agents must agree code meets philosophy
      2. Verify ruthless simplicity WITHIN user requirements
      3. Confirm bricks & studs pattern followed
      4. Ensure zero-BS implementation

      Return as JSON:
      ```json
      {
        "unanimous_philosophy_approval": true/false,
        "panel_signoff": {
          "reviewer": true/false,
          "patterns": true/false,
          "cleanup": true/false
        },
        "philosophy_principles_met": {
          "ruthless_simplicity": true/false,
          "bricks_and_studs": true/false,
          "zero_bs": true/false,
          "regeneratable": true/false,
          "test_driven": true/false
        },
        "complexity_justified_by_requirements": ["justified complexity"],
        "final_approval": true/false
      }
      ```
    output: "philosophy_consensus"
    parse_json: true

  # ============================================================================
  # STEP 14: ENSURE PR IS MERGEABLE
  # ============================================================================
