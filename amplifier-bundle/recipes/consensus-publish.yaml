name: "consensus-publish"
description: "Phase 7: commit + create PR (steps 9-10)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["consensus", "commit", "pr"]

# consensus-publish: extracted from consensus-workflow.yaml as a composable phase brick.
#
# Preserves every original step verbatim — every debate round, every panel
# perspective, every consensus gate. The user's design constraint: the LLM
# converges on correct behaviour through many recursive review layers, so
# no layer may be silently dropped. Context flows in from the parent
# consensus-workflow context via _execute_sub_recipe()'s automatic merging;
# outputs propagate back to the parent for subsequent phase recipes.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 100

context: {}

steps:
  - id: "step9-commit"
    type: "bash"
    command: |
      set -euo pipefail
      echo "Committing changes..."
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "ERROR: step9-commit requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2
        exit 1
      fi

      # Stage all changes
      amplihack hygiene artifact-guard --repo . --mode pre-publish
      git add -A; amplihack hygiene artifact-guard --repo . --mode pre-publish

      # Issue #1570: agent text is read with write_context_value (RECIPE_VAR_* or
      # AMPLIHACK_CONTEXT_FILE) into private files and never placed in argv.
      H=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/recipe_context_value.sh" ] && { H="$c/amplifier-bundle/tools"; break; }; done
      [ -n "$H" ] || { echo "ERROR: amplifier-bundle/tools/recipe_context_value.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$H/recipe_context_value.sh" || exit 1
      umask 077
      TASK_FILE=$(mktemp); REQS_SUMMARY_FILE=$(mktemp); COMMIT_MSG_FILE=$(mktemp)
      trap 'rm -f -- "$TASK_FILE" "$REQS_SUMMARY_FILE" "$COMMIT_MSG_FILE"' EXIT
      write_context_value task_description "$TASK_FILE" || exit 1
      write_context_value final_requirements.task_summary "$REQS_SUMMARY_FILE" || { echo "WARN: final_requirements.task_summary is not available; leaving it empty" >&2; : > "$REQS_SUMMARY_FILE"; }
      _IS_CRITICAL="${IS_CRITICAL_CODE:-}"
      _ISSUE_NUM="${ISSUE_NUMBER:-}"
      SHORT_DESC=$(tr '\n\r' ' ' < "$TASK_FILE" | cut -c1-72)
      {
        printf 'feat: %s\n\nImplements ' "$SHORT_DESC"
        cat -- "$REQS_SUMMARY_FILE"
        printf '\n\nConsensus Mechanisms Used:\n- Multi-Agent Debate: Requirements clarification\n- Multi-Agent Debate: Architecture design\n- N-Version Programming: %s\n- Expert Panel: Refactoring review\n\nRequirements validated by consensus process.\n\nResolves #%s\n' "$_IS_CRITICAL" "$_ISSUE_NUM"
      } > "$COMMIT_MSG_FILE"

      COMMITTED=false
      if [ -n "$(git diff --cached --name-only)" ]; then
        GIT_IDENTITY_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(git rev-parse --show-toplevel)}}/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(git rev-parse --show-toplevel)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(pwd)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || { echo "ERROR: git identity helper not found: $GIT_IDENTITY_HELPER" >&2; exit 2; }; . "$GIT_IDENTITY_HELPER"
        amplihack_prepare_git_commit_identity
        if git commit -F "$COMMIT_MSG_FILE"; then
          COMMITTED=true
        else
          commit_rc=$?
          echo "ERROR: git commit failed during consensus step9-commit (exit $commit_rc)" >&2
          exit "$commit_rc"
        fi
      else
        echo "No staged changes to commit" >&2
      fi
      PUSH_RESULT=false
      PUSH_REASON="no_remote"
      if git remote get-url origin >/dev/null 2>&1; then
        if git pull --rebase 2>/dev/null && git push 2>/dev/null; then
          PUSH_RESULT=true
          PUSH_REASON="success"
        else
          PUSH_REASON="push_failed"
        fi
      else
        echo "Skipping push — no remote configured" >&2
      fi

      echo "{\"committed\": $COMMITTED, \"pushed\": $PUSH_RESULT, \"push_reason\": \"$PUSH_REASON\"}"
    output: "commit_result"
    parse_json: true

  # ============================================================================
  # STEP 10: OPEN PULL REQUEST
  # ============================================================================

  - id: "step10-create-pr"
    type: "bash"
    command: |
      echo "Creating pull request..."
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "ERROR: step10-create-pr requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2
        exit 1
      fi

      # Issue #1570: agent text is read with write_context_value (RECIPE_VAR_* or
      # AMPLIHACK_CONTEXT_FILE) into private files and never placed in argv.
      H=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/recipe_context_value.sh" ] && { H="$c/amplifier-bundle/tools"; break; }; done
      [ -n "$H" ] || { echo "ERROR: amplifier-bundle/tools/recipe_context_value.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack)" >&2; exit 2; }
      . "$H/recipe_context_value.sh" || exit 1
      . "$H/workflow_body_file.sh" || exit 1
      umask 077
      TASK_FILE=$(mktemp) && REQS_FILE=$(mktemp) && MECH_FILE=$(mktemp) && PR_BODY_FILE=$(mktemp) || exit 1
      trap 'rm -f -- "$TASK_FILE" "$REQS_FILE" "$MECH_FILE" "$PR_BODY_FILE"' EXIT
      write_context_value task_description "$TASK_FILE" || exit 1
      write_context_value final_requirements.explicit_requirements "$REQS_FILE" || { echo "WARN: final_requirements.explicit_requirements is not available; leaving it empty" >&2; : > "$REQS_FILE"; }
      write_context_value final_requirements.consensus_mechanism_used "$MECH_FILE" || { echo "WARN: final_requirements.consensus_mechanism_used is not available; leaving it empty" >&2; : > "$MECH_FILE"; }
      _IS_CRITICAL="${IS_CRITICAL_CODE:-}"
      _TDD_TOTAL="${TDD_TESTS_TOTAL_TESTS:-}"
      _LOCAL_PASSED="${LOCAL_TESTING_ALL_SCENARIOS_PASSED:-}"
      _ISSUE_NUM="${ISSUE_NUMBER:-}"
      {
        printf '## Description\n'; cat -- "$TASK_FILE"
        printf '\n\n## Requirements (Consensus-Validated)\n'; cat -- "$REQS_FILE"
        printf '\n\n## Design Decisions\nArchitecture consensus achieved with:\n- Architect, API Designer, Database, Security, Tester agents\n- 3 rounds of structured debate\n- All conflicts resolved with documented rationale\n\n'
        printf '## Consensus Mechanisms Applied\n- [x] Multi-Agent Debate: Requirements ('; cat -- "$MECH_FILE"
        printf ')\n- [x] Multi-Agent Debate: Architecture design\n- [x] N-Version Programming: %s\n- [x] Expert Panel: Refactoring review\n\n' "$_IS_CRITICAL"
        printf '## Test Plan\n- Unit tests: %s tests\n- Local testing: %s\n- Coverage: All requirements mapped to tests\n\n' "$_TDD_TOTAL" "$_LOCAL_PASSED"
        printf '## Checklist\n- [x] Consensus design followed\n- [x] All tests passing\n- [x] Pre-commit hooks passing\n- [x] Local testing completed\n- [x] No stubs/TODOs/placeholders\n\nResolves #%s\n\n---\nLabel: consensus-validated\n' "$_ISSUE_NUM"
      } | write_body_file "$PR_BODY_FILE" "the consensus-publish step10 log" || exit 1

      PR_TITLE=$(tr '\n\r' ' ' < "$TASK_FILE" | cut -c1-200)
      PR_CREATED=false
      if git remote get-url origin >/dev/null 2>&1; then
        # FIX (#495): capture gh stderr so we can emit a workflow-command
        # warning when the push succeeded earlier but PR creation now fails.
        # Without this, branches get stranded silently. `::` is replaced with
        # `:_:` to defend against workflow-command injection in stderr.
        _pr_stderr_file=$(mktemp -t consensus-pr-XXXXXX)
        if gh pr create \
          --title "$PR_TITLE" \
          --body-file "$PR_BODY_FILE" \
          --label "consensus-validated" 2>"$_pr_stderr_file"; then
          PR_CREATED=true
        else
          _pr_rc=$?
          echo "PR creation failed (exit $_pr_rc)" >&2
          cat "$_pr_stderr_file" >&2
          # If the prior step9 push succeeded, this is a stranded-branch case
          # — emit a GitHub Actions workflow-command warning so it's visible
          # in CI logs. Sanitize `::` to prevent workflow-command injection.
          if [ "${COMMIT_RESULT_PUSHED:-false}" = "true" ] || [ "${COMMIT_RESULT_PUSHED:-false}" = "True" ]; then
            _safe_msg=$(sed -E 's/::/:_:/g' "$_pr_stderr_file" | tr '\n' ' ' | head -c 400)
            echo "::warning title=consensus-publish stranded push::push succeeded (commit_result.pushed=true) but gh pr create failed: ${_safe_msg}" >&2
          fi
        fi
        rm -f "$_pr_stderr_file"
      else
        echo "Skipping PR creation — no remote configured" >&2
      fi

      echo "{\"pr_created\": $PR_CREATED}"
    output: "pr_result"
    parse_json: true

  # ============================================================================
  # STEP 11: REVIEW THE PR (ALWAYS EXPERT PANEL)
  # MANDATORY CONSENSUS TRIGGER: Final PR review requires expert panel
  # ============================================================================

  # ---------------------------------------------------------------------------
  # CONSENSUS GATE 5: Expert Panel for PR Review (MANDATORY)
  # Deploy: reviewer, security, optimizer, patterns, tester agents
  # ---------------------------------------------------------------------------
