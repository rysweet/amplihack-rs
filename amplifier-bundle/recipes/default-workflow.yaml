name: "default-workflow"
description: "Composable 23-step development workflow — orchestrates 9 phase sub-recipes"
version: "3.0.0"
author: "Amplihack Team"
tags: ["development", "feature", "bugfix", "refactoring", "standard", "full-workflow", "composable"]

# DEFAULT_WORKFLOW (v3): Composable Phase Sub-Recipes
#
# Same 23-step contract as v2, but the steps live in nine focused phase bricks.
# Every original step ID, prompt, condition, output declaration, and ordering
# is preserved across the bricks — the LLM converges on correct behaviour
# through many recursive review layers, so every layer must stay intact.
#
# Phases (each is a sub-recipe in amplifier-bundle/recipes/):
#   1. workflow-prep             — steps 00-03b   (requirements + issue creation)
#   2. workflow-worktree         — step  04       (worktree + branch setup)
#   3. workflow-design           — steps 05-06d   (design specification)
#   4. workflow-tdd              — steps 07-08c   (tests + implementation)
#   5. workflow-refactor-review  — steps 09-11b   (refactor + reviews)
#   6. workflow-precommit-test   — steps 12-13    (pre-commit + tests)
#   7. workflow-publish          — steps 14-16b   (version + commit + PR)
#   8. workflow-pr-review        — steps 17a-19d  (PR review panels)
#   9. workflow-finalize         — steps 20-22b   (CI + merge + finalize)
#
# Context flows automatically between sub-recipes via recipe-runner's
# `_execute_sub_recipe()` context-merging.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
#
# NO-TIMEOUT POLICY: Neither this recipe nor any of its nine sub-recipes
# declare a per-step `timeout:` YAML field. Agent steps run to natural
# completion; the only shell `timeout` calls that appear are inside bash
# step scripts guarding external network commands (gh, curl, git remote
# operations) and are therefore not mid-thought abort gates.
# This policy is enforced by CI (see crates/amplihack-cli/tests/). The
# `--step-timeout 0` flag is optional runtime configuration for callers that
# want to clear the runner's ambient timeout hint; it is not the policy
# mechanism.

recursion:
  max_depth: 6
  max_total_steps: 120

context:
  # Description of the task
  task_description: ""

  # Specific requirements (user-provided or empty)
  requirements: ""

  # Path to the repository
  repo_path: "."

  # Delivery inputs. Reference: docs/reference/workflow-delivery-inputs.md.
  # base_branch: the branch a new branch starts from and the pull request
  # targets. Empty => discover the remote default branch, as before.
  base_branch: ""
  # forbidden_base_branches: globs base_branch must not match, one per word or line.
  forbidden_base_branches: ""
  # strict_delivery: "true" when the caller has already assigned the issue
  # (issue_number in `repository`, on github.com) and the branch
  # (existing_branch). The run then fails rather than create, substitute or
  # retarget anything; pr_repository and closing_reference are checked at
  # step-03 and step-16. Step-03 fails on any other value, and on repository,
  # pr_repository or closing_reference set without strict_delivery: "true".
  strict_delivery: "false"
  repository: ""
  pr_repository: ""
  closing_reference: ""

  # Branch name prefix (default: feat)
  branch_prefix: "feat"

  # Issue #342: target an existing PR branch instead of deriving a new one.
  # When set, step-04-setup-worktree skips slug derivation and reuses the
  # named branch. Empty string => legacy behaviour (derive a new branch).
  # SECURITY: validated via `git check-ref-format --branch` before any use.
  existing_branch: ""

  # Issue #342: alternative to existing_branch — resolve a PR number to its
  # head branch via `gh pr view <N> --json headRefName -q .headRefName`.
  # Empty string => legacy behaviour. Must be a positive integer (regex-validated
  # before invoking gh; the gh response is re-validated through check-ref-format).
  # Precedence: if both are set, `existing_branch` wins and a WARNING is emitted.
  pr_number: ""

  # Workstream name for parallel workflows (optional)
  workstream: ""

  # Resume support: set to a checkpoint ID to skip steps already completed.
  resume_checkpoint: ""

  # Outputs populated during execution (propagated through phase sub-recipes)
  clarified_requirements: ""
  issue_number: ""
  # Issue #1881: "true" opts in to creating a GitHub tracking issue; the default is local tracking.
  create_issue: "false"
  branch_name: ""
  worktree_path: ""
  # Issue #425: nested-recipe context propagation for the worktree-setup
  # output object and the orchestration opt-out flag.
  #
  # `worktree_setup` mirrors the workflow-worktree (step-04) output object
  # so the recipe-runner threads it across nested recipe boundaries
  # (smart-execute-routing -> default-workflow -> workflow-tdd, where the
  # step-08c work-verifier reads ${WORKTREE_SETUP_WORKTREE_PATH}).
  #
  # `allow_no_op` opts orchestration / docs-only / audit / meta tasks out of
  # the step-08c work-verifier (issue #615 — replaces the legacy bash
  # hollow-success guard with an agentic verifier + bash enforcer pair).
  # Defaults to false; smart-classify-route flips it to true when
  # classification permits no working-tree edits.
  worktree_setup: ""
  allow_no_op: false
  # Skip pre-agent project validation (npm test, build) — default true to avoid blocking on large codebases (see #453)
  skip_pre_agent_validation: "true"
  # Auto-initialize a git repo when repo_path is not a work tree — default true so repo-creation tasks proceed; set "false" for a fail-closed opt-out (see #900)
  auto_init_repo: "true"
  design_spec: ""
  documentation: ""
  test_spec: ""
  implementation: ""
  refactored_code: ""
  pre_commit_review: ""
  review_feedback: ""
  remote_host_type: ""
  pr_url: ""
  pr_review: ""
  pr_security_review: ""
  pr_philosophy_review: ""
  blocking_issues_addressed: ""
  pr_feedback_changes: ""
  philosophy_check: ""
  final_cleanup: ""
  quality_audit_results: ""
  ci_status: ""
  # Evidence-based terminal-state outputs produced by workflow-terminal-state.
  # These suppress stale mutation/publish/finalize work after a branch is
  # already merged, obsolete, or cleanly no-diff.
  terminal_success: "false"
  terminal_state: ""
  terminal_reason: ""
  publish_status: ""
  should_finalize: "true"
  should_run_ci_wait: "true"
  should_merge: "true"
  # Issue #1551: "true" tells prep and finalize agents to stop at merge-ready.
  no_merge: ""
  # Issue #1714: only autodrive-build step-02 sets "true"; standalone runs fail closed on every failure state.
  finalization_handoff: ""
  implementation_terminal_evidence: ""
  verification_terminal_evidence: ""

recovery:
  version: 1
  persist:
    context: ["base_branch", "closing_reference", "forbidden_base_branches", "pr_repository", "repository", "strict_delivery", "adaptive_recipe", "allow_no_op", "api_design", "architecture_design", "auto_init_repo", "blocking_issues_addressed", "branch_name", "branch_prefix", "ci_status", "clarified_requirements", "cleanup_status", "codebase_analysis", "create_issue", "database_design", "decomposition_json", "design_spec", "doc_review_checkpoint", "doc_review_feedback", "documentation", "existing_branch", "final_cleanup", "final_documentation", "final_requirements", "finalization_handoff", "force_single_workstream", "goal_already_met", "identity_preflight", "implementation", "implementation_terminal_evidence", "infra_error_details", "issue_claim_check", "issue_creation", "issue_number", "issue_url", "no_merge", "ops_modified_files", "philosophy_check", "pr_feedback_changes", "pr_number", "pr_philosophy_review", "pr_review", "pr_security_review", "pr_url", "pre_commit_review", "preflight_status", "publish_status", "quality_audit_results", "quick_change_verdict", "recursion_guard", "refactored_code", "reflection_1", "reflection_2", "reflection_final", "remote_host_type", "repo_path", "requirements", "resume_checkpoint", "review_feedback", "round_1_result", "round_2_result", "round_3_result", "security_requirements", "selected_workflow", "session_complete_status", "session_id", "session_info", "should_finalize", "should_merge", "should_run_ci_wait", "skip_pre_agent_validation", "summary", "task_description", "task_type", "terminal_reason", "terminal_state", "terminal_success", "test_spec", "tree_id", "verification_terminal_evidence", "workflow", "workflow_init", "workspace_status", "workstream", "workstream_count", "workstreams_file", "worktree_path", "worktree_setup"]
    outputs: ["workflow-prep", "workflow-worktree", "workflow-design", "workflow-tdd", "workflow-refactor-review", "workflow-precommit-test", "workflow-publish", "workflow-pr-review", "workflow-finalize"]

steps:
  # Git precondition handling lives in workflow-prep/step-01: default-workflow
  # requires a git repo at <cwd>. When <cwd> is not a git work tree it
  # auto-initializes a fresh repo (issue #900) so repo-creation tasks proceed;
  # set auto_init_repo="false" for a fail-closed opt-out that restores the
  # historical hard-fail (`git init` or rerun from a checkout).
  - id: "workflow-prep"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-prep"

  - id: "workflow-worktree"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-worktree"

  - id: "workflow-design"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-design"

  - id: "workflow-tdd"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-tdd"

  - id: "workflow-refactor-review"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-refactor-review"

  - id: "workflow-precommit-test"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-precommit-test"

  - id: "workflow-publish"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-publish"
    context: { commit_result: "" }  # #2471: a caller's stale value must not skip push recovery

  - id: "workflow-pr-review"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-pr-review"
    context: { feedback_push_result: "" }

  - id: "workflow-finalize"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "workflow-finalize"
    context: { cleanup_push_result: "" }
