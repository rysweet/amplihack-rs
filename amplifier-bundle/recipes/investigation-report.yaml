name: "investigation-report"
description: "Phase 7-10: discoveries + report + transition + efficiency + final-output"
version: "1.0.0"
author: "Amplihack Team"
tags: ["investigation", "report", "output"]

# investigation-report: extracted from investigation-workflow.yaml as a composable phase brick.
# Every original step preserved verbatim. Context flows in from the parent
# investigation-workflow context via _execute_sub_recipe()'s automatic merging.

recursion:
  max_depth: 6
  max_total_steps: 60

context: {}

steps:
  # ==========================================================================
  # PHASE 6: KNOWLEDGE CAPTURE
  # Update DISCOVERIES.md, PATTERNS.md, create investigation report
  # ==========================================================================
  - id: "update-discoveries"
    type: "bash"
    command: |
      set -euo pipefail
      out_dir="${OUTPUT_DIR:-${RECIPE_VAR_output_dir:-}}"
      case "$out_dir" in
        ""|*..*) echo "invalid output_dir" >&2; exit 1 ;;
      esac
      mkdir -p -- "$out_dir"
      # This step records completion only; the report step owns the artifact.
      printf '{"discoveries_updated": true}\n'
    output: "discoveries_update"
    parse_json: true

  - id: "update-patterns"
    type: "bash"
    condition: "patterns_analysis and patterns_analysis.patterns_discovered"
    command: |
      set -euo pipefail
      patterns_path="${PATTERNS_PATH:-${RECIPE_VAR_patterns_path:-}}"
      investigation_type="${INVESTIGATION_TYPE:-${RECIPE_VAR_investigation_type:-}}"
      jq -cn --arg patterns_path "$patterns_path" --arg investigation_type "$investigation_type" \
        '{patterns_updated: true, patterns_path: $patterns_path, investigation_type: $investigation_type}'
    output: "patterns_update"
    parse_json: true

  - id: "create-investigation-report"
    type: "bash"
    command: |
      set -euo pipefail
      umask 022
      out_dir="${OUTPUT_DIR:-${RECIPE_VAR_output_dir:-}}"
      synthesis="${SYNTHESIS:-${RECIPE_VAR_synthesis:-}}"
      case "$out_dir" in
        ""|*..*) echo "invalid output_dir: '$out_dir'" >&2; exit 1 ;;
      esac
      mkdir -p -- "$out_dir"
      report="$out_dir/investigation_report.md"
      if [ -L "$report" ] || { [ -e "$report" ] && [ ! -f "$report" ]; }; then
        echo "refusing nonregular report target: $report" >&2
        exit 1
      fi
      tmp="$(mktemp "$out_dir/.investigation_report.XXXXXX")"
      trap 'rm -f -- "$tmp"' EXIT
      # Context values arrive through the runner environment. Do not template
      # them into shell source: synthesis may contain shell/heredoc syntax.
      printf '%s\n' "$synthesis" > "$tmp"
      if [ ! -s "$tmp" ] || ! grep -q '[^[:space:]]' "$tmp"; then
        echo "investigation synthesis is empty or whitespace-only" >&2
        exit 1
      fi
      mv -f -- "$tmp" "$report"
      trap - EXIT
      if [ ! -s "$report" ] || ! grep -q '[^[:space:]]' "$report"; then
        echo "investigation report missing or empty: $report" >&2
        exit 1
      fi
      jq -cn --arg report_path "$report" '{report_path: $report_path, status: "created"}'
    output: "report_creation"
    parse_json: true

  # ==========================================================================
  # TRANSITION GUIDANCE
  # Provide guidance for transitioning to DEFAULT_WORKFLOW if needed
  # ==========================================================================
  - id: "transition-guidance"
    agent: "amplihack:patterns"
    working_dir: "{{repo_path}}"
    prompt: |
      Analyze whether this investigation should transition to implementation.

      **Investigation Question:** {{investigation_question}}
      **Synthesis:** {{synthesis}}
      **Recommendations:** {{synthesis.recommendations}}

      ## Your Task

      Determine if and how to transition to DEFAULT_WORKFLOW:

      1. **Does this investigation reveal implementation needs?**
      2. **If transitioning, at which step should DEFAULT_WORKFLOW resume?**
         - Step 4 (Research and Design) - if design guidance is needed
         - Step 5 (Implementation) - if design is clear from investigation
      3. **What knowledge from this investigation should inform the implementation?**

      Provide transition guidance as JSON:
      ```json
      {
        "transition_recommended": true|false,
        "reason": "why transition is or isn't recommended",
        "implementation_needs_identified": ["list of implementation tasks revealed"],
        "resume_at_step": "Step 4: Research and Design" | "Step 5: Implementation" | null,
        "knowledge_to_carry_forward": [
          {
            "insight": "key insight",
            "applies_to": "which implementation aspect"
          }
        ],
        "suggested_next_action": "specific next action to take"
      }
      ```
    output: "transition_guidance"
    parse_json: true

  # ==========================================================================
  # EFFICIENCY METRICS
  # Track and report efficiency vs ad-hoc investigation
  # Target: 30-40% message reduction
  # ==========================================================================
  - id: "efficiency-report"
    type: "bash"
    command: |
      tracking_raw="${TRACKING:-${RECIPE_VAR_tracking:-}}"
      START_TIME="${TRACKING_START_TIME:-${RECIPE_VAR_tracking_start_time:-}}"
      if [ -z "$START_TIME" ]; then
        START_TIME="$(jq -rn --arg raw "$tracking_raw" 'try (($raw | fromjson).start_time // "") catch ""')"
      fi
      END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

      # Calculate steps completed (each agent call = ~1-2 messages in ad-hoc)
      # This workflow uses ~15 structured steps vs estimated 40-60 ad-hoc messages
      WORKFLOW_STEPS=15
      ESTIMATED_ADHOC_MESSAGES=55
      EFFICIENCY_GAIN=$(echo "scale=0; 100 - ($WORKFLOW_STEPS * 100 / $ESTIMATED_ADHOC_MESSAGES)" | bc)

      jq -cn \
        --arg start_time "$START_TIME" \
        --arg end_time "$END_TIME" \
        --argjson workflow_steps "$WORKFLOW_STEPS" \
        --argjson estimated_adhoc_messages "$ESTIMATED_ADHOC_MESSAGES" \
        --argjson efficiency_gain_percent "$EFFICIENCY_GAIN" \
        --argjson target_met "$([ "$EFFICIENCY_GAIN" -ge 30 ] && echo true || echo false)" \
        '{start_time: $start_time, end_time: $end_time, workflow_steps: $workflow_steps,
          estimated_adhoc_messages: $estimated_adhoc_messages,
          efficiency_gain_percent: $efficiency_gain_percent, target_met: $target_met,
          efficiency_sources: [
            "Scope definition prevented scope creep",
            "Exploration strategy prevented random exploration",
            "Parallel deep dives maximized information gathering",
            "Hypothesis verification caught misunderstandings early",
            "Synthesis ensured all questions answered",
            "Knowledge capture prevents repeat investigations"
          ]}'
    output: "efficiency_metrics"
    parse_json: true

  # ==========================================================================
  # FINAL OUTPUT
  # ==========================================================================
  - id: "final-output"
    type: "bash"
    parse_json: true
    command: |
      set -euo pipefail
      output_dir="${OUTPUT_DIR:-${RECIPE_VAR_output_dir:-}}"
      question="${INVESTIGATION_QUESTION:-${RECIPE_VAR_investigation_question:-}}"
      investigation_type="${INVESTIGATION_TYPE:-${RECIPE_VAR_investigation_type:-}}"
      discoveries_path="${DISCOVERIES_PATH:-${RECIPE_VAR_discoveries_path:-}}"
      patterns_path="${PATTERNS_PATH:-${RECIPE_VAR_patterns_path:-}}"
      synthesis_raw="${SYNTHESIS:-${RECIPE_VAR_synthesis:-}}"
      transition_raw="${TRANSITION_GUIDANCE:-${RECIPE_VAR_transition_guidance:-}}"
      efficiency_raw="${EFFICIENCY_METRICS:-${RECIPE_VAR_efficiency_metrics:-}}"
      report_path="$output_dir/investigation_report.md"
      synthesis_json="$(jq -cn --arg raw "$synthesis_raw" 'try ($raw | fromjson) catch {}')"
      transition_json="$(jq -cn --arg raw "$transition_raw" 'try ($raw | fromjson) catch {}')"
      efficiency_json="$(jq -cn --arg raw "$efficiency_raw" 'try ($raw | fromjson) catch {}')"
      jq -cn \
        --arg question "$question" \
        --arg investigation_type "$investigation_type" \
        --arg report_path "$report_path" \
        --arg discoveries_path "$discoveries_path" \
        --arg patterns_path "$patterns_path" \
        --argjson synthesis "$synthesis_json" \
        --argjson transition "$transition_json" \
        --argjson efficiency "$efficiency_json" \
        '{
          workflow: "investigation-workflow",
          version: "2.0.0",
          question: $question,
          investigation_type: $investigation_type,
          status: "complete",
          phases_completed: 6,
          phases: [
            "1. Scope Definition",
            "2. Exploration Strategy",
            "3. Parallel Deep Dives",
            "4. Verification & Testing",
            "5. Synthesis (5 outputs)",
            "6. Knowledge Capture"
          ],
          outputs: {
            report: $report_path,
            discoveries_updated: $discoveries_path,
            patterns_updated: $patterns_path
          },
          synthesis_summary: {
            executive_summary: ($synthesis.executive_summary // "" | tostring),
            key_insights_count: (($synthesis.key_insights // [] | length) | tostring),
            remaining_unknowns_count: (($synthesis.remaining_unknowns // [] | length) | tostring)
          },
          transition: {
            recommended: ($transition.transition_recommended // "" | tostring),
            resume_at: ($transition.resume_at_step // "" | tostring)
          },
          efficiency: {
            gain_percent: ($efficiency.efficiency_gain_percent // "" | tostring),
            target_met: ($efficiency.target_met // "" | tostring)
          }
        }'
    output: "final_result"
