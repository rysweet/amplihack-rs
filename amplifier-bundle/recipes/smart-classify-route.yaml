name: "smart-classify-route"
description: "Phase 0+1: pre-flight + classify-and-decompose + parse + activate + setup-session"
version: "1.0.0"
author: "Amplihack Team"
tags: ["smart-orchestrator", "classify", "decompose"]

# smart-classify-route: extracted from smart-orchestrator.yaml as a composable phase brick.
#
# Preserves every original step verbatim — every routing branch, recursion
# guard, fallback path, adaptive-recovery step, reflection round, and
# outside-in validation gate. Context (task_type, workstream_count,
# recursion_guard, round_N_result, etc.) flows in from the parent
# smart-orchestrator context via _execute_sub_recipe()'s automatic merging
# and propagates back so subsequent phase recipes can consume it.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 80

context:
  force_single_workstream: ""
  workflow: ""
  selected_workflow: ""
  # Inherited from smart-orchestrator; either one rules out quick-change (#1740).
  existing_branch: ""
  pr_number: ""
  # Inherited from smart-orchestrator; a strict run keeps one workstream (activate-workflow).
  strict_delivery: "false"

recovery:
  version: 1
  persist:
    context: ["adaptive_recipe", "allow_no_op", "api_design", "architecture_design", "auto_init_repo", "blocking_issues_addressed", "branch_name", "branch_prefix", "ci_status", "clarified_requirements", "cleanup_status", "codebase_analysis", "create_issue", "database_design", "decomposition_json", "design_spec", "doc_review_checkpoint", "doc_review_feedback", "documentation", "existing_branch", "final_cleanup", "final_documentation", "final_requirements", "finalization_handoff", "force_single_workstream", "goal_already_met", "identity_preflight", "implementation", "implementation_terminal_evidence", "infra_error_details", "issue_claim_check", "issue_creation", "issue_number", "issue_url", "no_merge", "ops_modified_files", "philosophy_check", "pr_feedback_changes", "pr_number", "pr_philosophy_review", "pr_review", "pr_security_review", "pr_url", "pre_commit_review", "preflight_status", "publish_status", "quality_audit_results", "quick_change_verdict", "recursion_guard", "refactored_code", "reflection_1", "reflection_2", "reflection_final", "remote_host_type", "repo_path", "requirements", "resume_checkpoint", "review_feedback", "round_1_result", "round_2_result", "round_3_result", "security_requirements", "selected_workflow", "session_complete_status", "session_id", "session_info", "should_finalize", "should_merge", "should_run_ci_wait", "skip_pre_agent_validation", "strict_delivery", "summary", "task_description", "task_type", "terminal_reason", "terminal_state", "terminal_success", "test_spec", "tree_id", "verification_terminal_evidence", "workflow", "workflow_init", "workspace_status", "workstream", "workstream_count", "workstreams_file", "worktree_path", "worktree_setup"]
    outputs: ["preflight-validation", "classify-and-decompose", "parse-decomposition", "activate-workflow", "select-workflow", "materialize-force-single-workstream", "materialize-allow-no-op", "setup-session"]

steps:
  # ─────────────────────────────────────────────────────────────────────────
  # Phase 0: Pre-flight Validation
  # ─────────────────────────────────────────────────────────────────────────
  - id: "preflight-validation"
    recovery: {"replay": "reuse"}
    type: "bash"
    command: |
      ERRORS=""
      REPO="$REPO_PATH"
      TASK="$TASK_DESCRIPTION"
      if [ -z "$TASK" ]; then
        ERRORS="${ERRORS}\n  ✗ task_description is empty"
      fi
      if [ ! -d "$REPO" ]; then
        ERRORS="${ERRORS}\n  ✗ repo_path '$REPO' does not exist"
      fi
      if ! command -v recipe-runner-rs >/dev/null 2>&1 && [ ! -f "$HOME/.cargo/bin/recipe-runner-rs" ]; then
        ERRORS="${ERRORS}\n  ✗ recipe-runner-rs not found (run: amplihack install, or use the Rust CLI: amplihack recipe run ...)"
      fi
      if [ -n "$ERRORS" ]; then
        echo "=== SMART-ORCHESTRATOR PRE-FLIGHT FAILED ===" >&2
        printf "%b\n" "$ERRORS" >&2
        echo "Restart: amplihack recipe run smart-orchestrator -c task_description='...' -c repo_path=." >&2
        exit 1
      fi
      echo "=== Pre-flight passed ==="
    output: "preflight_status"

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 1: Classify & Decompose
  # ─────────────────────────────────────────────────────────────────────────

  - id: "classify-and-decompose"
    recovery: {"replay": "reuse"}
    type: "agent"
    agent: "amplihack:core:architect"
    prompt: |
      === [RECIPE PROGRESS] Step: classify-and-decompose ===

      You are an intelligent task orchestrator. Analyze this request and produce a
      structured orchestration plan.

      **IMPORTANT**: You are ONLY classifying and decomposing. Do NOT implement,
      build, code, or make any changes. Do NOT create files, edit code, or run
      commands. Do NOT invoke any skills, workflows, or tools. Do NOT call
      dev-orchestrator or any other orchestrator. Return ONLY the JSON object below.

      **REQUEST**: {{task_description}}

      Output:
      1. task_type: Q&A | Operations | Investigation | Development
      2. goal: clear 1-sentence goal
      3. success_criteria: numbered list of verifiable criteria
      4. workstreams: array of independent parallel units
         - 1 workstream for cohesive/sequential tasks
         - 2-5 for CLEARLY INDEPENDENT components
           e.g. "build webui + api" -> 2 workstreams
                "investigate X then implement Y" -> 2 workstreams
         - recipe: "default-workflow" (edits) | "operations-direct" (administration) | "investigation-workflow" (investigation)
      5. no_merge: true | false — set `true` when the request asks NOT to merge
         or to keep the PR open (issue #929/#1062). This replaces the old bash
         prose-regex; you understand intent, so catch ALL phrasings, including
         unusual ones like "hold off merging", "keep it as a draft", "wait for
         my review", "leave it open", "don't merge", "no admin merge". Default
         to `false` when the request says nothing about merging.
      6. recommended_workflow: "quick-change" | "default-workflow", and
         workflow_reason: one short sentence (issue #1740). Recommend
         "quick-change" only for a Development task with exactly one
         workstream that is one of: documentation only; a dependency lock
         update; a comment or typo fix; a configuration or wording change; a
         single-file fix with no behaviour change to a public interface.
         Never recommend it for a feature, a behaviour change visible to
         users, or more than one workstream. When in doubt, choose
         "default-workflow".

      **Classification rules**:
      - Operations / project management includes triage, creating and assigning
        issues, research write-ups delivered in chat or issues, coordination
        across repositories and status reports. Mentioning source files, tests
        or documentation does not request an edit.
      - Development asks for repository-file edits, including documentation
        wording changes. A report committed into the repository is Development;
        the same report delivered in chat or an issue is Operations.
      - Mixed requests retain every required leaf, its explicit classification,
        destination and dependencies. Use Operations for research and coordination,
        and Development only for repository edits. A top-level Operations label
        must not hide Development leaves.
      - Operations always uses operations-direct, even with a conflicting custom
        recipe. It runs one checklist agent in the existing execution context,
        without a development clone, worktree, branch or pull request.
      - Examples: "triage these issues", "open an issue for X and assign Y",
        "write up the answers to these questions" are Operations. "Rename term X
        across the docs of repos A and B" uses Development leaves for file edits.
        Removing a programme name from code and docs, researching questions and
        opening a cross-check issue is mixed: repository edits are Development;
        research and issue coordination are Operations.
      - Each leaf has key, description, task, classification, dependencies (keys),
        optional issue and Boolean create_issue. Do not invent issue numbers.
        Omit an unknown issue; TBD and other supported placeholders mean absence.
        Set create_issue=true only when the request explicitly asks for tracking.
      - {{force_single_workstream}} limits concurrency; it cannot discard leaves
        or merge different destinations. Preserve sequential dependencies.

      **Output exactly this JSON**:
      ```json
      {
        "task_type": "Development",
        "goal": "One sentence goal",
        "success_criteria": ["Criterion 1", "Criterion 2"],
        "no_merge": false,
        "workstreams": [
          {"key": "slug", "name": "slug", "description": "label", "task": "full task", "classification": "Development", "dependencies": [], "create_issue": false, "recipe": "default-workflow"}
        ],
        "recommended_workflow": "default-workflow",
        "workflow_reason": "one short sentence"
      }
      ```
    output: "decomposition_json"

  # parse-decomposition: extract task_type from architect JSON output.
  # Outputs ONLY the canonical task_type string (e.g. "Development").
  # Uses native Rust `amplihack orch helper` (#270).
  - id: "parse-decomposition"
    recovery: {"replay": "reuse"}
    type: "bash"
    command: |
      _DECOMP_TMPFILE=$(mktemp)
      trap 'rm -f "$_DECOMP_TMPFILE"' EXIT
      # FIX (heredoc-bulletproof): use env var — no heredoc needed.
      printf '%s' "${RECIPE_VAR_decomposition_json:-}" > "$_DECOMP_TMPFILE"
      RAW_OBJ=$(amplihack orch helper extract-json < "$_DECOMP_TMPFILE")
      if [ "$RAW_OBJ" = "{}" ]; then
        cat <<'WARN' >&2

      ╔══════════════════════════════════════════════════════════════════╗
      ║  ERROR: decomposition JSON parse failed                         ║
      ║  The architect agent returned non-JSON prose instead of the     ║
      ║  expected structured plan.                                      ║
      ║                                                                 ║
      ║  Action: defaulting to task_type=Development so execution can   ║
      ║  continue. The adaptive strategy step will evaluate whether     ║
      ║  direct recipe invocation should be attempted.                  ║
      ║                                                                 ║
      WARN
      fi
      # Extract the task_type field from the JSON object via a one-liner
      # Rust call: pipe extracted JSON into a small inline tool. We use
      # `amplihack orch helper normalise-type` directly on the raw value.
      RAW_TYPE=$(printf '%s' "$RAW_OBJ" | amplihack orch helper extract-field --field task_type --default Development)
      CANONICAL_TYPE=$(printf '%s' "$RAW_TYPE" | amplihack orch helper normalise-type)
      # Deterministic safety net (#269): if the LLM said Operations but the
      # task description has strong development signals (file paths, "Add"+
      # path, PR mention, tests, multi-requirement), promote to Development.
      _TASK_TMPFILE=$(mktemp)
      # FIX (heredoc-bulletproof): use env var — no heredoc needed.
      printf '%s' "$TASK_DESCRIPTION" > "$_TASK_TMPFILE"
      FINAL_TYPE=$(amplihack orch helper reclassify-task-type --current "$CANONICAL_TYPE" < "$_TASK_TMPFILE")
      rm -f "$_TASK_TMPFILE"
      if [ "$FINAL_TYPE" != "$CANONICAL_TYPE" ]; then
        echo "[dev-orchestrator] Reclassified $CANONICAL_TYPE → $FINAL_TYPE based on task description signals (#269)" >&2
      fi
      echo "$FINAL_TYPE"
    output: "task_type"

  # activate-workflow: compute workstream_count, set workflow semaphore, announce.
  # Uses native Rust `amplihack orch helper count-workstreams` (#270).
  - id: "activate-workflow"
    recovery: {"replay": "rebind"}
    type: "bash"
    command: |
      _DECOMP_TMPFILE=$(mktemp)
      trap 'rm -f "$_DECOMP_TMPFILE"' EXIT
      # FIX (heredoc-bulletproof): use env var — no heredoc needed.
      printf '%s' "${RECIPE_VAR_decomposition_json:-}" > "$_DECOMP_TMPFILE"
      TASK_TYPE="${RECIPE_VAR_task_type:-}"
      FORCE_SINGLE="${RECIPE_VAR_force_single_workstream:-}"
      RAW_COUNT=$(amplihack orch helper count-workstreams < "$_DECOMP_TMPFILE")
      COUNT="$RAW_COUNT"
      # Capacity restrictions are applied at execution; the plan keeps every leaf.

      # Set workflow-active semaphore so the hook skips injection during execution.
      # Pure-bash: write JSON matching the Rust hook's expected schema in
      # is_workflow_active (amplihack-hooks/src/session_start/context_loaders.rs).
      # CLAUDE_PROJECT_DIR is honored when set; otherwise pwd. PID = parent
      # process (recipe runner), not this ephemeral bash step.
      _PROJ_DIR="${CLAUDE_PROJECT_DIR:-$(pwd)}"
      _SEMA_DIR="$_PROJ_DIR/.claude/runtime/locks"
      mkdir -p "$_SEMA_DIR"
      jq -n \
        --arg task_type "$TASK_TYPE" \
        --argjson workstreams "$COUNT" \
        --argjson pid "$PPID" \
        --argjson started_at "$(date +%s)" \
        '{active: true, task_type: $task_type, workstreams: $workstreams, started_at: $started_at, pid: $pid}' \
        > "$_SEMA_DIR/.workflow_active" 2>/dev/null || true

      echo "[dev-orchestrator] Classified as: $TASK_TYPE | Workstreams: $COUNT — starting execution..." >&2

      # Output workstream count without trailing newline (fix #3570).
      printf '%s' "$COUNT"
    output: "workstream_count"

  # select-workflow (#1740): quick-change, default-workflow or none, from the
  # -c workflow= override, task_type, the classifier's recommended_workflow,
  # the workstream count, and existing_branch/pr_number or a `Branch: <ref>`
  # line in the task text (each rules out quick-change; the helper reads the
  # task from RECIPE_VAR_task_description). It logs the choice to stderr.
  - id: "select-workflow"
    recovery: {"replay": "reuse"}
    type: "bash"
    command: |
      _DECOMP_TMPFILE=$(mktemp)
      trap 'rm -f "$_DECOMP_TMPFILE"' EXIT
      printf '%s' "${RECIPE_VAR_decomposition_json:-}" > "$_DECOMP_TMPFILE"
      amplihack orch helper select-workflow \
        --override "${RECIPE_VAR_workflow:-}" \
        --task-type "${RECIPE_VAR_task_type:-}" \
        --workstream-count "${RECIPE_VAR_workstream_count:-1}" \
        --existing-branch "${RECIPE_VAR_existing_branch:-}" \
        --pr-number "${RECIPE_VAR_pr_number:-}" \
        < "$_DECOMP_TMPFILE"
    output: "selected_workflow"

  # ─────────────────────────────────────────────────────────────────────────
  # Materialize user_context overrides into step outputs so they are
  # available in condition evaluation (fix #3075, #3130).
  # The Rust runner's --set flag updates template variables ({{...}}) but
  # the condition evaluator only sees step outputs and initial context.
  # This step bridges the gap by echoing the context value to stdout.
  # NOTE: Use "$ENV_VAR" — safe against word-splitting and injection.
  # ─────────────────────────────────────────────────────────────────────────
  - id: "materialize-force-single-workstream"
    recovery: {"replay": "reuse"}
    type: "bash"
    command: |
      printf '%s' "${RECIPE_VAR_force_single_workstream:-}"
    output: "force_single_workstream"

  # ─────────────────────────────────────────────────────────────────────────
  # Issue #425: emit `allow_no_op` so the step-08c work-verifier (workflow-tdd)
  # treats orchestration / docs-only / audit / meta tasks as fast-path
  # WORK_VERIFIED. Issue #615 replaced the legacy six-escape-hatch bash
  # hollow-success guard with an agentic verifier; ALLOW_NO_OP is still
  # honoured by the bash enforcer that follows the verifier so callers that
  # legitimately produce no working-tree edits never get blocked.
  #
  # Allowlist (case-insensitive substring match against task_description):
  #   audit, docs-only, orchestration, meta
  # Default: false. The step-08c enforcer uses STRICT equality with the
  # literal "true", so coerced values (1, yes, on, True) cannot accidentally
  # bypass the guard for code-producing classifications.
  # ─────────────────────────────────────────────────────────────────────────
  - id: "materialize-allow-no-op"
    recovery: {"replay": "reuse"}
    type: "bash"
    command: |
      set -euo pipefail
      _TASK_LC=$(printf '%s' "${TASK_DESCRIPTION:-}" | tr '[:upper:]' '[:lower:]')
      _ALLOW="false"
      case "$_TASK_LC" in
        *audit*|*docs-only*|*"docs only"*|*orchestration*|*meta-task*|*"meta task"*)
          _ALLOW="true"
          ;;
      esac
      if [ "$_ALLOW" = "true" ]; then
        echo "[dev-orchestrator] allow_no_op=true (orchestration / docs-only / audit / meta classification — issue #425)" >&2
      fi
      printf '%s' "$_ALLOW"
    output: "allow_no_op"

  # ─────────────────────────────────────────────────────────────────────────
  # Setup: register this session in the session tree (atomic check+register)
  # Runs for Development and Investigation tasks before any workstream spawning.
  # session_info output format: JSON {"session_id":..,"tree_id":..,"depth":..,"status":..}
  # ─────────────────────────────────────────────────────────────────────────

  - id: "setup-session"
    recovery: {"replay": "rebind", "resources": [{"kind": "live", "name": "session_tree"}]}
    type: "bash"
    condition: "'Development' in task_type or 'Investigation' in task_type or task_type == ''"
    command: |
      # #283: replace scripted uuid with /proc/sys/kernel/random/uuid (POSIX)
      SESSION_ID=$(tr -d '-' < /proc/sys/kernel/random/uuid | head -c 8)

      # #248: native Rust subcommand for session tree registration.
      # Issue #1062 (finding D2): request structured JSON via the additive
      # `--json` flag and read tree_id/depth through the tested
      # `orch helper extract-field` pipeline instead of grep-scraping the
      # `TREE_ID=.. DEPTH=..` text line.
      if OUTPUT=$(amplihack session-tree register "$SESSION_ID" --json 2>&1); then
        # Output: {"tree_id":"abc123","depth":0}
        TREE_ID=$(printf '%s' "$OUTPUT" \
          | amplihack orch helper extract-json \
          | amplihack orch helper extract-field --field tree_id --default '')
        DEPTH_STR=$(printf '%s' "$OUTPUT" \
          | amplihack orch helper extract-json \
          | amplihack orch helper extract-field --field depth --default 0)
        DEPTH_VAL=${DEPTH_STR:-0}
        # Validate extracted values
        if ! echo "$TREE_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
          # #283: replace scripted json with printf (inputs are fixed literals)
          printf '{"session_id":"error","tree_id":"error","depth":0,"status":"registration_failed","error":"invalid tree_id extracted"}\n'
          exit 0
        fi
        # #283: DEPTH_VAL is already validated as numeric above; SESSION_ID
        # and TREE_ID are both constrained to [A-Za-z0-9_-], safe for JSON
        printf '{"session_id":"%s","tree_id":"%s","depth":%d,"status":"ok"}\n' "$SESSION_ID" "$TREE_ID" "$DEPTH_VAL"
      else
        # Registration failed (capacity exceeded or depth limit) — encode structured error
        echo "NOTE: Session registration failed — proceeding without recursion tracking." >&2
        printf '{"session_id":"none","tree_id":"none","depth":0,"status":"registration_failed"}\n'
      fi
    output: "session_info"
