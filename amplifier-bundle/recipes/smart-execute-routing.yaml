name: "smart-execute-routing"
description: "Execute validated leaves with their own routes and dependencies"
version: "1.0.0"
author: "Amplihack Team"
tags: ["smart-orchestrator", "routing", "execute"]
context:
  task_type: ""
  task_description: ""
  repo_path: "."
  workstream_count: ""
  force_single_workstream: ""
  strict_delivery: ""
  decomposition_json: ""
  session_info: ""
  workstreams_file: ""
  workflow: ""
  selected_workflow: ""
  round_1_result: ""
  leaf_dispatch_complete: ""
recovery:
  version: 1
  persist:
    context: ["decomposition_json", "workstreams_file", "round_1_result", "leaf_dispatch_complete", "task_type", "selected_workflow", "repo_path"]
    outputs: ["handle-qa", "create-workstreams-config", "launch-parallel-round-1", "mark-leaf-completion"]
steps:
  - id: "require-plan"
    recovery: {"replay": "reuse"}
    type: "bash"
    condition: "not decomposition_json and 'Q&A' not in task_type"
    command: |
      echo 'A complete classified leaf plan is required before execution.' >&2
      exit 1
  - id: "handle-qa"
    recovery: {"replay": "reuse"}
    type: "agent"
    condition: "'Q&A' in task_type and not decomposition_json"
    agent: "amplihack:core:analyzer"
    prompt: |
      Answer this question directly: {{task_description}}
    output: "round_1_result"
  - id: "create-workstreams-config"
    recovery: {"replay": "reuse", "resources": [{"kind": "artifact", "path": "{{workstreams_file}}", "context_key": "workstreams_file"}]}
    type: "bash"
    condition: "decomposition_json"
    command: |
      set -euo pipefail
      export AMPLIHACK_REPO_PATH="${RECIPE_VAR_repo_path:-${REPO_PATH:-.}}"
      printf '%s' "${RECIPE_VAR_decomposition_json:-}" | amplihack orch helper build-workstreams-config
    output: "workstreams_file"
  - id: "launch-parallel-round-1"
    recovery: {"replay": "reuse"}
    type: "bash"
    condition: "decomposition_json"
    command: |
      set -euo pipefail
      export AMPLIHACK_REPO_PATH="${RECIPE_VAR_repo_path:-${REPO_PATH:-.}}"
      # Serial fallback changes capacity, never the leaves, their routes or dependencies.
      case "${RECIPE_VAR_force_single_workstream:-}" in true|True|1) export AMPLIHACK_MAX_PARALLEL_WORKSTREAMS=1 ;; esac
      case "${RECIPE_VAR_strict_delivery:-}" in ''|false) ;; *) export AMPLIHACK_MAX_PARALLEL_WORKSTREAMS=1 ;; esac
      case "${RECIPE_VAR_session_info:-}" in *blocked*|*depth_limit*|*capacity*) export AMPLIHACK_MAX_PARALLEL_WORKSTREAMS=1 ;; esac
      amplihack orch run -- "${RECIPE_VAR_workstreams_file:?validated workstreams file is required}"
    output: "round_1_result"
  - id: "mark-leaf-completion"
    recovery: {"replay": "reuse"}
    type: "bash"
    condition: "decomposition_json and round_1_result"
    command: "printf true"
    output: "leaf_dispatch_complete"
