name: "smart-orchestrator"
description: "Composable smart task orchestrator — classify, route, reflect, validate via 4 phase sub-recipes"
version: "3.0.0"
author: "Amplihack Team"
tags: ["smart-orchestrator","orchestrator","composable","classify","route","reflect"]

# SMART_ORCHESTRATOR (v3): Composable Phase Sub-Recipes
#
# Same multi-phase contract as v2, but the 28 steps live in four focused
# bricks. Each brick is independently editable, testable, and reusable:
#
#   1. smart-classify-route       — preflight + classify + parse + activate + session
#   2. smart-execute-routing      — Q&A/Ops/dev routing (single + parallel + fallback + adaptive)
#   3. smart-reflect-loop         — 3-round goal-seeking reflection
#   4. smart-validate-summarize   — outside-in validation + summary + completion
#
# Context flows automatically between sub-recipes via recipe-runner's
# _execute_sub_recipe() merging. task_type, workstream_count, recursion_guard,
# round_N_result, and other intermediate outputs propagate forward.
#
# Issue #752 invariant: Development routing must preserve default-workflow's
# strict terminal-state gate. Do not mark smart-execute-routing fatal:false or
# convert its nonzero result into a successful orchestration summary.

context:
  task_description: ""
  repo_path: "."
  # Issue #342: target an existing PR branch in sub-recipes.
  # Propagated automatically to default-workflow / consensus-workflow via
  # context-merging. Empty strings preserve legacy behaviour.
  existing_branch: ""
  pr_number: ""
  decomposition_json: ""
  session_id: ""
  tree_id: ""
  session_info: ""
  task_type: ""
  workstream_count: ""
  workflow: "" # -c workflow=quick-change|default-workflow (issue #1740)
  selected_workflow: "" # set by select-workflow in smart-classify-route
  workstreams_file: ""
  recursion_guard: ""
  round_1_result: ""
  reflection_1: ""
  round_2_result: ""
  reflection_2: ""
  round_3_result: ""
  reflection_final: ""
  summary: ""
  session_complete_status: ""
  create_issue: "false" # -c create_issue=true opts in to a GitHub tracking issue (issue #1881)
  force_single_workstream: "false" # set to "true" to prevent parallel decomposition
  adaptive_recipe: "" # set by detect-execution-gap when routing fails
  infra_error_details: "" # diagnostic info for infrastructure failures
  ops_modified_files: "" # retained for compatibility with downstream validation gates; operations-direct does not set it
  # Skip pre-agent project validation (npm test, build) — default true to avoid blocking on large codebases (see #453)
  skip_pre_agent_validation: "true"
  # Auto-initialize a git repo when repo_path is not a work tree — default true so repo-creation tasks proceed; set "false" for a fail-closed opt-out (see #900)
  auto_init_repo: "true"

context_validation:
  task_description: "nonempty"

recovery:
  version: 1
  persist:
    context: ["adaptive_recipe", "allow_no_op", "api_design", "architecture_design", "auto_init_repo", "blocking_issues_addressed", "branch_name", "branch_prefix", "ci_status", "clarified_requirements", "cleanup_status", "codebase_analysis", "create_issue", "database_design", "decomposition_json", "design_spec", "doc_review_checkpoint", "doc_review_feedback", "documentation", "existing_branch", "final_cleanup", "final_documentation", "final_requirements", "finalization_handoff", "force_single_workstream", "goal_already_met", "identity_preflight", "implementation", "implementation_terminal_evidence", "infra_error_details", "issue_claim_check", "issue_creation", "issue_number", "issue_url", "no_merge", "ops_modified_files", "philosophy_check", "pr_feedback_changes", "pr_number", "pr_philosophy_review", "pr_review", "pr_security_review", "pr_url", "pre_commit_review", "preflight_status", "publish_status", "quality_audit_results", "quick_change_verdict", "recursion_guard", "refactored_code", "reflection_1", "reflection_2", "reflection_final", "remote_host_type", "repo_path", "requirements", "resume_checkpoint", "review_feedback", "round_1_result", "round_2_result", "round_3_result", "security_requirements", "selected_workflow", "session_complete_status", "session_id", "session_info", "should_finalize", "should_merge", "should_run_ci_wait", "skip_pre_agent_validation", "summary", "task_description", "task_type", "terminal_reason", "terminal_state", "terminal_success", "test_spec", "tree_id", "verification_terminal_evidence", "workflow", "workflow_init", "workspace_status", "workstream", "workstream_count", "workstreams_file", "worktree_path", "worktree_setup"]
    outputs: ["smart-classify-route", "smart-execute-routing", "smart-reflect-loop", "smart-validate-summarize"]

steps:
  - id: "smart-classify-route"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "smart-classify-route"

  - id: "smart-execute-routing"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "smart-execute-routing"

  - id: "smart-reflect-loop"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "smart-reflect-loop"

  - id: "smart-validate-summarize"
    recovery: {"replay": "never"}
    type: "recipe"
    recipe: "smart-validate-summarize"
