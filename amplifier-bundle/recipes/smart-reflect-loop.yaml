name: "smart-reflect-loop"
description: "Phase 3: 3-round goal-seeking reflection (round1/2/3 + reflect-final)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["smart-orchestrator", "reflect", "goal-seeking"]

# smart-reflect-loop: extracted from smart-orchestrator.yaml as a composable phase brick.
#
# Preserves every original step verbatim — every routing branch, recursion
# guard, fallback path, adaptive-recovery step, reflection round, and
# outside-in validation gate. Context (task_type, workstream_count,
# recursion_guard, round_N_result, etc.) flows in from the parent
# smart-orchestrator context via _execute_sub_recipe()'s automatic merging
# and propagates back so subsequent phase recipes can consume it.

recursion:
  max_depth: 6
  max_total_steps: 80

context: {}

steps:
  # ─────────────────────────────────────────────────────────────────────────
  # Phase 3: Goal-seeking reflection loop (up to 3 rounds)
  # Pattern from auto-workflow.yaml: CONTINUE/COMPLETE on each round.
  # ─────────────────────────────────────────────────────────────────────────

  - id: "reflect-round-1"
    type: "agent"
    condition: |
      'Q&A' not in task_type and ('Operations' not in task_type or ops_modified_files) and round_1_result
    agent: "amplihack:core:reviewer"
    prompt: |
      Evaluate goal achievement after round 1.

      **Goal + Success Criteria**: {{decomposition_json}}
      **Round 1 Result**: {{round_1_result}}

      Was each success criterion met?

      ## Hollow Success Detection

      A hollow success is when execution completes structurally but agents
      clearly could not perform the work. Only flag HOLLOW when ALL of these
      are true:
      1. Agent explicitly states it cannot access the codebase, repository,
         or files (e.g. "no codebase exists", "I could not access the code",
         "cannot find the repository")
      2. No concrete code changes, findings, or artifacts are described
      3. The round result contains no file paths, diff output, test results,
         or specific code references

      Do NOT flag HOLLOW when:
      - The agent completed the work but results are partial or imperfect
      - Some success criteria are met but others are not (use PARTIAL instead)
      - The agent produced real output with specific findings, even if brief
      - The task was investigative and the agent reported concrete conclusions

      If the result is a hollow success, use GOAL_STATUS: HOLLOW and explain
      what specific outputs are missing. When in doubt between HOLLOW and
      PARTIAL, choose PARTIAL — it triggers a follow-up round rather than
      flagging a false infrastructure failure.

      ## Adaptive Strategy Context

      If an infrastructure error was detected and adaptive strategy was used:
      **Adaptive recipe**: {{adaptive_recipe}}
      **Error details**: {{infra_error_details}}

      Factor this into your evaluation — if the task ran via adaptive strategy
      due to a routing failure, note this in your assessment.

      ## Deliverable PR early-exit (issue #1025)

      Before choosing a GOAL_STATUS, determine whether this workstream has
      already produced its deliverable pull request. If a PR exists for the
      branch/changes created during the execution rounds, check PR state/draft
      status separately from required checks:

          gh pr view --json state,isDraft
          gh pr checks --required
          # or, for a specific branch: gh pr checks --required <branch>

      Apply this rule UNLESS the environment variable
      AMPLIHACK_DISABLE_PR_GREEN_SHORTCIRCUIT is set to a truthy value
      (`1`/`true`), in which case skip this rule entirely and evaluate normally:
      - If the PR is definitively OPEN (not draft, not closed/merged), the
        repository reports a concrete required-check set, and EVERY required
        check has COMPLETED SUCCESSFULLY (green), the deliverable is met: end
        with `GOAL_STATUS: ACHIEVED` and STOP. Do NOT request another round or
        any further heavy re-validation (e.g. local full-reactor builds) — CI on
        the clean checkout is authoritative, and a local-only failure (such as a
        test scanning sibling `./worktrees/` copies) must not override a green
        PR.
      - NEVER short-circuit to ACHIEVED on any other state. If checks are
        pending/queued/in-progress, any required check is failing, the PR is
        closed/merged/draft, no PR exists yet, the required-check set is empty,
        or the status is unknown or ambiguous, IGNORE this rule and evaluate
        normally (prefer continuing the loop). Fail toward continuing, never
        toward a premature ACHIEVED.

      Output EXACTLY one JSON object as your final line (issue #1062 finding C:
      the loop condition now reads a structured `goal_status` field instead of
      substring-matching this prose, so a stray "partial" in your narrative can
      no longer false-trigger a round):

      ```json
      {"goal_status": "ACHIEVED", "summary": "what was verified or what is missing"}
      ```

      `goal_status` MUST be EXACTLY one of:
      - `ACHIEVED` -- all criteria met with verifiable evidence
      - `PARTIAL` -- some criteria met, needs another round; put the gaps in `summary`
      - `NOT_ACHIEVED` -- criteria not met, needs another round; reason in `summary`
      - `HOLLOW` -- agents ran but produced no real work; what was empty in `summary`
    output: "reflection_1"
    parse_json: true

  - id: "execute-round-2"
    type: "agent"
    condition: |
      reflection_1 and (reflection_1.goal_status == 'PARTIAL' or reflection_1.goal_status == 'NOT_ACHIEVED' or reflection_1.goal_status == 'HOLLOW')
    agent: "amplihack:core:builder"
    prompt: |
      Round 1 was incomplete. Continue from where it left off.

      **Original Goal**: {{decomposition_json}}
      **Round 1 Result**: {{round_1_result}}
      **What's Missing**: {{reflection_1.summary}}

      Address only what's missing. Do not redo completed work.
      Create PRs for new changes. Report PR URLs.
      End with "STATUS: COMPLETE" or "STATUS: CONTINUE".
    output: "round_2_result"

  - id: "reflect-round-2"
    type: "agent"
    condition: |
      round_2_result and (reflection_1.goal_status == 'PARTIAL' or reflection_1.goal_status == 'NOT_ACHIEVED')
    agent: "amplihack:core:reviewer"
    prompt: |
      Evaluate goal achievement after round 2.

      **Goal**: {{decomposition_json}}
      **Round 1**: {{round_1_result}}
      **Round 2**: {{round_2_result}}

      ## Deliverable PR early-exit (issue #1025)

      If a deliverable pull request now exists for this workstream, check its
      CI status (`gh pr view --json state,isDraft` plus
      `gh pr checks --required`, or `gh pr checks --required <branch>`). Unless
      AMPLIHACK_DISABLE_PR_GREEN_SHORTCIRCUIT is truthy: when the PR is
      definitively OPEN (not draft), the required-check set is concrete/nonempty,
      and ALL required checks are green, end with `GOAL_STATUS: ACHIEVED` and
      STOP — do not trigger another round or heavy re-validation; CI on the
      clean checkout is authoritative. NEVER short-circuit on
      pending/failing/closed/draft/no-PR/empty-required-check-set or unknown
      states — in those cases evaluate normally and prefer continuing.

      End with EXACTLY one JSON object as your final line (issue #1062 finding
      C: the loop reads a structured `goal_status` field, not substring-matched
      prose):

      ```json
      {"goal_status": "ACHIEVED", "summary": "gaps or reason, if any"}
      ```

      `goal_status` MUST be EXACTLY one of `ACHIEVED`, `PARTIAL`, or
      `NOT_ACHIEVED`.
    output: "reflection_2"
    parse_json: true

  - id: "execute-round-3"
    type: "agent"
    condition: |
      reflection_2 and (reflection_2.goal_status == 'PARTIAL' or reflection_2.goal_status == 'NOT_ACHIEVED')
    agent: "amplihack:core:builder"
    prompt: |
      Final round. Complete as much remaining work as possible.

      **Original Goal**: {{decomposition_json}}
      **Round 2 Result**: {{round_2_result}}
      **Round 2 Gaps**: {{reflection_2.summary}}

      Prioritize the most critical missing items. This is the last round.
      Report what was and was not completed.
      End with "STATUS: COMPLETE" or "STATUS: PARTIAL".
    output: "round_3_result"

  - id: "reflect-final"
    type: "agent"
    condition: "'Q&A' not in task_type and ('Operations' not in task_type or ops_modified_files) and round_1_result"
    agent: "amplihack:core:reviewer"
    prompt: |
      Final assessment after all execution rounds.

      **Goal**: {{decomposition_json}}

      **Results**:
      - Round 1: {{round_1_result}}
      - Round 2 (if any): {{round_2_result}}
      - Round 3 (if any): {{round_3_result}}

      Note: empty strings above mean that round was not needed.

      ## Deliverable PR early-exit (issue #1025)

      If a deliverable pull request exists for this workstream, check its CI
      status (`gh pr view --json state,isDraft` plus `gh pr checks --required`,
      or `gh pr checks --required <branch>`). Unless
      AMPLIHACK_DISABLE_PR_GREEN_SHORTCIRCUIT is truthy: when the PR is
      definitively OPEN (not draft), the required-check set is concrete/nonempty,
      and ALL required checks are green, conclude `GOAL_STATUS: ACHIEVED` — CI
      on the clean checkout is authoritative and a local-only failure must not
      override it. NEVER conclude ACHIEVED via this rule on
      pending/failing/closed/draft/no-PR/empty-required-check-set or unknown
      states; evaluate normally in those cases.

      Was the overall goal achieved? Summarize what was done.
      End with `GOAL_STATUS: ACHIEVED`, `GOAL_STATUS: PARTIAL -- [gaps]`,
      or `GOAL_STATUS: NOT_ACHIEVED -- [reason]`.
    output: "reflection_final"
