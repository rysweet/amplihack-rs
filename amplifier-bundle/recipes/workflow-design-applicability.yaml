name: "workflow-design-applicability"
version: "1.0.0"
description: >
  Decide which optional design steps are worth running, before any of them
  spawn an agent.

# Steps 5b (API design) and 5c (database design) used to declare themselves
# optional in prose inside their own prompts -- "(if applicable)" and "Skip if
# no API/database work is required". Prose cannot skip a step: the engine has
# already spawned the agent by the time it reads the sentence, so the cost of
# an optional step was paid in full on every run, including ones that only
# touched a CLI flag or a CI workflow file (issue #1334).
#
# This phase makes the decision once, cheaply, and publishes it as a structured
# field the engine can evaluate. It lives in its own brick because every other
# design-phase recipe is already at the 400-line budget.

steps:
  - id: "step-05a-design-applicability"
    agent: "amplihack:architect"
    prompt: |
      # Step 5a: Design Applicability

      **Task:** {{task_description}}
      **Requirements:** {{final_requirements}}

      Decide only whether the dedicated API-design and database-design steps
      are worth running for THIS task. Design nothing here.

      Answer "false" only when you are confident the task involves no such
      work at all -- a CLI flag, a CI workflow edit, a pure refactor. When in
      doubt answer "true": running a step costs time, skipping a needed one
      costs correctness.

      Output exactly one JSON object:

      ```json
      {
        "requires_api_design": "true/false",
        "requires_database_design": "true/false",
        "rationale": "one sentence per decision"
      }
      ```
    output: "design_applicability"
    parse_json: true
