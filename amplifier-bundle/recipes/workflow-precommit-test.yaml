name: "workflow-precommit-test"
description: "Phase 5: pre-commit hooks + local testing (12-13)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["development", "testing", "quality"]

# workflow-precommit-test: extracted from default-workflow.yaml as a composable phase brick.
#
# Context flows in from the parent
# workflow via recipe-runner's automatic context-merging in
# `_execute_sub_recipe()`; outputs declared by these steps propagate back to
# the parent and are visible to subsequent phase recipes.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 80

context:
  worktree_setup: ""
  allow_no_op: false

steps:
  - id: "checkpoint-implementation"
    type: "bash"
    working_dir: "{{worktree_setup.worktree_path}}"
    parse_json: true
    command: |
      set -euo pipefail
      EVIDENCE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_terminal_evidence.sh"
      # Missing original implementation is retained as a negative checkpoint.
      rc=0; bash "$EVIDENCE_HELPER" checkpoint-implementation || rc=$?
      [ "$rc" -lt 2 ] || exit "$rc"
    output: "implementation_checkpoint"

  - id: "step-12-run-precommit"
    agent: "amplihack:pre-commit-diagnostic"
    working_dir: "{{worktree_setup.worktree_path}}"
    condition: "goal_already_met != 'true'"
    prompt: |
      # Step 12: Project Checks and Pre-commit Hooks

      Inspect maintained manifests, lockfiles, configuration, changed components
      and documented project commands. Accumulate obligations across Rust/Cargo,
      JavaScript/Node, TypeScript, Python/uv, Go and .NET. Unknown or unresolved
      components remain unproven. Do not relabel Node checks as Cargo.
      Preserve configured pre-commit and quality checks. No hook configuration
      is inapplicability, with inspected justification, never a passed execution.
      Every applicable Rust workspace independently requires actual
      cargo test --workspace --locked at its root, FULL_WORKSPACE and DEFAULT
      test threading. No subsets, filters, exclusions, skips or thread overrides.
      CARGO_BUILD_JOBS=2 limits compilation, not test threading.

      Use amplifier-bundle/tools/workflow_terminal_evidence.sh from the selected
      framework root (AMPLIHACK_HOME). Its local operations accept --request-file
      FILE (or - for stdin), integer schema_version=1, workflow{name,started_at,
      original_run_id?}, and the canonical repository_root. Preserve the original
      WORKFLOW_STARTED_AT. Context operations use the selected recipe context.
      Register an immutable plan using `plan --request-file FILE`:
      components[{id,root,toolchain,disposition,inspected:[{path,sha256,purpose}],
      justification}], obligations[{id,component_ids,kind,toolchain,runner,argv,
      cwd,scope,threading?,selected_from:[{path,sha256,purpose}],scenario?}],
      exclusions[{id,component_ids,subject,reason,policy_refs:[{path,sha256,purpose}]}].
      Component roots and inspected paths are repository-relative; cwd is absolute.
      Include applicable tests, typecheck, quality and precommit obligations, plus
      two planned consumer obligations for Step 13 with scenario{role,assertions,
      inspected}; roles are basic and edge_or_integration. Assertions must describe
      actual behavior in inspected executable scenarios. Keep actual runner names,
      including Vitest/tsc where configured. Never invent a command from language alone.

      For each non-consumer obligation use `capture --request-file FILE` with the
      same identity, plan_id, obligation_id, exact argv/cwd, and
      producer_step="step-12-run-precommit". Capture executes argv directly and
      retains genuine raw output, numeric termination, source and input bindings.
      If fixes change source, register a fresh plan and rerun affected evidence.
      Never submit a fabricated PASS or a self-written execution receipt.
      Return exactly {schema_version:1,plan_id,status:"PASS"|"FAIL",
      checks:[{obligation_id,execution_ids:[captured_execution_id]}],
      exclusions:[registered_exclusion_id]}. Retain unsuccessful output truthfully.
    output: "precommit_results"
    parse_json: true

  - id: "step-13-local-testing"
    agent: "amplihack:builder"
    working_dir: "{{worktree_setup.worktree_path}}"
    condition: "goal_already_met != 'true'"
    prompt: |
      # Step 13: Mandatory Outside-In Testing (CANNOT BE SKIPPED)

      Task: {{task_description}}
      Repository: {{repo_path}}
      Registered checks: {{precommit_results}}
      Use the qa-team skill (outside-in-testing alias supported). Execute at least
      two meaningful consumer scenarios: basic behavior and an edge case or
      integration behavior, using the project's real configured toolchain.
      Inspect assertions and invoke each registered consumer obligation separately
      through workflow_terminal_evidence.sh capture --request-file FILE with the
      original workflow identity, canonical repository_root, plan_id, obligation_id,
      exact argv/cwd and producer_step="step-13-local-testing". Each scenario must
      have its own execution ID. Tests and checks alone cannot supply missing
      implementation completion. Auto-drive's separate QA policy remains binding.
      Document actual commands, outputs and assertions for publication. Return
      exactly {schema_version:1,plan_id,status:"PASS"|"FAIL",scenarios:[
      {obligation_id,execution_id,role:"basic"|"edge_or_integration",assertions:[...]}]}.
      Report failures truthfully; never fabricate receipts or rename commands.
    output: "local_testing_gate"
    parse_json: true

  - id: "verification-terminal-evidence"
    type: "bash"
    working_dir: "{{worktree_setup.worktree_path}}"
    condition: "goal_already_met != 'true'"
    parse_json: true
    command: |
      set -euo pipefail
      EVIDENCE_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_terminal_evidence.sh"
      bash "$EVIDENCE_HELPER" verify
    output: "verification_terminal_evidence"
