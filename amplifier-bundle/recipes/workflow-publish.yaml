name: "workflow-publish"
description: "Phase 6: bump + commit + push + draft PR + outside-in (14-16b)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["development", "version", "pr"]
# workflow-publish: default-workflow phase brick. Parent context is merged by
# recipe-runner; declared outputs propagate to later phase recipes. Pager safety:
# recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.
recursion:
  max_depth: 6
  max_total_steps: 80

inputs:
  - name: worktree_setup.worktree_path
    description: "Absolute path to the per-task worktree produced by workflow-worktree (step-04). Required by bash steps that cd into the worktree (step-15, step-16)."
  - name: repo_path
    description: "Absolute path to the repository root. Provided by parent recipe context."

context:
  worktree_setup: ""
  allow_no_op: false
  allow_version_bump: "false"
  terminal_success: "false"
  terminal_state: ""
  terminal_reason: ""
  publish_status: ""
  should_publish: "true"
  should_finalize: "true"
  should_run_ci_wait: "true"
  should_merge: "true"

steps:
  - id: "publish-sync-pr-head"
    type: "bash"
    command: |
      set -euo pipefail
      export GIT_PAGER=cat PAGER=cat LESS=FRX
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-}}"
      # Issue #1575: a run continuing an existing PR (resume_checkpoint, existing_branch,
      # pr_number) reached the probe with unpushed commits. Fast-forward the PR head first;
      # on divergence or a failed push the helper explains and the probe still fails closed.
      # Never fails the recipe and never pushes from REPO_PATH, the caller's checkout (#1528).
      if [ -z "$WORKTREE_SETUP_WORKTREE_PATH" ] || ! cd -P "$WORKTREE_SETUP_WORKTREE_PATH" 2>/dev/null; then echo "WARNING: publish-sync-pr-head: no usable worktree path; PR head not synced (#1575)" >&2; exit 0; fi
      { gd=$(git rev-parse --absolute-git-dir) && cd_=$(git rev-parse --path-format=absolute --git-common-dir) && [ "$gd" != "$cd_" ] && [ "$(git rev-parse --show-toplevel)" = "$(pwd -P)" ]; } 2>/dev/null || { echo "WARNING: publish-sync-pr-head: $(pwd -P) is not a linked task worktree; PR head not synced (#1528/#1575)" >&2; exit 0; }
      SYNC=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/workflow_sync_pr_head.sh" ] && { SYNC="$c/amplifier-bundle/tools/workflow_sync_pr_head.sh"; break; }; done
      if [ -n "$SYNC" ]; then bash "$SYNC" --mode pre-probe; else echo "WARNING: workflow_sync_pr_head.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack) — PR head not synced; the terminal-state probe stays strict (#1575)" >&2; fi

  - id: "publish-terminal-state"
    type: "recipe"
    recipe: "workflow-terminal-state"

  - id: "step-14-bump-version"
    agent: "amplihack:architect"
    working_dir: "{{worktree_setup.worktree_path}}"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    prompt: |
       # Step 14: Bump Version in Cargo.toml (MANDATORY)

       Before committing, bump `Cargo.toml` to match the change type.

       **Task:** {{task_description}}

       Required:
       1. Review `git diff main...HEAD`.
       2. Classify as PATCH (fix/docs/refactor), MINOR (backward-compatible feature/API), or MAJOR (breaking).
       3. Update `[workspace.package].version` ONLY when warranted:
          - **PATCH (fix/docs/refactor): DO NOT modify the `version` line.** Set
            `new_version` = `current_version` in the output JSON — no bump.
          - **MINOR: bump minor** (X.Y.Z → X.(Y+1).0). **MAJOR: bump major** (→ (X+1).0.0).
       4. Verify the version matches the classification (unchanged for PATCH).

       Useful commands:
       ```bash
       cd {{repo_path}}
       git diff main...HEAD --stat
       CURRENT_VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
       echo "Current version: $CURRENT_VERSION"
       # MINOR/MAJOR only (PATCH: no sed): sed -i 's/version = "X.Y.Z"/version = "NEW.VERSION"/' Cargo.toml
       grep -E '^version = ' Cargo.toml | head -1
       ```

       **Output JSON:**
       ```json
       {
         "current_version": "X.Y.Z",
         "new_version": "A.B.C",
         "change_classification": "PATCH|MINOR|MAJOR",
         "rationale": "explanation of why this version bump",
         "changes_summary": "brief summary of what changed"
       }
       ```

       The version bump must be included in the Step 15 implementation commit.
    output: "version_bump"
    parse_json: true

  - id: "step-14b-sync-lockfile"
    type: "bash"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    command: |
      set -euo pipefail
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-${REPO_PATH:-}}}"
      cd "${WORKTREE_SETUP_WORKTREE_PATH:?step-14b requires worktree_setup.worktree_path from step-04 (workflow-worktree); ensure parent recipe ran worktree-setup and propagated outputs}"
      # Issue #915: step-14's version bump leaves Cargo.lock stale, so --locked
      # pre-commit gates fail deterministically. Keep the lock IN SYNC (do NOT
      # weaken --locked) via an offline update; skip gracefully on non-Rust workspaces.
      if [ -f Cargo.toml ] && [ -f Cargo.lock ]; then
        echo "step-14b: syncing Cargo.lock to bumped version (offline)"
        cargo update --workspace --offline
      else
        echo "step-14b: no Cargo.toml/Cargo.lock present; skipping lockfile sync (non-Rust workspace)"
      fi

  - id: "step-14c-sync-package-json"
    type: "bash"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    command: |
      set -euo pipefail
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-${REPO_PATH:-}}}"
      cd "${WORKTREE_SETUP_WORKTREE_PATH:?step-14c requires worktree_setup.worktree_path from step-04 (workflow-worktree); ensure parent recipe ran worktree-setup and propagated outputs}"
      SP=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/workflow_sync_package_version.sh" ] && { SP="$c/amplifier-bundle/tools/workflow_sync_package_version.sh"; break; }; done
      # A missing mirror helper must not fail a publish; the version sync is advisory.
      if [ -n "$SP" ]; then bash "$SP" .; else echo "WARNING: workflow_sync_package_version.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack) — package.json version not synced (#925)" >&2; fi

  - id: "step-14g-artifact-guard"
    type: "bash"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    command: |
      set -euo pipefail
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-${REPO_PATH:-}}}"
      cd "${WORKTREE_SETUP_WORKTREE_PATH:?step-14g requires worktree_setup.worktree_path from step-04 (workflow-worktree); ensure parent recipe ran worktree-setup and propagated outputs}"
      amplihack hygiene artifact-guard --repo . --mode pre-publish

  - id: "step-15-commit-push"
    type: "bash"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    command: |
      set -euo pipefail
      export GIT_PAGER=cat
      export PAGER=cat
      export LESS=FRX
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-}}"
      # Issue #1528: stage and commit only at the top of the linked task worktree; no REPO_PATH fallback.
      # Hard-fail rather than skip: a skipped commit here would lose work silently.
      cd -P "${WORKTREE_SETUP_WORKTREE_PATH:?step-15 requires worktree_setup.worktree_path from step-04 (workflow-worktree); ensure parent recipe ran worktree-setup and propagated outputs}"
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "ERROR: step-15-commit-push requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2
        exit 1
      fi
      { gd=$(git rev-parse --absolute-git-dir) && cd_=$(git rev-parse --path-format=absolute --git-common-dir) && [ "$gd" != "$cd_" ] && [ "$(git rev-parse --show-toplevel)" = "$(pwd -P)" ]; } 2>/dev/null || { echo "ERROR: step-15-commit-push: $(pwd -P) is not the top of a linked task worktree; refusing to stage or commit; never commits in REPO_PATH (#1528)" >&2; exit 1; }
      # Security: refuse to commit/push on protected branches, even inside a linked worktree.
      _CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
      if [ "$_CURRENT_BRANCH" = "main" ] || [ "$_CURRENT_BRANCH" = "master" ]; then echo "ERROR: step-15 landed on protected branch '$_CURRENT_BRANCH' — refusing to commit. Worktree setup likely failed." >&2; exit 1; fi
      echo "=== Step 15: Commit and Push ===" >&2
      # FIX (#495): commit_result MUST be emitted on every exit path so step-16
      # (PR creation) can be gated on the actual push outcome. Trap installed
      # AFTER var init, BEFORE any failing command — reordering produces invalid JSON.
      if ! command -v jq >/dev/null 2>&1; then
        echo "ERROR: jq is required by step-15 (commit_result emission)." >&2
        exit 2
      fi
      pushed="false"; sha=""; branch=""; reason="aborted"
      _emit_commit_result() {
        jq -nc --arg pushed "$pushed" --arg sha "$sha" --arg branch "$branch" --arg reason "$reason" \
          '{pushed:$pushed,sha:$sha,branch:$branch,reason:$reason}'
      }
      trap _emit_commit_result EXIT
      branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
      # Issue #1575: staging, the message and the push live in helpers. A missing helper
      # fails closed before anything is staged; never fall back to a blanket `git add -A`.
      _find_helper() {
        HELPER=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/$1" ] && { HELPER="$c/amplifier-bundle/tools/$1"; return 0; }; done
        echo "ERROR: step-15: $1 not found (searched AMPLIHACK_HOME, REPO_PATH, worktree, ~/.copilot, ~/.amplihack); refusing to stage or commit (#1575)" >&2
        reason="helper-missing:$1"; exit 2
      }
      _find_helper workflow_stage_task_changes.sh; STAGE="$HELPER"
      _find_helper workflow_commit_message.sh; MSG="$HELPER"
      _find_helper workflow_sync_pr_head.sh; SYNC="$HELPER"
      echo "--- Staging Changes ---" >&2
      RUNTIME_ARTIFACT_HELPER="${WORKFLOW_RUNTIME_ARTIFACT_HELPER:-${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_runtime_artifacts.sh}"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="$(pwd)/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || { echo "ERROR: workflow runtime artifact helper not found (searched WORKFLOW_RUNTIME_ARTIFACT_HELPER, AMPLIHACK_HOME, REPO_PATH, worktree, ~/.copilot, ~/.amplihack): $RUNTIME_ARTIFACT_HELPER" >&2; exit 2; }
      . "$RUNTIME_ARTIFACT_HELPER"
      preflight_known_workflow_runtime_artifacts .
      amplihack hygiene artifact-guard --repo . --mode pre-publish
      # Stages the worktree minus generated .github/hooks/ paths and version-only churn (#1575).
      ALLOW_VERSION_BUMP="${RECIPE_VAR_allow_version_bump:-false}" bash "$STAGE" || { stage_rc=$?; reason="stage-failed"; exit "$stage_rc"; }
      amplihack hygiene artifact-guard --repo . --mode pre-publish
      echo "--- Creating Commit ---" >&2
      # FIX (#469/#311): env vars are injection-safe; ${VAR:-} nounset reads so an unset value can't abort before the #944 fallback below.
      TASK_DESC="${TASK_DESCRIPTION:-}"
      ISSUE_NUMBER="${ISSUE_NUMBER:-}"
      # FIX (#944): commit prefix from step-14's real change type (PATCH->fix:,
      # MINOR->feat:, MAJOR->feat!:), not a hardcoded 'feat:'. Unknown -> bugfix heuristic.
      CHANGE_CLASS="${VERSION_BUMP_CHANGE_CLASSIFICATION:-${RECIPE_VAR_version_bump__change_classification:-}}"
      case "$(printf '%s' "$CHANGE_CLASS" | tr '[:lower:]' '[:upper:]')" in
        PATCH) COMMIT_PREFIX="fix: " ;;
        MINOR) COMMIT_PREFIX="feat: " ;;
        MAJOR) COMMIT_PREFIX="feat!: " ;;
        *)
          case "$(printf '%s' "$TASK_DESC" | tr '[:upper:]' '[:lower:]')" in
            *bug*|*bugfix*|*fix*) COMMIT_PREFIX="fix: " ;;
            *)                    COMMIT_PREFIX="feat: " ;;
          esac ;;
      esac
      # FIX (#1575): the subject describes the staged index; TASK_DESC only picks the prefix.
      COMMIT_TITLE=$(bash "$MSG" subject "$COMMIT_PREFIX") || COMMIT_TITLE=""
      [ -n "$COMMIT_TITLE" ] || { COMMIT_TITLE=$(printf '%supdate files' "$COMMIT_PREFIX"); git diff --cached --quiet || echo "WARNING: step-15: commit message helper returned no subject; using '$COMMIT_TITLE'" >&2; }
      # FIX #684: Host-aware commit references.
      # FIX #1361: on GitHub the closing keyword is EARNED BY THE DIFF. PR #1283's
      # body said `Closes #1277` while its whole change was one added planning
      # document; had it merged, a genuine bug report would have been auto-closed
      # by an artifact describing what somebody intended to do about it. A change
      # that only writes down a plan gets `Refs`, which still links the PR to the
      # issue but leaves it open for the work itself. Unreachable helper -> `Refs`:
      # under-linking costs a manual close, over-linking closes a live bug silently.
      HOST_TYPE="${REMOTE_HOST_TYPE:-other}"
      CLOSE_KW="Refs"; IR=""; for c in "${AMPLIHACK_HOME:-}" "${REPO_PATH:-}" "$(pwd)" "${HOME:-/root}/.copilot" "${HOME:-/root}/.amplihack"; do [ -n "$c" ] && [ -f "$c/amplifier-bundle/tools/workflow_issue_reference.sh" ] && { IR="$c/amplifier-bundle/tools/workflow_issue_reference.sh"; break; }; done
      if [ -n "$IR" ]; then CLOSE_KW="$(git diff --cached --name-only | bash "$IR" --keyword)" || CLOSE_KW="Refs"; else echo "WARNING: workflow_issue_reference.sh not found (searched AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack) — using the non-closing 'Refs' keyword (#1361)" >&2; fi
      case "$HOST_TYPE" in
        github) ISSUE_REF="${CLOSE_KW} #${ISSUE_NUMBER}" ;;
        azdo)   ISSUE_REF="AB#${ISSUE_NUMBER}" ;;
        *)      ISSUE_REF="Ref #${ISSUE_NUMBER}" ;;
      esac
      # FIX (#1575): the body is the staged --stat, then the issue reference.
      COMMIT_MSG=$(printf '%s\n\n%s\n\n%s' "$COMMIT_TITLE" "$(bash "$MSG" body)" "$ISSUE_REF")
      # PERF: --quiet short-circuits on the first staged change.
      if ! git diff --cached --quiet; then
        GIT_IDENTITY_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(git rev-parse --show-toplevel)}}/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(git rev-parse --show-toplevel)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="$(pwd)/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || GIT_IDENTITY_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/git-identity.sh"; [ -f "$GIT_IDENTITY_HELPER" ] || { echo "ERROR: git identity helper not found: $GIT_IDENTITY_HELPER" >&2; exit 2; }; . "$GIT_IDENTITY_HELPER"
        amplihack_prepare_git_commit_identity
        git commit -m "$COMMIT_MSG"
      else
        # FIX (#282): avoid hollow-success false-positive — check the current branch
        # for new commits (in any worktree) before declaring nothing was done.
        CURRENT_BRANCH=$(git branch --show-current)
        ALT_WORKTREE_COMMITS=0
        if [ -n "$CURRENT_BRANCH" ] && git rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1; then
          ALT_WORKTREE_COMMITS=$(git rev-list --count '@{u}..HEAD' 2>/dev/null || echo 0)
        fi
        if [ "$ALT_WORKTREE_COMMITS" -gt 0 ]; then
          echo "INFO: Nothing staged in ${WORKTREE_SETUP_WORKTREE_PATH:-(unset)}, but the" >&2
          echo "current branch '$CURRENT_BRANCH' is $ALT_WORKTREE_COMMITS commit(s) ahead of upstream." >&2
          git --no-pager log --oneline -"$ALT_WORKTREE_COMMITS" >&2
        else
          echo "INFO: Nothing staged to commit; continuing so already-pushed meaningful work can be published or classified." >&2
        fi
      fi
      echo "--- Pushing to Remote ---" >&2
      # REL-002: Detect missing upstream tracking branch before rev-list
      if ! git rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1; then
        echo "WARNING: No upstream tracking branch configured — skipping push" >&2
        reason="no-upstream"
        exit 0
      fi
      # FIX (#978, #1575): one ancestry policy, shared with publish-sync-pr-head. The helper
      # fast-forwards with an explicit refspec and verifies, or fails closed on divergence.
      sync_rc=0; sync_line=$(bash "$SYNC" --mode step15) || sync_rc=$?
      sync_line="${sync_line%%$'\n'*}"
      case "$sync_line" in pushed=*" sha="*" reason="*) ;; *) sync_line="pushed=false sha= reason=sync-no-result" ;; esac
      pushed="${sync_line#pushed=}"; pushed="${pushed%% *}"; [ "$pushed" = "true" ] || pushed="false"
      sha="${sync_line#* sha=}"; sha="${sha%% *}"; printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}([0-9a-f]{24})?$' || sha=""
      reason="${sync_line#* reason=}"
      [ "$sync_rc" -eq 0 ] || exit "$sync_rc"
      echo "=== Commit and Push Complete ===" >&2
    output: "commit_result"
    parse_json: true

  - id: "step-16-create-draft-pr"
    type: "bash"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true' && commit_result.pushed == 'true'"
    command: |
      set -euo pipefail
      export GIT_PAGER=cat PAGER=cat LESS=FRX
      : "${WORKTREE_SETUP_WORKTREE_PATH:=${RECIPE_VAR_worktree_setup__worktree_path:-${REPO_PATH:-}}}"
      cd "${WORKTREE_SETUP_WORKTREE_PATH:?step-16 requires worktree_setup.worktree_path from step-04 (workflow-worktree); ensure parent recipe ran worktree-setup and propagated outputs}"
      git rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "ERROR: step-16-create-draft-pr requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2; exit 1; }
      _CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
      if [ "$_CURRENT_BRANCH" = "main" ] || [ "$_CURRENT_BRANCH" = "master" ]; then echo "ERROR: step-16 landed on protected branch '$_CURRENT_BRANCH' — refusing to create PR. Worktree setup likely failed." >&2; exit 1; fi
      HOST_TYPE="${REMOTE_HOST_TYPE:-other}"
      if [ "$HOST_TYPE" != "github" ]; then :; fi
      RUNTIME_ARTIFACT_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="$(pwd)/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || RUNTIME_ARTIFACT_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_runtime_artifacts.sh"
      [ -f "$RUNTIME_ARTIFACT_HELPER" ] || { echo "ERROR: workflow runtime artifact helper not found (searched AMPLIHACK_HOME, REPO_PATH, worktree, ~/.copilot, ~/.amplihack): $RUNTIME_ARTIFACT_HELPER" >&2; exit 2; }
      # shellcheck source=/dev/null
      . "$RUNTIME_ARTIFACT_HELPER"
      preflight_known_workflow_runtime_artifacts .
      # Contract implemented by workflow_publish_pr.sh: --state all; gh pr view; headRefName; headRefOid; mergedAt; git diff --quiet; terminal_status; non-github.
      # Base-ref contract: resolve_pr_base_ref checks refs/remotes/origin/HEAD, runs git remote set-head origin -a, falls back through origin/master origin/develop, and fails with ERROR: no supported remote base ref found.
      # Metadata contract: ISSUE_NUM, git diff, git log, git diff --name-only, Changed files, Validation, Behavior, Risk, and step-13 shape PR title/body context.
      # PUBLISH_STATE="no-diff"; PUBLISH_STATE="existing-open-pr"; PUBLISH_STATE="already-merged"; PUBLISH_STATE="closed-after-merge"; PUBLISH_STATE="closed-unmerged-with-diff".
      # Provider-aware states: GitHub preserves existing scoped PR behavior; AzDO uses REMOTE_HOST_TYPE=azdo with az repos pr list/create.
      # Terminal vocabulary: MERGED, CLOSED_OBSOLETE, NO_DIFF_SUCCESS, FOLLOWUP_CREATED, EXISTING_OPEN_PR, BLOCKED_CI, BLOCKED_PROVIDER.
      # gh pr create is called by the helper only after PUBLISH_STATE classification.
      # gh pr create failed is surfaced by workflow_publish_pr.sh as FAILED_PR_CREATE.
      PUBLISH_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_publish_pr.sh"; [ -f "$PUBLISH_HELPER" ] || PUBLISH_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_publish_pr.sh"; [ -f "$PUBLISH_HELPER" ] || PUBLISH_HELPER="$(pwd)/amplifier-bundle/tools/workflow_publish_pr.sh"; [ -f "$PUBLISH_HELPER" ] || PUBLISH_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_publish_pr.sh"; [ -f "$PUBLISH_HELPER" ] || PUBLISH_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_publish_pr.sh"; [ -f "$PUBLISH_HELPER" ] || { echo "ERROR: workflow publish helper not found at any known location (AMPLIHACK_HOME, REPO_PATH, worktree, cwd, ~/.copilot, ~/.amplihack): $PUBLISH_HELPER; cwd=$(pwd)" >&2; exit 1; }
      bash "$PUBLISH_HELPER"
    output: "pr_publish_result"
    parse_json: true

  - id: "step-16b-outside-in-fix-loop"
    agent: "amplihack:builder"
    working_dir: "{{worktree_setup.worktree_path}}"
    condition: "goal_already_met != 'true' && terminal_state.terminal_success != 'true' && terminal_state.should_publish == 'true'"
    prompt: |
       # Step 16b: Outside-In Testing and Fix Loop (MANDATORY)

       Test from the PR branch as a user would, fix failures, and update the PR.

       **Task:** {{task_description}}
       **PR URL:** {{pr_publish_result.pr_url}}

       Required:
       1. Get the current branch with `git branch --show-current`.
       2. Detect affected languages, manifests, lockfiles, package managers,
          entry points, changed files, and documented project commands before
          choosing a validation strategy.
       3. Invoke `Skill(skill="qa-team")`.
       4. Run at least one simple and one edge/integration scenario through the
          appropriate outside-in user or consumer boundary for the detected
          toolchain. Examples include local `cargo`, `npm`, `uv`/Python, `go`,
          or `dotnet` commands; `uvx` is only appropriate for Python/uv CLI
          distribution validation when that project shape warrants it.
       5. If a test fails, diagnose, fix, commit, push, and retry up to 3 times:
          ```bash
