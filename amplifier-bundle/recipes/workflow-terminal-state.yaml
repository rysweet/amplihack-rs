name: "workflow-terminal-state"
description: "Reusable default-workflow terminal-state probe for merged, obsolete, no-diff, follow-up, and blocked states"
version: "1.0.0"
author: "Amplihack Team"
tags: ["development", "terminal-state", "publish", "finalize"]

recursion:
  max_depth: 1
  max_total_steps: 4

inputs:
  - name: worktree_setup.worktree_path
    description: "Preferred workflow worktree path. When present, all git and gh probes operate in this checkout instead of repo_path."
  - name: repo_path
    description: "Repository path used for git and gh probes."
  - name: branch_name
    description: "Expected branch name; defaults to the current branch when empty."
  - name: base_ref
    description: "Intended base ref; defaults to origin/HEAD, origin/main, origin/master, or origin/develop."
  - name: pr_number
    description: "Optional PR number to validate and inspect."
  - name: pr_url
    description: "Optional PR URL to validate and inspect."
  - name: goal_already_met
    description: "Legacy design signal; used only as supporting evidence and never as an override."
  - name: terminal_fail_mode
    description: "Failure behavior for terminal probe blockers. `exit` preserves standalone fail-closed behavior; `report` emits blocker JSON with exit 0 so workflow-finalize can classify and validate it agentically."
  - name: task_description
    description: "Original task description. Retained for context/plumbing; no-merge intent is no longer scraped from this prose (issue #1062 finding B) — see the structured `no_merge` flag emitted by the classifier."
  - name: no_merge
    description: "Structured no-merge flag ('true'/'1'/'yes') emitted by the classifier (smart-classify-route `no_merge` field, issue #929/#1062). When truthy it forces should_merge='false'; absent it preserves the auto-merge default."

context:
  repo_path: "."
  branch_name: ""
  base_ref: ""
  pr_number: ""
  pr_url: ""
  goal_already_met: "false"
  terminal_gate_mode: "probe"
  terminal_fail_mode: "exit"
  task_description: ""
  no_merge: ""

steps:
  - id: "probe-terminal-state"
    type: "bash"
    condition: "terminal_gate_mode != 'strict'"
    parse_json: true
    command: |
      set -euo pipefail
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX

      if ! command -v jq >/dev/null 2>&1; then
        echo "ERROR: jq is required by workflow-terminal-state." >&2
        exit 2
      fi

      terminal_success="false"
      terminal_state="FOLLOWUP_CREATED"
      terminal_reason="meaningful unmerged work remains; publish should continue"
      publish_status="FOLLOWUP_CREATED"
      should_publish="true"
      should_finalize="true"
      should_run_ci_wait="true"
      should_merge="true"
      pr_url_result=""
      pr_number_result=""
      branch_diff_status="unknown"
      commits_ahead="0"

      emit_terminal_state() {
        jq -nc \
          --arg terminal_success "$terminal_success" \
          --arg terminal_state "$terminal_state" \
          --arg terminal_reason "$terminal_reason" \
          --arg publish_status "$publish_status" \
          --arg should_publish "$should_publish" \
          --arg should_finalize "$should_finalize" \
          --arg should_run_ci_wait "$should_run_ci_wait" \
          --arg should_merge "$should_merge" \
          --arg pr_url "$pr_url_result" \
          --arg pr_number "$pr_number_result" \
          --arg branch_diff_status "$branch_diff_status" \
          --arg commits_ahead "$commits_ahead" \
          '{terminal_success:$terminal_success,terminal_state:$terminal_state,terminal_reason:$terminal_reason,publish_status:$publish_status,should_publish:$should_publish,should_finalize:$should_finalize,should_run_ci_wait:$should_run_ci_wait,should_merge:$should_merge,pr_url:$pr_url,pr_number:$pr_number,branch_diff_status:$branch_diff_status,commits_ahead:$commits_ahead}'
      }

      fail_terminal_state() {
        terminal_success="false"
        terminal_state="$1"
        terminal_reason="$2"
        publish_status="$1"
        should_publish="false"
        should_finalize="false"
        should_run_ci_wait="false"
        should_merge="false"
        emit_terminal_state
        echo "ERROR: workflow-terminal-state: $terminal_state: $terminal_reason" >&2
        fail_mode="${TERMINAL_FAIL_MODE:-${RECIPE_VAR_terminal_fail_mode:-}}"
        [ -n "$fail_mode" ] || fail_mode="{{terminal_fail_mode}}"
        case "$fail_mode" in "{{terminal_fail_mode}}"|"") fail_mode="exit" ;; esac
        if [ "$fail_mode" = "report" ]; then
          exit 0
        fi
        exit 1
      }

      success_terminal_state() {
        terminal_success="true"
        terminal_state="$1"
        terminal_reason="$2"
        publish_status="$1"
        should_publish="false"
        should_finalize="false"
        should_run_ci_wait="false"
        should_merge="false"
        emit_terminal_state
        exit 0
      }

      continue_active_state() {
        terminal_success="false"
        terminal_state="FOLLOWUP_CREATED"
        terminal_reason="$1"
        publish_status="FOLLOWUP_CREATED"
        should_publish="true"
        should_finalize="true"
        should_run_ci_wait="true"
        should_merge="$(active_should_merge)"
        emit_terminal_state
        echo "INFO: workflow-terminal-state: active workflow state: $terminal_reason" >&2
        exit 0
      }

      sanitize_gh_stderr() {
        sed -E 's#(https?://)[^@[:space:]]+@#\1REDACTED@#g' "$1" | tr '\n' ' ' | head -c 500
      }

      is_transient_gh_error() {
        [ -s "$1" ] && grep -Eiq 'HTTP 5[0-9][0-9]|(^|[^0-9])(502|503|504)([^0-9]|$)|rate limit|timed out|timeout|temporar|connection reset|connection refused|TLS handshake|network|server error' "$1"
      }

      gh_with_retry() {
        local label="$1" stderr_file output status attempt delay=1
        shift
        for attempt in 1 2 3; do
          stderr_file=$(mktemp -t terminal-state-gh-XXXXXX)
          if output=$(timeout 60 gh "$@" 2>"$stderr_file"); then
            rm -f "$stderr_file"
            printf '%s\n' "$output"
            return 0
          else
            status=$?
          fi
          if [ "$attempt" -lt 3 ] && is_transient_gh_error "$stderr_file"; then
            echo "WARNING: gh $label failed transiently (exit ${status}); retrying (${attempt}/3): $(sanitize_gh_stderr "$stderr_file")" >&2
            rm -f "$stderr_file"
            sleep "$delay"
            delay=$((delay * 2))
            continue
          fi
          echo "ERROR: gh $label failed (exit ${status})" >&2
          [ ! -s "$stderr_file" ] || echo "gh $label stderr: $(sanitize_gh_stderr "$stderr_file")" >&2
          rm -f "$stderr_file"
          return "$status"
        done
      }

      # parse_github_repo_identity comes from the shared parser
      # workflow_github_repo.sh (issue #1642), sourced below before the cd.
      # A PR URL is parsed by position: http(s) only, the owner/repo segments
      # must equal the identity the shared parser accepted, then exactly
      # pull/<canonical number>.
      parse_github_pr_url() {
        local url="${1:-}" identity rest owner repo marker number
        case "$url" in http://*|https://*) ;; *) return 1 ;; esac
        identity="$(parse_github_repo_identity "$url")" || return 1
        rest="${url%%\?*}"
        rest="${rest%%#*}"
        rest="${rest%/}"
        rest="${rest#*://}"
        # This strip is the one allowed exception to the single-parser rule
        # (issue #1642): it runs only after parse_github_repo_identity has
        # accepted this same URL, and its result must equal that identity.
        # The accepted userinfo holds no '@' or '/', so the first
        # "@github.com/" is the host boundary.
        case "$rest" in
          github.com/*) rest="${rest#github.com/}" ;;
          *) rest="${rest#*@github.com/}" ;;
        esac
        owner="${rest%%/*}"
        rest="${rest#*/}"
        repo="${rest%%/*}"
        rest="${rest#*/}"
        [ "$owner/$repo" = "$identity" ] || return 1
        marker="${rest%%/*}"
        number="${rest#pull/}"
        [ "$marker" = "pull" ] || return 1
        [[ "$number" =~ ^[1-9][0-9]{0,9}$ ]] || return 1
        printf '%s/%s\n' "$identity" "$number"
      }

      normalize_base_name() {
        local ref="$1"
        ref="${ref#refs/heads/}"
        ref="${ref#origin/}"
        printf '%s\n' "$ref"
      }

      WORKTREE_INPUT="${WORKTREE_SETUP_WORKTREE_PATH:-}"
      [ -n "$WORKTREE_INPUT" ] || WORKTREE_INPUT="${RECIPE_VAR_worktree_setup__worktree_path:-}"
      REPO_DIR="${REPO_PATH:-}"
      [ -n "$REPO_DIR" ] || REPO_DIR="${RECIPE_VAR_repo_path:-}"
      [ -n "$REPO_DIR" ] || REPO_DIR="{{repo_path}}"
      BRANCH_INPUT="${BRANCH_NAME:-}"
      [ -n "$BRANCH_INPUT" ] || BRANCH_INPUT="${RECIPE_VAR_branch_name:-}"
      [ -n "$BRANCH_INPUT" ] || BRANCH_INPUT="{{branch_name}}"
      BASE_INPUT="${BASE_REF:-}"
      [ -n "$BASE_INPUT" ] || BASE_INPUT="${RECIPE_VAR_base_ref:-}"
      [ -n "$BASE_INPUT" ] || BASE_INPUT="{{base_ref}}"
      PR_NUMBER_INPUT="${PR_NUMBER:-}"
      [ -n "$PR_NUMBER_INPUT" ] || PR_NUMBER_INPUT="${RECIPE_VAR_pr_number:-}"
      [ -n "$PR_NUMBER_INPUT" ] || PR_NUMBER_INPUT="{{pr_number}}"
      PR_URL_INPUT="${PR_URL:-}"
      [ -n "$PR_URL_INPUT" ] || PR_URL_INPUT="${RECIPE_VAR_pr_url:-}"
      [ -n "$PR_URL_INPUT" ] || PR_URL_INPUT="{{pr_url}}"
      GOAL_ALREADY_MET_INPUT="${GOAL_ALREADY_MET:-}"
      [ -n "$GOAL_ALREADY_MET_INPUT" ] || GOAL_ALREADY_MET_INPUT="${RECIPE_VAR_goal_already_met:-}"
      [ -n "$GOAL_ALREADY_MET_INPUT" ] || GOAL_ALREADY_MET_INPUT="{{goal_already_met}}"
      [ "$REPO_DIR" != "{{repo_path}}" ] || REPO_DIR="."
      case "$BRANCH_INPUT" in "{{branch_name}}"|"''") BRANCH_INPUT="" ;; esac
      case "$BASE_INPUT" in "{{base_ref}}"|"''") BASE_INPUT="" ;; esac
      case "$PR_NUMBER_INPUT" in "{{pr_number}}"|"''") PR_NUMBER_INPUT="" ;; esac
      case "$PR_URL_INPUT" in "{{pr_url}}"|"''") PR_URL_INPUT="" ;; esac
      case "$GOAL_ALREADY_MET_INPUT" in "{{goal_already_met}}"|"''") GOAL_ALREADY_MET_INPUT="false" ;; esac

      # Issue #929 + #1062 (finding B): honor a no-merge directive so the
      # workflow never auto-merges when told not to. The intent is now a
      # *structured* flag emitted by the classifier (smart-classify-route's
      # `no_merge` parse_json field), NOT a bash regex guessing intent from the
      # user's prose (unusual phrasings silently auto-merged before). We read
      # the flag from the explicit `no_merge` context var / `NO_MERGE` env.
      # Additive gate: a truthy flag can only *suppress* auto-merge; when the
      # flag is absent the merge decision stays at the prior default ("true"),
      # preserving existing behavior.
      NO_MERGE_FLAG_INPUT="${NO_MERGE:-}"
      [ -n "$NO_MERGE_FLAG_INPUT" ] || NO_MERGE_FLAG_INPUT="${RECIPE_VAR_no_merge:-}"
      [ -n "$NO_MERGE_FLAG_INPUT" ] || NO_MERGE_FLAG_INPUT="{{no_merge}}"
      case "$NO_MERGE_FLAG_INPUT" in "{{no_merge}}"|"''") NO_MERGE_FLAG_INPUT="" ;; esac

      normalise_no_merge_flag() {
        # $1 structured flag value. Truthy tokens suppress auto-merge; anything
        # else (including empty/false) preserves the default merge behavior.
        local flag
        flag="$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
        case "$flag" in true|1|yes|on) printf 'true\n' ;; *) printf 'false\n' ;; esac
      }
      NO_MERGE_DIRECTIVE="$(normalise_no_merge_flag "$NO_MERGE_FLAG_INPUT")"
      if [ "$NO_MERGE_DIRECTIVE" = "true" ]; then
        echo "INFO: workflow-terminal-state: explicit no-merge directive detected; auto-merge will be suppressed (should_merge=false)" >&2
      fi

      # Resolve the active-state merge decision from the directive. Additive:
      # absent a directive this is "true", preserving default behavior.
      active_should_merge() {
        if [ "${NO_MERGE_DIRECTIVE:-false}" = "true" ]; then
          printf 'false\n'
        else
          printf 'true\n'
        fi
      }
      TARGET_REPO_DIR="$REPO_DIR"
      if [ -n "$WORKTREE_INPUT" ] && [ "$WORKTREE_INPUT" != "''" ]; then
        TARGET_REPO_DIR="$WORKTREE_INPUT"
      fi

      [ -n "$TARGET_REPO_DIR" ] || fail_terminal_state "FAILED_INVALID_INPUT" "repo_path or worktree_setup.worktree_path is required"

      # Shared GitHub repo identity parser (issue #1642). Sourcing runs code,
      # so the lookup happens BEFORE the cd and never resolves inside the
      # checkout being judged: every derived candidate whose physical
      # directory, or whose helper file itself resolves (through symlinks)
      # to TARGET_REPO_DIR or below it, is skipped. The
      # WORKFLOW_GITHUB_REPO_HELPER override is a test-only setting and is
      # not filtered, but a set-but-broken value fails closed instead of
      # falling through to the other candidates.
      physical_dir() { (cd -P "$1" 2>/dev/null && pwd -P); }
      # Physical path of a file: resolve the file's own symlinks, then the
      # physical directory that holds it.
      physical_file() {
        local path="$1" link dir
        local hops=0
        while [ -L "$path" ]; do
          hops=$((hops + 1))
          [ "$hops" -le 40 ] || return 1
          link="$(readlink "$path")" || return 1
          case "$link" in
            /*) path="$link" ;;
            *) path="$(dirname "$path")/$link" ;;
          esac
        done
        dir="$(physical_dir "$(dirname "$path")")" || return 1
        printf '%s/%s\n' "$dir" "$(basename "$path")"
      }
      TARGET_REPO_PHYS="$(physical_dir "$TARGET_REPO_DIR")" \
        || fail_terminal_state "FAILED_INVALID_INPUT" "target checkout does not exist or is not accessible: $TARGET_REPO_DIR"
      GITHUB_REPO_HELPER=""
      if [ -n "${WORKFLOW_GITHUB_REPO_HELPER:-}" ]; then
        if [ ! -f "$WORKFLOW_GITHUB_REPO_HELPER" ] || [ ! -r "$WORKFLOW_GITHUB_REPO_HELPER" ]; then
          fail_terminal_state "FAILED_INVALID_INPUT" "WORKFLOW_GITHUB_REPO_HELPER is set but is not a readable file: $WORKFLOW_GITHUB_REPO_HELPER"
        fi
        GITHUB_REPO_HELPER="$WORKFLOW_GITHUB_REPO_HELPER"
      else
        github_repo_helper_candidates=()
        [ -z "${AMPLIHACK_HOME:-}" ] || github_repo_helper_candidates+=("$AMPLIHACK_HOME/amplifier-bundle/tools")
        [ -z "${REPO_PATH:-}" ] || github_repo_helper_candidates+=("$REPO_PATH/amplifier-bundle/tools")
        github_repo_helper_candidates+=("$(pwd)/amplifier-bundle/tools")
        github_repo_helper_candidates+=("${HOME:-/root}/.copilot/amplifier-bundle/tools")
        github_repo_helper_candidates+=("${HOME:-/root}/.amplihack/amplifier-bundle/tools")
        # Every rejected candidate is recorded once (keyed by its physical
        # directory when it resolves) so the failure says exactly where it
        # looked and why each path was not used.
        github_repo_helper_searched=""
        github_repo_helper_seen=""
        note_searched() {
          case "$github_repo_helper_seen" in
            *"|$1|"*) return 0 ;;
          esac
          github_repo_helper_seen="${github_repo_helper_seen}|$1|"
          github_repo_helper_searched="${github_repo_helper_searched:+$github_repo_helper_searched; }$2 ($3)"
        }
        for candidate_dir in "${github_repo_helper_candidates[@]}"; do
          candidate_shown="$candidate_dir/workflow_github_repo.sh"
          candidate_key="$(physical_dir "$candidate_dir" 2>/dev/null)" || candidate_key="$candidate_dir"
          if [ ! -f "$candidate_shown" ]; then
            note_searched "$candidate_key" "$candidate_shown" "missing"
            continue
          fi
          if [ ! -r "$candidate_shown" ]; then
            note_searched "$candidate_key" "$candidate_shown" "unreadable"
            continue
          fi
          if ! candidate_phys="$(physical_dir "$candidate_dir")"; then
            note_searched "$candidate_key" "$candidate_shown" "unreadable"
            continue
          fi
          case "$candidate_phys" in
            "$TARGET_REPO_PHYS"|"$TARGET_REPO_PHYS"/*)
              note_searched "$candidate_key" "$candidate_shown" "skipped: inside target checkout"
              continue
              ;;
          esac
          if ! candidate_file="$(physical_file "$candidate_phys/workflow_github_repo.sh")"; then
            note_searched "$candidate_key" "$candidate_shown" "unreadable"
            continue
          fi
          case "$candidate_file" in
            "$TARGET_REPO_PHYS"/*)
              note_searched "$candidate_key" "$candidate_shown" "skipped: inside target checkout"
              continue
              ;;
          esac
          GITHUB_REPO_HELPER="$candidate_file"
          break
        done
        [ -n "$GITHUB_REPO_HELPER" ] \
          || fail_terminal_state "FAILED_INVALID_INPUT" "workflow_github_repo.sh not found; run 'amplihack install' to install or update the amplihack bundle (or set WORKFLOW_GITHUB_REPO_HELPER). Searched: $github_repo_helper_searched"
      fi
      # shellcheck source=/dev/null
      . "$GITHUB_REPO_HELPER"
      declare -F parse_github_repo_identity >/dev/null 2>&1 \
        || fail_terminal_state "FAILED_INVALID_INPUT" "workflow_github_repo.sh did not define parse_github_repo_identity"

      cd "$TARGET_REPO_DIR" 2>/dev/null || fail_terminal_state "FAILED_INVALID_INPUT" "target checkout does not exist or is not accessible: $TARGET_REPO_DIR"
      git rev-parse --is-inside-work-tree >/dev/null 2>&1 || fail_terminal_state "FAILED_INVALID_INPUT" "workflow-terminal-state requires a git repo at target checkout; either git init or rerun from a checkout"

      current_branch="$(git branch --show-current 2>/dev/null || true)"
      if [ -z "$BRANCH_INPUT" ] || [ "$BRANCH_INPUT" = "''" ]; then
        BRANCH_INPUT="$current_branch"
      fi
      [ -n "$BRANCH_INPUT" ] || fail_terminal_state "FAILED_INVALID_INPUT" "branch_name is empty and current HEAD is detached"
      git check-ref-format --branch "$BRANCH_INPUT" >/dev/null 2>&1 || fail_terminal_state "FAILED_INVALID_INPUT" "branch_name is malformed: $BRANCH_INPUT"
      if [ "$current_branch" != "$BRANCH_INPUT" ]; then
        fail_terminal_state "FAILED_WRONG_BRANCH" "target checkout branch '$current_branch' does not match branch_name '$BRANCH_INPUT'"
      fi
      local_head="$(git rev-parse --verify HEAD 2>/dev/null)" || fail_terminal_state "FAILED_INVALID_INPUT" "target checkout HEAD does not resolve"

      resolve_base_ref() {
        local candidate
        if [ -n "$BASE_INPUT" ] && [ "$BASE_INPUT" != "''" ]; then
          printf '%s\n' "$BASE_INPUT"
          return 0
        fi
        candidate="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        if [ -n "$candidate" ] && git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then printf '%s\n' "$candidate"; return 0; fi
        git remote set-head origin -a >/dev/null 2>&1 || true
        candidate="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        if [ -n "$candidate" ] && git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then printf '%s\n' "$candidate"; return 0; fi
        for candidate in origin/main origin/master origin/develop main master develop; do
          if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null; then printf '%s\n' "$candidate"; return 0; fi
        done
        return 1
      }

      base_ref="$(resolve_base_ref)" || fail_terminal_state "FAILED_INVALID_INPUT" "base_ref is missing and no supported base ref could be resolved"
      if ! git rev-parse --verify --quiet "${base_ref}^{commit}" >/dev/null; then
        fail_terminal_state "FAILED_INVALID_INPUT" "base_ref does not resolve to a commit: $base_ref"
      fi

      if [ -n "$PR_NUMBER_INPUT" ] && [ "$PR_NUMBER_INPUT" != "''" ] && ! [[ "$PR_NUMBER_INPUT" =~ ^[0-9][0-9]*$ ]]; then
        fail_terminal_state "FAILED_INVALID_INPUT" "pr_number is malformed: $PR_NUMBER_INPUT"
      fi
      if [ -n "$PR_URL_INPUT" ] && [ "$PR_URL_INPUT" != "''" ] && ! [[ "$PR_URL_INPUT" =~ ^https?://[^[:space:]]+$ ]]; then
        fail_terminal_state "FAILED_INVALID_INPUT" "pr_url is malformed: expected an http(s) URL without whitespace"
      fi

      # Dirty worktree is the first trust boundary. No terminal success is
      # allowed while uncommitted state might contain real work, but publish
      # and finalize phases must still be able to commit pending work.
      if [ -n "$(git status --porcelain)" ]; then
        continue_active_state "dirty worktree blocks terminal success; continuing workflow so pending work can be committed"
      fi

      repo_identity="$(parse_github_repo_identity "$(git config --get remote.origin.url 2>/dev/null || true)" || true)"
      repo_owner="${repo_identity%%/*}"
      repo_name="${repo_identity#*/}"
      supports_github_pr_metadata="false"
      if [ -n "$repo_identity" ]; then
        supports_github_pr_metadata="true"
      fi
      # workflow_pr_scope.sh validates headRefName, baseRefName, headRefOid,
      # isCrossRepository, expected_pr_title_prefix, and created_after.
      # Canonical resolution ladder (issue #962) so the scope helper is found at
      # the install root even for a gitignored downstream-worktree bundle; the
      # WORKFLOW_PR_SCOPE_HELPER override still wins when it points at a real file.
      PR_SCOPE_HELPER="${WORKFLOW_PR_SCOPE_HELPER:-${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_pr_scope.sh}"
      [ -f "$PR_SCOPE_HELPER" ] || PR_SCOPE_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_pr_scope.sh"
      [ -f "$PR_SCOPE_HELPER" ] || PR_SCOPE_HELPER="$(pwd)/amplifier-bundle/tools/workflow_pr_scope.sh"
      [ -f "$PR_SCOPE_HELPER" ] || PR_SCOPE_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_pr_scope.sh"
      [ -f "$PR_SCOPE_HELPER" ] || PR_SCOPE_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_pr_scope.sh"

      pr_json=""
      pr_target=""
      pr_lookup_failed="false"
      if [ -n "$PR_URL_INPUT" ] && [ "$PR_URL_INPUT" != "''" ]; then
        if parse_github_pr_url "$PR_URL_INPUT" >/dev/null 2>&1; then
          supports_github_pr_metadata="true"
          pr_target="$PR_URL_INPUT"
        else
          echo "INFO: workflow-terminal-state: non-GitHub PR URL supplied; using local git safety checks only" >&2
        fi
      elif [ "$supports_github_pr_metadata" = "true" ] && [ -n "$PR_NUMBER_INPUT" ] && [ "$PR_NUMBER_INPUT" != "''" ]; then
        pr_target="$PR_NUMBER_INPUT"
      fi

      if [ "$supports_github_pr_metadata" = "true" ] && { [ -n "$pr_target" ] || command -v gh >/dev/null 2>&1; }; then
        command -v gh >/dev/null 2>&1 || fail_terminal_state "FAILED_INVALID_INPUT" "gh is required when pr_number or pr_url is provided"
        [ -x "$PR_SCOPE_HELPER" ] || fail_terminal_state "FAILED_INVALID_INPUT" "workflow_pr_scope.sh is required for scoped current-work PR identity"
        created_after="${WORKFLOW_STARTED_AT:-${RECIPE_STARTED_AT:-${TASK_STARTED_AT:-}}}"
        # issue_number can carry a non-numeric local tracking reference (e.g.
        # local-5d904cff4398) when the workflow fell back to local tracking
        # (#815, #804). PR-scope matching only understands numeric GitHub issue /
        # AzDO work-item ids, so coerce a non-numeric ref to empty: a local ref
        # must never filter out the legitimate current-work PR.
        scoped_issue_id="${ISSUE_NUMBER:-${RECIPE_VAR_issue_number:-}}"
        case "$scoped_issue_id" in ''|*[!0-9]*) scoped_issue_id="" ;; esac
        scope_args=(
          --repo "$repo_identity"
          --head "$BRANCH_INPUT"
          --base "$(normalize_base_name "$base_ref")"
          --issue "$scoped_issue_id"
          --work-item "$scoped_issue_id"
          --head-sha "$local_head"
        )
        title_prefix="${EXPECTED_PR_TITLE_PREFIX:-${PR_EXPECTED_TITLE_PREFIX:-}}"
        [ -n "$title_prefix" ] && scope_args+=(--expected-pr-title-prefix "$title_prefix")
        [ -n "$PR_URL_INPUT" ] && scope_args+=(--pr-url "$PR_URL_INPUT")
        [ -n "$PR_NUMBER_INPUT" ] && scope_args+=(--pr-number "$PR_NUMBER_INPUT")
        [ -n "$created_after" ] && scope_args+=(--created-after "$created_after")
        if ! pr_json="$("$PR_SCOPE_HELPER" "${scope_args[@]}")"; then
          reason="$(printf '%s' "$pr_json" | jq -r '.reason // ""' 2>/dev/null || true)"
          if [ "$reason" = "no_scoped_pr" ] && [ -z "$pr_target" ]; then
            pr_json="{}"
          elif [ -n "$pr_target" ]; then
            fail_terminal_state "FAILED_INVALID_INPUT" "unavailable or mismatched scoped PR metadata for $pr_target: ${reason:-unknown}"
          else
            echo "WARNING: scoped PR lookup failed during terminal-state probe; meaningful diffs will fail closed" >&2
            pr_json="{}"
            pr_lookup_failed="true"
          fi
        fi
      elif [ -n "$PR_NUMBER_INPUT" ] && [ "$PR_NUMBER_INPUT" != "''" ]; then
        echo "INFO: workflow-terminal-state: pr_number supplied for non-GitHub remote; using local git safety checks only" >&2
      fi

      if [ -n "$pr_json" ] && [ "$pr_json" != "{}" ]; then
        pr_fields=(); while IFS= read -r _ml; do pr_fields+=("$_ml"); done < <(
          printf '%s' "$pr_json" | jq -r '.url // "", ((.number // "") | tostring), .state // "", .mergedAt // "", .headRefName // "", .baseRefName // "", .headRefOid // "", (.headRepositoryOwner.login // .headRepositoryOwner.name // .headRepositoryOwner // ""), (.headRepository.name // ((.headRepository.nameWithOwner // "") | split("/") | .[-1]) // ""), (.isCrossRepository // false | tostring), ([.statusCheckRollup[]? | select((.conclusion? // "") as $c | $c == "FAILURE" or $c == "ERROR" or $c == "TIMED_OUT" or $c == "CANCELLED")] | length | tostring)'
        )
        pr_url_result="${pr_fields[0]:-}"
        pr_number_result="${pr_fields[1]:-}"
        pr_state="${pr_fields[2]:-}"
        pr_merged_at="${pr_fields[3]:-}"
        pr_head="${pr_fields[4]:-}"
        pr_base="${pr_fields[5]:-}"
        pr_head_oid="${pr_fields[6]:-}"
        pr_head_owner="${pr_fields[7]:-}"
        pr_head_repo="${pr_fields[8]:-}"
        pr_cross_repo="${pr_fields[9]:-false}"
        failing_checks="${pr_fields[10]:-0}"
        pr_base_identity="$(parse_github_repo_identity "$pr_url_result" || true)"
        expected_base="$(normalize_base_name "$base_ref")"
        [ -n "$repo_identity" ] || fail_terminal_state "FAILED_INVALID_INPUT" "unable to determine current GitHub repo identity from origin remote"
        [ -n "$pr_head" ] || fail_terminal_state "FAILED_INVALID_INPUT" "PR metadata is missing headRefName"
        [ -n "$pr_base" ] || fail_terminal_state "FAILED_INVALID_INPUT" "PR metadata is missing baseRefName"
        [ -n "$pr_head_oid" ] || fail_terminal_state "FAILED_INVALID_INPUT" "PR metadata is missing headRefOid"
        [ -n "$pr_head_owner" ] && [ -n "$pr_head_repo" ] || fail_terminal_state "FAILED_INVALID_INPUT" "PR metadata is missing head repository identity"
        [ -n "$pr_base_identity" ] || fail_terminal_state "FAILED_INVALID_INPUT" "PR metadata is missing base repository identity"
        if [ "$pr_head" != "$BRANCH_INPUT" ]; then
          fail_terminal_state "FAILED_INVALID_INPUT" "ambiguous PR metadata: headRefName '$pr_head' does not match branch_name '$BRANCH_INPUT'"
        fi
        if [ "$pr_base" != "$expected_base" ]; then
          fail_terminal_state "FAILED_INVALID_INPUT" "ambiguous PR metadata: baseRefName '$pr_base' does not match base_ref '$expected_base'"
        fi
        if [ "$pr_head_oid" != "$local_head" ]; then
          fail_terminal_state "FAILED_INVALID_INPUT" "stale PR metadata: headRefOid '$pr_head_oid' does not match local HEAD '$local_head'"
        fi
        if [ "$pr_cross_repo" = "true" ] || [ "$pr_head_owner/$pr_head_repo" != "$repo_owner/$repo_name" ] || [ "$pr_base_identity" != "$repo_owner/$repo_name" ]; then
          fail_terminal_state "FAILED_INVALID_INPUT" "ambiguous PR metadata: PR repo '$pr_head_owner/$pr_head_repo' -> '$pr_base_identity' does not match current repo '$repo_owner/$repo_name'"
        fi

        if [ "$pr_state" = "MERGED" ] || { [ "$pr_state" = "CLOSED" ] && [ -n "$pr_merged_at" ] && [ "$pr_merged_at" != "null" ]; }; then
          success_terminal_state "MERGED" "PR is merged or closed-after-merge"
        fi
      fi

      # Closed-unmerged PRs are failure unless git proves no meaningful work remains.
      if [ -n "$pr_json" ] && [ "$pr_json" != "{}" ] && [ "${pr_state:-}" = "CLOSED" ]; then
        echo "INFO: closed-unmerged PR found; checking obsolete proof" >&2
        if git diff --quiet "${base_ref}..HEAD"; then
          branch_diff_status="no-diff"
          commits_ahead="$(git rev-list --count "${base_ref}..HEAD" 2>/dev/null || echo "0")"
          success_terminal_state "CLOSED_OBSOLETE" "closed-unmerged PR is obsolete because no meaningful diff remains"
        fi
        fail_terminal_state "FAILED_CLOSED_UNMERGED" "closed-unmerged PR still has meaningful diff"
      fi

      if [ -n "$pr_json" ] && [ "$pr_json" != "{}" ] && [ "${failing_checks:-0}" -gt 0 ]; then
        fail_terminal_state "BLOCKED_CI" "real failing checks block terminal success"
      fi

      if git diff --quiet "${base_ref}..HEAD"; then
        branch_diff_status="no-diff"
        commits_ahead="$(git rev-list --count "${base_ref}..HEAD" 2>/dev/null || echo "0")"
        if [ "$commits_ahead" = "0" ]; then
          success_terminal_state "NO_DIFF_SUCCESS" "clean branch has no meaningful diff or commits against base"
        fi
        success_terminal_state "CLOSED_OBSOLETE" "branch is superseded upstream: no meaningful diff remains despite local commits"
      fi

      branch_diff_status="has-diff"
      commits_ahead="$(git rev-list --count "${base_ref}..HEAD" 2>/dev/null || echo "0")"
      if [ "$pr_lookup_failed" = "true" ]; then
        fail_terminal_state "FAILED_PR_METADATA_UNAVAILABLE" "unavailable PR metadata for branch '$BRANCH_INPUT'; refusing to continue with meaningful diff"
      fi
      if [ "$GOAL_ALREADY_MET_INPUT" = "true" ]; then
        fail_terminal_state "FAILED_MEANINGFUL_DIFF" "goal_already_met=true is ambiguous because meaningful unmerged diff remains"
      fi

      terminal_success="false"
      terminal_state="FOLLOWUP_CREATED"
      terminal_reason="meaningful unmerged work remains; follow-up publish should continue"
      publish_status="FOLLOWUP_CREATED"
      should_publish="true"
      should_finalize="true"
      should_run_ci_wait="true"
      should_merge="$(active_should_merge)"
      emit_terminal_state
    output: "terminal_state"

  - id: "strict-terminal-state"
    type: "bash"
    condition: "terminal_gate_mode == 'strict'"
    command: |
      set -euo pipefail
      export GIT_PAGER=cat GH_PAGER=cat PAGER=cat LESS=FRX
      if [ "${TERMINAL_GATE_MODE:-${RECIPE_VAR_terminal_gate_mode:-probe}}" != "strict" ]; then
        exit 0
      fi

      # Canonical resolution ladder (issue #962): the strict terminal gate runs at
      # the very end (post-push), so a genuinely missing helper stays fail-visible
      # (exit 2) — but the ~/.copilot and ~/.amplihack tiers ensure it resolves at
      # the install root even for a gitignored downstream-worktree bundle, so the
      # fatal essentially never fires in a correctly installed amplihack.
      helper="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_final_status.sh"
      [ -f "$helper" ] || helper="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_final_status.sh"
      [ -f "$helper" ] || helper="$(pwd)/amplifier-bundle/tools/workflow_final_status.sh"
      [ -f "$helper" ] || helper="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_final_status.sh"
      [ -f "$helper" ] || helper="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_final_status.sh"
      [ -f "$helper" ] || { echo "ERROR: workflow terminal-state helper not found at any known location (AMPLIHACK_HOME, REPO_PATH, cwd, ~/.copilot, ~/.amplihack); set AMPLIHACK_HOME or run from an amplihack checkout; cwd=$(pwd)" >&2; exit 2; }

      : "${OBSERVED_PHASES:=workflow-prep,workflow-worktree,workflow-design,workflow-tdd,workflow-refactor-review,workflow-precommit-test,workflow-publish,workflow-pr-review,workflow-finalize}"
      export OBSERVED_PHASES
      bash "$helper"
    output: "terminal_state"
