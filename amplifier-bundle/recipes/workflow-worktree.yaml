name: "workflow-worktree"
description: "Phase 1b: worktree / branch setup (step 04)"
version: "1.0.0"
author: "Amplihack Team"
tags: ["development", "prep", "worktree", "git"]

# workflow-worktree: extracted from default-workflow.yaml as a composable phase brick.
#
# Preserves every original step verbatim — the layered review steps the LLM
# converges through must remain intact. Context flows in from the parent
# workflow via recipe-runner's automatic context-merging in
# `_execute_sub_recipe()`; outputs declared by these steps propagate back to
# the parent and are visible to subsequent phase recipes.
# Pager safety: recipe-runner-rs sets GIT_PAGER=cat/PAGER=cat for subprocesses.

recursion:
  max_depth: 6
  max_total_steps: 80

context: {}

steps:
  - id: "step-04-setup-worktree"
    type: "bash"
    command: |
      set -euo pipefail
      # Guard: fail-fast if repo_path does not exist (prevents path traversal, catches misconfiguration).
      if [ ! -d "$REPO_PATH" ]; then
        echo "ERROR: repo_path '$REPO_PATH' does not exist or is not a directory" >&2
        exit 1
      fi
      cd "$REPO_PATH"
      if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "ERROR: step-04-setup-worktree requires a git repo at $(pwd); either \`git init\` or rerun from a checkout" >&2
        exit 1
      fi
      # Canonicalize repo_path so WORKTREE_PATH matches git porcelain (issue #1121).
      REPO_PATH="$(pwd -P)"

      # Canonical 5-tier helper ladder (#829/#840/#962). Lifecycle logic lives in
      # tools/ so this recipe stays < 400 lines; a missing helper is a no-op.
      SWEEP_HELPER="${AMPLIHACK_HOME:-${REPO_PATH:-$(pwd)}}/amplifier-bundle/tools/workflow_worktree_sweep.sh"
      [ -f "$SWEEP_HELPER" ] || SWEEP_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_worktree_sweep.sh"
      [ -f "$SWEEP_HELPER" ] || SWEEP_HELPER="$(pwd)/amplifier-bundle/tools/workflow_worktree_sweep.sh"
      [ -f "$SWEEP_HELPER" ] || SWEEP_HELPER="${HOME:-/root}/.copilot/amplifier-bundle/tools/workflow_worktree_sweep.sh"
      [ -f "$SWEEP_HELPER" ] || SWEEP_HELPER="${HOME:-/root}/.amplihack/amplifier-bundle/tools/workflow_worktree_sweep.sh"
      TOOLS_DIR="$(dirname "$SWEEP_HELPER")"
      # Worktree anchoring (#1134): nested recipe RUNNERS are legitimate, and a
      # nested run's cwd is normally a LINKED worktree (`.git` is a FILE pointing at
      # the main repo), so anchoring `worktrees/<branch>` at `pwd -P` built worktrees
      # INSIDE worktrees without bound. Anchor at the MAIN repository instead.
      ROOT_HELPER="$TOOLS_DIR/workflow_worktree_root.sh"
      MAIN_REPO_PATH="$REPO_PATH"
      if [ -f "$ROOT_HELPER" ]; then bash "$ROOT_HELPER" assert-origin "$REPO_PATH" || exit 1; MAIN_REPO_PATH="$(bash "$ROOT_HELPER" root "$REPO_PATH" || printf '%s' "$REPO_PATH")"; fi
      [ -d "$MAIN_REPO_PATH" ] || MAIN_REPO_PATH="$REPO_PATH"
      [ "$MAIN_REPO_PATH" = "$REPO_PATH" ] || echo "INFO: caller checkout '$REPO_PATH' is a linked worktree — anchoring new worktrees at main repository '$MAIN_REPO_PATH' (issue #1134)." >&2
      # Self-healing orphan sweep (#840): best-effort prune of worktrees/branches
      # leaked by prior FAILED runs so a re-run converges instead of colliding. Never
      # aborts setup. Swept at the MAIN repo, where they now all live (#1134).
      if [ -f "$SWEEP_HELPER" ]; then bash "$SWEEP_HELPER" sweep "$MAIN_REPO_PATH" >&2 || true; fi

      echo "=== Step 4: Creating Worktree and Branch ===" >&2
      echo "" >&2

      json_escape() {
        local s="$1"
        s=${s//\\/\\\\}
        s=${s//\"/\\\"}
        s=${s//$'\b'/\\b}
        s=${s//$'\f'/\\f}
        s=${s//$'\n'/\\n}
        s=${s//$'\r'/\\r}
        s=${s//$'\t'/\\t}
        printf '%s' "$s"
      }

      # wt_add_idempotent MODE WT BRANCH [REF] (issue #1121/#642): prune stale regs,
      # reuse dir if it's a worktree on BRANCH else remove+re-add. No add --force.
      wt_add_idempotent() {
        local mode="$1" wt="$2" branch="$3" ref="${4:-}" cur
        git worktree prune >/dev/null 2>&1 || true
        # INVARIANT (#1134): never create a worktree under another worktree.
        if [ -f "$ROOT_HELPER" ] && ! bash "$ROOT_HELPER" assert-not-nested "$wt" "$MAIN_REPO_PATH"; then exit 1; fi
        if [ -d "$wt" ]; then
          cur="$(git -C "$wt" symbolic-ref --short HEAD 2>/dev/null || true)"
          if [ "$cur" = "$branch" ]; then
            echo "INFO: Reusing existing worktree directory at '$wt' (branch matches)." >&2
            return 0
          fi
          echo "INFO: Removing stale worktree at '$wt' (was '${cur:-none}', need '$branch')." >&2
          git worktree remove --force "$wt" >/dev/null 2>&1 || rm -rf "$wt"
        fi
        case "$mode" in
          attach) git worktree add -- "$wt" "$branch" >&2 ;;
          create) git worktree add -b "$branch" -- "$wt" "$ref" >&2 ;;
          track)  git worktree add --track -b "$branch" -- "$wt" "$ref" >&2 ;;
        esac
      }

      # NEW (#342): Existing-branch / PR targeting path. When EXISTING_BRANCH or
      # PR_NUMBER is set, reuse an existing branch instead of deriving a slug from
      # TASK_DESCRIPTION; EXISTING_BRANCH wins on tie (a WARNING goes to stderr).
      # MIRROR: consensus-issue-worktree.yaml step3-setup-worktree keeps the same gates,
      # but deliberately still gives the #858 refusal where this step uses an alias (#1762).
      EXISTING_BRANCH="${EXISTING_BRANCH:-}"
      PR_NUMBER="${PR_NUMBER:-}"

      # EXPLICIT BRANCH WINS (#1426): a task that names its branch (`Branch: <ref>`)
      # gets that branch, never a prose-derived competitor. Forms and exit codes are
      # documented in tools/workflow_branch_name.sh; a missing helper warns and skips.
      BRANCH_HELPER="$TOOLS_DIR/workflow_branch_name.sh"
      EXPLICIT_BRANCH=""
      if [ -z "$EXISTING_BRANCH" ] && [ -z "$PR_NUMBER" ]; then
        if [ ! -f "$BRANCH_HELPER" ]; then
          echo "WARNING: $BRANCH_HELPER not found — not checking task_description for an explicitly named branch (issue #1426)." >&2
        else
          EXPLICIT_RC=0
          EXPLICIT_BRANCH="$(bash "$BRANCH_HELPER" explicit --repo-path "$REPO_PATH" --main-repo "$MAIN_REPO_PATH")" || EXPLICIT_RC=$?
          case "$EXPLICIT_RC" in
            0) EXISTING_BRANCH="$EXPLICIT_BRANCH" ;;  # named and exists: reuse
            1|10) ;;                                  # none named / named, to create
            *) echo "ERROR: branch detection failed (workflow_branch_name.sh exit $EXPLICIT_RC; see above)." >&2
               exit 1 ;;
          esac
        fi
      fi
      [ -z "$EXPLICIT_BRANCH" ] || echo "INFO: task_description names branch '$EXPLICIT_BRANCH' (issue #1426)." >&2

      if [ -n "$EXISTING_BRANCH" ] || [ -n "$PR_NUMBER" ]; then
        # Precedence: existing_branch wins on tie.
        if [ -n "$EXISTING_BRANCH" ] && [ -n "$PR_NUMBER" ]; then
          echo "WARNING: both 'existing_branch' and 'pr_number' set — using existing_branch ('$EXISTING_BRANCH'), ignoring pr_number ('$PR_NUMBER')." >&2
        fi

        if [ -n "$EXISTING_BRANCH" ]; then
          BRANCH_NAME="$EXISTING_BRANCH"
        else
          # SECURITY: PR_NUMBER must be a positive integer before passing to gh.
          # Rejects arg-injection like '342 --repo evil/x', '-1', or '$(rm)'.
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: pr_number '$PR_NUMBER' is not a valid positive integer (arg-injection guard)." >&2
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: pr_number is set but the 'gh' CLI is not on PATH." >&2
            exit 1
          fi
          # gh stderr suppressed to avoid leaking auth/token diagnostics; we
          # surface a sanitized error instead.
          BRANCH_NAME="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || true)"
          if [ -z "$BRANCH_NAME" ]; then
            echo "ERROR: 'gh pr view $PR_NUMBER' returned no branch name (PR not found, no auth, or gh failure)." >&2
            exit 1
          fi
        fi

        # SECURITY: validate the branch name with the authoritative git ref
        # checker BEFORE using it in any path or git invocation. This rejects
        # '..', a leading '-' and control characters, but not shell metacharacters,
        # so the name is always quoted. Re-applied to gh output as well.
        if ! git check-ref-format --branch "$BRANCH_NAME" >/dev/null 2>&1; then
          echo "ERROR: branch name '$BRANCH_NAME' is invalid (git check-ref-format rejection)." >&2
          exit 1
        fi

        echo "INFO: Targeting existing branch '$BRANCH_NAME' (issue #342 path)." >&2

        # Best-effort fetch so remote-only branches resolve. Explicit refspec
        # creates the local remote-tracking ref. Branch name is validated above.
        git fetch origin "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" >&2 2>/dev/null || true

        # Resolve worktree path: (a) reuse a worktree already on the branch; (b) Gates B/C,
        # the caller checkout: an alias (#1762); (c) else MAIN_REPO_PATH/worktrees/<branch> (#1134).
        WORKTREE_PATH=""; LOCAL_BRANCH=""; CALLER_ON_BRANCH=false
        EXISTING_WT="$(git worktree list --porcelain | awk -v b="refs/heads/$BRANCH_NAME" '
          $1=="worktree" { wt=$2 }
          $1=="branch" && $2==b { print wt; exit }
        ')"
        # #858: the caller checkout is never the task worktree (it may hold another recipe's work).
        REPO_REAL="$(cd "$REPO_PATH" && pwd -P)"
        if [ -n "$EXISTING_WT" ]; then
          # Gate A (#858): the branch's registered worktree path is inaccessible (stale,
          # leaked by a failed run). Refuse and advise `git worktree prune`; never guess.
          if ! EXISTING_WT_REAL="$(cd "$EXISTING_WT" 2>/dev/null && pwd -P)"; then
            echo "ERROR: git reports an existing worktree for branch '$BRANCH_NAME' at '$EXISTING_WT', but that path is not accessible." >&2
            echo "ERROR: run 'git worktree prune' or remove the stale registration before retrying; refusing to guess a fallback worktree (issue #858)." >&2
            exit 1
          fi
          # Gate B: the branch's worktree is the caller checkout. Any other is reused.
          [ "$EXISTING_WT_REAL" != "$REPO_REAL" ] || CALLER_ON_BRANCH=true
          [ "$CALLER_ON_BRANCH" = true ] || { WORKTREE_PATH="$EXISTING_WT"; echo "INFO: Reusing existing worktree at '$WORKTREE_PATH'." >&2; }
        elif [ "$(git symbolic-ref --short HEAD 2>/dev/null || true)" = "$BRANCH_NAME" ]; then
          CALLER_ON_BRANCH=true  # Gate C: the caller checkout's HEAD is the branch.
        else
          WORKTREE_PATH="${MAIN_REPO_PATH}/worktrees/${BRANCH_NAME}"
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            wt_add_idempotent attach "$WORKTREE_PATH" "$BRANCH_NAME"
          elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            wt_add_idempotent track "$WORKTREE_PATH" "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            echo "ERROR: branch '$BRANCH_NAME' not found locally or on origin." >&2
            exit 1
          fi
        fi
        # Gates B/C (#1762): the planner checks the caller holds nothing the task worktree
        # would miss and picks <branch>--wt-<n>. Default branch or no planner: #858 refusal.
        if [ "$CALLER_ON_BRANCH" = true ]; then
          ALIAS_HELPER="$TOOLS_DIR/workflow_caller_branch_alias.sh"; ALIAS_RC=0
          if [ -f "$ALIAS_HELPER" ]; then LOCAL_BRANCH="$(bash "$ALIAS_HELPER" "$REPO_REAL" "$MAIN_REPO_PATH" "$BRANCH_NAME")" || ALIAS_RC=$?
          else echo "WARNING: $ALIAS_HELPER not found; cannot create an alias worktree for '$BRANCH_NAME' (issue #1762)." >&2; ALIAS_RC=3; fi
          if [ "$ALIAS_RC" -eq 3 ]; then
            echo "ERROR: existing branch '$BRANCH_NAME' is checked out in the caller repository — refusing to use the caller checkout as a recipe task worktree (issue #858)." >&2
            echo "ERROR: run the recipe from a clean base checkout or detach/switch the caller checkout before targeting this branch." >&2
            exit 1
          fi
          [ "$ALIAS_RC" -eq 0 ] && [ "${LOCAL_BRANCH#"$BRANCH_NAME--wt-"}" != "$LOCAL_BRANCH" ] && git check-ref-format --branch "$LOCAL_BRANCH" >/dev/null 2>&1 \
            || { echo "ERROR: cannot set up an alias worktree for '$BRANCH_NAME' (planner exit $ALIAS_RC; issue #1762)." >&2; exit 1; }
          WORKTREE_PATH="${MAIN_REPO_PATH}/worktrees/${LOCAL_BRANCH}"
          # Reuse only an alias already checked out at its path; otherwise another run is creating it, so stop. A create is `worktree add -b`, so a concurrent create fails and removes nothing.
          if git show-ref --verify --quiet "refs/heads/$LOCAL_BRANCH"; then [ "$(git -C "$WORKTREE_PATH" symbolic-ref -q --short HEAD 2>/dev/null)" = "$LOCAL_BRANCH" ] || { echo "ERROR: alias '$LOCAL_BRANCH' exists but is not checked out at $WORKTREE_PATH; another run may be creating it. Wait for that run to finish, then re-run (issue #1762)." >&2; exit 1; }; echo "INFO: Reusing existing worktree directory at '$WORKTREE_PATH' (branch matches)." >&2
          elif [ -f "$ROOT_HELPER" ] && ! bash "$ROOT_HELPER" assert-not-nested "$WORKTREE_PATH" "$MAIN_REPO_PATH"; then exit 1
          else git worktree add --track -b "$LOCAL_BRANCH" -- "$WORKTREE_PATH" "origin/$BRANCH_NAME" >&2; fi
        fi

        # `created=false`: the branch pre-existed (its worktree may still be new).
        CREATED=false

        # Push/upstream best-effort (idempotent on existing PR branches); never for an alias.
        [ -n "$LOCAL_BRANCH" ] || git -C "$WORKTREE_PATH" push origin "$BRANCH_NAME" > /dev/null 2>&1 || true
        [ -n "$LOCAL_BRANCH" ] || git -C "$WORKTREE_PATH" branch --set-upstream-to="origin/${BRANCH_NAME}" "$BRANCH_NAME" > /dev/null 2>&1 || true

        echo "" >&2
        echo "=== Worktree Setup Complete (existing-branch path) ===" >&2

        # Stdout is reserved for the JSON contract. printf (not heredoc): a heredoc
        # terminator must sit at column 0 once YAML strips the block indent.
        # Consumers accept worktree_setup.worktree_path only as an already-resolved
        # worktree root (#1561 V4), so emit the physical path.
        WORKTREE_PATH="$(cd -P -- "$WORKTREE_PATH" && pwd -P)" || { echo "ERROR: cannot resolve the worktree path to a physical directory (#1561)" >&2; exit 1; }
        LB_JSON=""; [ -z "$LOCAL_BRANCH" ] || LB_JSON=", \"local_branch_reason\": \"branch_name is checked out in the caller repository (issue #1762)\", \"local_branch\": \"$(json_escape "$LOCAL_BRANCH")\""  # the runner drops a passing step's stderr, so the reason is in the output too
        printf '{"worktree_path": "%s", "branch_name": "%s", "base_ref": "", "base_branch": "", "created": %s%s}\n' \
          "$(json_escape "$WORKTREE_PATH")" "$(json_escape "$BRANCH_NAME")" "$CREATED" "$LB_JSON"
        exit 0
      fi

      # Fetch latest refs and resolve the base branch without assuming origin/main.
      # A task worktree branches off a fetched remote ref, never the caller's HEAD (#858).
      for FETCH_TRY in 1 2 3; do
        git fetch origin --no-tags >&2 && break
        echo "WARNING: git fetch origin failed (attempt ${FETCH_TRY}/3); after the last attempt, continuing with local refs." >&2
        [ "$FETCH_TRY" -eq 3 ] || sleep "$FETCH_TRY"
      done
      resolve_base_ref() {
        local ref
        ref="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        if [ -z "$ref" ] || ! git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
          git remote set-head origin -a >/dev/null 2>&1 || true
          ref="$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || true)"
        fi
        for ref in $ref origin/master origin/develop; do
          if git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
            printf '%s\n' "$ref"
            return 0
          fi
        done
        echo "ERROR: no supported remote base ref found. Expected origin/HEAD, origin/master, or origin/develop." >&2
        return 1
      }
      BASE_REF="$(resolve_base_ref)" || exit 1
      BASE_BRANCH="${BASE_REF#origin/}"

      # BRANCH NAMING (#1426): the explicit branch, else <prefix>/issue-<N>-<tail>.
      # Derived INLINE, never in a bundle helper: re-runs depend on the name (#1121).
      # Tail rules (whole words, <=24 chars, no paths or blobs, task hash if empty) and
      # rationale: docs/features/branch-name-generation.md. SLUG_NUM reaches sed, so it
      # is forced numeric (#815). consensus-issue-worktree.yaml still differs (#1430).
      SLUG_NUM="${ISSUE_NUMBER:-0}"
      case "$SLUG_NUM" in ''|*[!0-9]*) SLUG_NUM=0 ;; esac
      SLUG_HEAD="${TASK_DESCRIPTION:-}"
      SLUG_WORDS="$(printf '%s' "${SLUG_HEAD:0:65536}" | tr '[:upper:]' '[:lower:]' \
        | sed -e 's#[^[:space:]]*[/\\@][^[:space:]]*# #g' -e 's/[^a-z0-9]\{1,\}/-/g' \
        | tr '\n\r' '--' | sed -e 's/-\{2,\}/-/g' -e 's/^-*//;s/-*$//' \
        | sed -E "s/^(issues?-)?(${SLUG_NUM})-//")"
      TASK_SLUG=""
      SLUG_OIFS="$IFS"
      IFS='-'
      for SLUG_W in $SLUG_WORDS; do
        [ -n "$SLUG_W" ] && [ ${#SLUG_W} -le 20 ] || continue
        SLUG_N="${TASK_SLUG:+$TASK_SLUG-}$SLUG_W"
        [ ${#SLUG_N} -le 24 ] || break
        TASK_SLUG="$SLUG_N"
      done
      IFS="$SLUG_OIFS"
      if [ -z "$TASK_SLUG" ]; then
        TASK_SLUG="$(printf '%s' "${TASK_DESCRIPTION:-}" | cksum | cut -d' ' -f1)"
      fi
      # The last-resort name hardcodes 'feat/' so a bad branch_prefix cannot inject (#3023).
      BRANCH_NAME="${EXPLICIT_BRANCH:-${BRANCH_PREFIX:-feat}/issue-${ISSUE_NUMBER:-0}-${TASK_SLUG}}"
      if ! git check-ref-format --branch "${BRANCH_NAME}" >/dev/null 2>&1; then
        echo "WARNING: derived branch name '${BRANCH_NAME}' is invalid — falling back to task-unnamed" >&2
        BRANCH_NAME="feat/task-unnamed-$(date +%s)"
      fi
      WORKTREE_PATH="${MAIN_REPO_PATH}/worktrees/${BRANCH_NAME}"
      # --- Deconfliction (#829/#840, #1565): a NEW free name if BRANCH_NAME is held by a
      # FOREIGN worktree or holds work (dirty, or ahead of BASE_REF); else unchanged.
      DECONFLICT_HELPER="$TOOLS_DIR/workflow_worktree_deconflict.sh"
      [ -f "$DECONFLICT_HELPER" ] || DECONFLICT_HELPER="${REPO_PATH:-$(pwd)}/amplifier-bundle/tools/workflow_worktree_deconflict.sh"
      if [ -f "$DECONFLICT_HELPER" ]; then
        # Fail loud on non-zero exit (retries exhausted / misconfig / old helper without
        # --base); never reuse a conflicting name (#200 S1/S2). V1: validate the output.
        if ! RESOLVED_BRANCH="$(bash "$DECONFLICT_HELPER" resolve --base "$BASE_REF" "$BRANCH_NAME" "$WORKTREE_PATH" "$MAIN_REPO_PATH")"; then
          echo "ERROR: worktree branch deconfliction failed for '${BRANCH_NAME}' (retries exhausted or helper misconfig; see stderr). Aborting to avoid clobbering a concurrent foreign worktree." >&2
          exit 1
        fi
        git check-ref-format --branch "$RESOLVED_BRANCH" >/dev/null 2>&1 || { echo "ERROR: deconflict helper returned an invalid branch name" >&2; exit 1; }
        if [ "$RESOLVED_BRANCH" != "$BRANCH_NAME" ]; then
          echo "INFO: using branch '${RESOLVED_BRANCH}' instead of '${BRANCH_NAME}'." >&2
          BRANCH_NAME="$RESOLVED_BRANCH"
          WORKTREE_PATH="${MAIN_REPO_PATH}/worktrees/${BRANCH_NAME}"
        fi
      fi

      printf 'Branch: %s\nWorktree: %s\nBase ref: %s\n\n' "${BRANCH_NAME}" "${WORKTREE_PATH}" "${BASE_REF}" >&2

      # --- Idempotency: detect existing branch and/or worktree ---
      # FIX (issue #3023 / BL-002): Three-state guard makes re-runs safe. State 1:
      # branch + worktree both exist → reuse; State 2: branch only → add; State 3:
      # neither → create. grep -Fx: literal exact match against git's absolute
      # porcelain output (#1121); every add routes through wt_add_idempotent.
      # #1565: work (dirty, or ahead of BASE_REF) is never reset or deleted; the helper
      # moved this run off such a branch. If work still shows up here (helper missing,
      # or new work since), fail loud; never silently reuse stale state either (#200).
      refuse_reset() {
        echo "ERROR: refusing to reset existing_branch=${BRANCH_NAME} at ${WORKTREE_PATH} (uncommitted/untracked changes: $1, commits ahead of ${BASE_REF}: ${KEPT_AHEAD}). Re-run with existing_branch=${BRANCH_NAME} to continue it, or move the work aside." >&2
        exit 1
      }
      BRANCH_EXISTS=$(git branch --list "${BRANCH_NAME}")
      WORKTREE_EXISTS=$(git worktree list --porcelain | grep -Fx "worktree ${WORKTREE_PATH}" || true)
      KEPT_AHEAD=$(git rev-list --count "${BASE_REF}..refs/heads/${BRANCH_NAME}" 2>/dev/null || echo 1)
      case "$KEPT_AHEAD" in ''|*[!0-9]*) KEPT_AHEAD=1 ;; esac

      if [ -n "$BRANCH_EXISTS" ] && [ -n "$WORKTREE_EXISTS" ]; then
        KEPT_DIRTY=$(git --no-optional-locks -C "${WORKTREE_PATH}" status --porcelain 2>/dev/null || echo unknown)
        [ -z "$KEPT_DIRTY" ] || refuse_reset yes
        [ "$KEPT_AHEAD" -eq 0 ] || refuse_reset no
        echo "INFO: Branch '${BRANCH_NAME}' and worktree '${WORKTREE_PATH}' already exist and are clean — reusing." >&2
        CREATED=false
      elif [ -n "$BRANCH_EXISTS" ]; then
        [ "$KEPT_AHEAD" -eq 0 ] || refuse_reset no
        echo "INFO: Branch '${BRANCH_NAME}' exists (clean) but worktree is missing — adding worktree without -b." >&2
        wt_add_idempotent attach "${WORKTREE_PATH}" "${BRANCH_NAME}"
        CREATED=true
      else
        echo "INFO: Creating new branch and worktree." >&2
        wt_add_idempotent create "${WORKTREE_PATH}" "${BRANCH_NAME}" "${BASE_REF}"
        CREATED=true
      fi

      # Push branch to remote with tracking (idempotent). Push failures are
      # suppressed here and surface at step-16 PR creation, so re-runs converge.
      git -C "${WORKTREE_PATH}" push origin "${BRANCH_NAME}" > /dev/null 2>&1 || true
      git -C "${WORKTREE_PATH}" branch --set-upstream-to="origin/${BRANCH_NAME}" "${BRANCH_NAME}" > /dev/null 2>&1 || true

      if [ -z "${AMPLIHACK_RUNTIME_ROOT:-}" ]; then
        if [ -n "${XDG_RUNTIME_DIR:-}" ]; then
          AMPLIHACK_RUNTIME_ROOT="${XDG_RUNTIME_DIR}/amplihack-runtime/${BRANCH_NAME}"
        else
          AMPLIHACK_RUNTIME_ROOT="/tmp/amplihack-runtime/${BRANCH_NAME}"
        fi
        export AMPLIHACK_RUNTIME_ROOT
      fi
      mkdir -p \
        "${AMPLIHACK_RUNTIME_ROOT}/locks" \
        "${AMPLIHACK_RUNTIME_ROOT}/reflection" \
        "${AMPLIHACK_RUNTIME_ROOT}/logs" \
        "${AMPLIHACK_RUNTIME_ROOT}/metrics" \
        "${AMPLIHACK_RUNTIME_ROOT}/provenance"

      echo "" >&2
      echo "=== Worktree Setup Complete ===" >&2

      # Output structured JSON for subsequent steps.
      # created=false signals that an existing worktree was reused (diagnostic for re-runs).
      # Consumers accept worktree_setup.worktree_path only as an already-resolved
      # worktree root (#1561 V4), so emit the physical path.
      WORKTREE_PATH="$(cd -P -- "$WORKTREE_PATH" && pwd -P)" || { echo "ERROR: cannot resolve the worktree path to a physical directory (#1561)" >&2; exit 1; }
      printf '{"worktree_path": "%s", "branch_name": "%s", "base_ref": "%s", "base_branch": "%s", "runtime_root": "%s", "created": %s}\n' \
        "$(json_escape "$WORKTREE_PATH")" \
        "$(json_escape "$BRANCH_NAME")" \
        "$(json_escape "$BASE_REF")" \
        "$(json_escape "$BASE_BRANCH")" \
        "$(json_escape "$AMPLIHACK_RUNTIME_ROOT")" \
        "$CREATED"
    output: "worktree_setup"
    parse_json: true

  # ==========================================================================
  # STEP 5: RESEARCH AND DESIGN
  # ==========================================================================
