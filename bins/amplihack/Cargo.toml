[package]
name = "amplihack"
description = "CLI binary for amplihack"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "amplihack"
# Every tests/*.rs file is a module of the one `amplihack_bin` target below.
autotests = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "amplihack"
path = "src/main.rs"

[dependencies]
amplihack-types = { workspace = true }
amplihack-state = { workspace = true }
amplihack-hooks = { workspace = true }
amplihack-cli = { workspace = true, features = ["signal"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
amplihack-git = { workspace = true }
# Issue #1525: the detached-launch hand-off test strips every entry of
# `agent_binary::SESSION_MARKERS`, the one canonical list, rather than a copy.
amplihack-utils = { workspace = true }
# Issues #538 / #1378: the install-completeness and update-prompt integration
# tests live in THIS package so `env!("CARGO_BIN_EXE_amplihack")` resolves and
# Cargo builds the binary as a test prerequisite. They previously sat in
# `crates/amplihack-cli/tests/`, where that env var does not exist, and had to
# hand-roll `<workspace>/target/debug/amplihack` — wrong under any redirected
# CARGO_TARGET_DIR (the pre-commit hooks redirect it).
assert_cmd = "2"
# Issue #625: PTY-driven integration test for the interactive update prompt.
# Linux-only at use site (gated `#[cfg(target_os = "linux")]`); listing here
# unconditionally is fine because rexpect itself compiles on macOS too — we
# only gate the test that drives a pseudo-TTY.
rexpect = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
shell-words = { workspace = true }
base64 = "0.22"
# Integration test tests/integration/lbug_ffi_test.rs reaches into
# `amplihack_cli::memory::ffi_test_support`, which is gated behind the
# `test-support` feature. Enable it for tests only (resolver 2 keeps it out of
# the release binary above).
amplihack-cli = { workspace = true, features = ["test-support"] }

# This package's tests/integration/*.rs files are modules of ONE test binary,
# rooted at tests/integration/main.rs (hook_dispatch_test.rs, hook_aliases_test.rs
# and lbug_ffi_test.rs belong to amplihack-hooks and amplihack-cli). One binary instead of 74 cuts link work in the
# CI Test job (sccache cannot cache test binaries). Add new integration test
# files as `mod` lines in main.rs, not as new [[test]] entries here.
# Run one former target with:
#   cargo test -p amplihack --test integration <module_name>::
[[test]]
name = "integration"
path = "../../tests/integration/main.rs"

# This package's own tests/*.rs files are modules of ONE more test binary,
# rooted at tests/main.rs (`autotests = false` above stops Cargo from also
# building each file as its own target). Add new files as `mod` lines in
# tests/main.rs, not as new [[test]] entries here.
# Run one former target with:
#   cargo test -p amplihack --test amplihack_bin <module_name>::
[[test]]
name = "amplihack_bin"
path = "tests/main.rs"
