# canonicalised temp root unless the case sets raw_path = true.

[[case]]
name = "git_dir_selector_refused"
argv = ["publish"]
env = { GIT_DIR = "@ROOT@/a/.git" }
setup = "none"
expect_status = 2
expect_stdout = ""
expect_stderr = "checkpoint scope refusal: unsupported inherited Git selector\n"
