[package]
name = "amplihack-git"
description = "Git subprocesses that ignore the caller's inherited git environment"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Async twins of `command`/`command_in` for callers already inside a tokio
# runtime (amplihack-remote). Off by default so sync-only crates do not pull
# tokio in just to spawn git.
tokio = ["dep:tokio"]

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
amplihack-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
fs2 = "0.4"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process"], optional = true }
