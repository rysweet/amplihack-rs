[package]
name = "amplihack-hooks"
description = "Hook implementations for amplihack (pre_tool_use, stop, session_start, etc.)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amplihack-git = { workspace = true }
amplihack-types = { workspace = true }
amplihack-state = { workspace = true }
amplihack-memory = { workspace = true }
amplihack-security = { workspace = true }
amplihack-workflows = { workspace = true }
amplihack-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
shell-words = { workspace = true }
regex = "1"
sha2 = { workspace = true }
amplihack-signal = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }

[features]
# Off by default: pulls in the Signal onboarding integration (and its config
# crate) only when explicitly enabled. With the feature off there is zero cost.
default = []
signal = ["dep:amplihack-signal", "amplihack-signal/signal", "dep:libc"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

[[test]]
name = "golden"
path = "../../tests/golden/run_golden.rs"
