[package]
name = "amplihack-signal"
description = "Feature-gated, per-session Signal messaging channel for amplihack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default OFF: with the feature off the entire crate compiles to an empty
# lib, pulls in no tokio-net stack, and costs nothing at runtime.
default = []
# Enables the whole channel (pure core + gated tokio TCP transport).
signal = ["dep:tokio", "dep:tokio-stream", "dep:regex", "dep:amplihack-turn", "dep:async-trait"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
regex = { version = "1", optional = true }
amplihack-types = { workspace = true }
amplihack-turn = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "net",
    "io-util",
    "rt",
    "macros",
    "time",
    "sync",
    "process",
] }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = [
    "rt",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "process",
] }

# Fixture-driven envelope tests (pure wire parsing, no I/O).
[[test]]
name = "envelope_fixtures"
path = "tests/envelope_fixtures.rs"

# `/signal` topic chat contract tests (feature-gated).
[[test]]
name = "chat_it"
path = "tests/chat_it.rs"

# `SignalChannel` (amplihack_turn::Channel) contract tests (feature-gated, PR-3).
[[test]]
name = "signal_channel_it"
path = "tests/signal_channel_it.rs"
