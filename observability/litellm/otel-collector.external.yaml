receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  otlphttp/external:
    endpoint: ${env:AMPLIHACK_EXTERNAL_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:AMPLIHACK_EXTERNAL_OTLP_AUTHORIZATION}

processors:
  attributes/redact:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.request.messages, action: delete}
      - {key: gen_ai.response.content, action: delete}
      - {key: llm.prompts, action: delete}
      - {key: llm.completions, action: delete}
      - {key: input.value, action: delete}
      - {key: output.value, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: authorization, action: delete}
      - {key: api_key, action: delete}
  batch: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [otlphttp/external]
    metrics:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [prometheus, otlphttp/external]
