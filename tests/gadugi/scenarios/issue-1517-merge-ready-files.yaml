name: issue-1517-merge-ready-files
description: >
  Regression scenario for amplihack issue #1517 and the PR #1520 review. The
  merge round used to invoke the merge-ready skill, which refuses agents
  (disable-model-invocation: true), so every round failed the same way. It now
  reads the skill's SKILL.md and template, found by the SHIPPED
  amplifier-bundle/tools/autodrive_merge_ready_files.sh. This scenario (via
  tests/gadugi/run-autodrive-merge-ready-files-scenario.sh) asserts that the
  lookup takes both files from one install and fails by name when they are
  missing, and that the shipped step-00 body resolves the files with
  gadugi-test on PATH and without it, in a Node and a Rust CLI repository.
  A missing gadugi-test does not stop step-00; the QA agent handles recovery
  from a missing tool.
version: "1.0"
config:
  timeout: 60000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, regression, qa-team, auto-drive, merge-ready]
  priority: high
  issues: ["1517"]
  pr: "1520"
steps:
  - name: run-merge-ready-files-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-autodrive-merge-ready-files-scenario.sh
    timeout: 50000
  - name: all-merge-ready-files-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
  - name: merge-ready-files-summary
    agent: cli-agent
    action: validate_output
    params:
      expected: "contains:merge-ready read from its files; step-00 resolves them with or without gadugi-test"
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: files-resolved
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_ready_files_resolved"
  - name: template-never-mixed
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_ready_template_never_mixed"
  - name: missing-install-named
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_ready_missing_install_named"
  - name: step00-resolves
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_round_step00_resolves"
  - name: step00-leaves-tool-recovery-to-agent
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_round_step00_leaves_tool_recovery_to_agent"
  - name: rust-step00-needs-no-gadugi
    type: output_contains
    params:
      target: stdout
      expected: "PASS: merge_round_step00_rust_needs_no_gadugi"
