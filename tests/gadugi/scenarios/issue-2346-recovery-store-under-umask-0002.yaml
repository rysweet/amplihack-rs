name: issue-2346-recovery-store-under-umask-0002
description: >
  Outside-in QA for issue #2346. Under umask 0002, `amplihack recipe run`
  created ~/.amplihack group-writable itself, and the recipe runner's
  recovery store then stopped the run with `unsafe recovery ancestor`,
  naming neither the folder nor the mode bit. The scenario (via
  tests/gadugi/run-issue-2346-umask-recovery-scenario.sh) runs a one-step
  bash recipe through the real binary and the pinned recipe-runner-rs under
  umask 0002, each case in a fresh HOME under one scratch folder, under env -i.
  It checks that a run in a fresh 0750 HOME starts and succeeds with
  ~/.amplihack at 700 and everything under the work root at 700 or 600; that
  a 0775 folder made by hand above the work root stops the run with the
  folder, group-writable, 0775 and `chmod g-w <folder>` named on stderr and
  the work root not created; and that an owned 0755 work root is set to 0700
  with a notice. No agent CLI is started. CI's Install Smoke Test job runs the
  driver script directly against the binary it installs; CI does not run
  gadugi-test, so this file is for running the same cases through gadugi-test
  by hand.
version: "1.0"
config:
  timeout: 900000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, qa-team, recipe, recovery, umask, regression]
  priority: high
  issues: ["2346"]
steps:
  - name: run-issue-2346-umask-recovery-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-issue-2346-umask-recovery-scenario.sh
    timeout: 880000
  - name: all-umask-recovery-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: recipe-run-starts-under-umask-0002
    type: output_contains
    params:
      target: stdout
      expected: "PASS: recipe_run_starts_under_umask_0002 - "
  - name: group-writable-ancestor-is-named
    type: output_contains
    params:
      target: stdout
      expected: "PASS: group_writable_ancestor_is_named - "
  - name: owned-0755-work-root-set-to-0700
    type: output_contains
    params:
      target: stdout
      expected: "PASS: owned_0755_work_root_set_to_0700 - "
