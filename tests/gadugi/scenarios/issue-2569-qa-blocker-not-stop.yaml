name: issue-2569-qa-blocker-not-stop
description: >
  Outside-in QA for issue #2569, merge-ready criterion 1 as a recorded
  judgement. The scenario (via
  tests/gadugi/run-issue-2569-qa-blocker-not-stop-scenario.sh) runs the
  shipped `autodrive-merge-evidence` recipe with the real binary and the pinned
  recipe runner against scratch Git repositories, with `gh`, `claude` and `npm`
  as stand-ins on a private PATH that holds no `gadugi-test`. Case A: a Node
  repository with no scenario directory records a named blocker, never a pass.
  Case B, in three legs: the change set is measured against the base the round
  observed for this PR; where no round passed one down, no base and no change
  set are recorded and none is guessed; and a base that names no branch of the
  clone reaches no shell and measures nothing. Case C: a scenario
  directory the operator named that does not exist is the recorded state
  `operator-missing`, whatever bytes its name holds, and the record stays one
  clean JSON line. In every run the round ends normally: exit status 0, all
  three agent steps called, the evidence folder 0700 and the record 0600. The
  stand-in `gh` exits 96 on all but one read-only form, and the measurement
  asks it nothing; the
  stand-in agent records one line for each call and never the prompt.
  Everything runs under `env -i` with a 0700 root, so the real ~/.claude and
  ~/.amplihack are never read or written and no token or key of the caller
  reaches a command. CI's Install Smoke Test job runs the driver script
  directly against the binary it installs; CI does not run gadugi-test, so this
  file is for running the same cases through gadugi-test by hand. It is not run
  on a shared host: run the static checks and read the CI result instead.
version: "1.0"
environment:
  requires: [amplihack, recipe-runner-rs, git, jq]
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, qa-team, auto-drive, criterion-1, regression]
  priority: high
  issues: ["2569"]
steps:
  - name: run-issue-2569-qa-blocker-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-issue-2569-qa-blocker-not-stop-scenario.sh
  - name: all-qa-blocker-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
# One assertion per PASS line the script emits, so the descriptor states the
# scenario in full rather than a subset of it. A line added to the script
# without an entry here leaves the descriptor understating what runs.
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: set-up-paths
    type: output_contains
    params:
      target: stdout
      expected: "PASS: set-up paths - "
