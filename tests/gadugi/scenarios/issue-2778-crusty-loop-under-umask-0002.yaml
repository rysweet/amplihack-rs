name: issue-2778-crusty-loop-under-umask-0002
description: >
  Outside-in QA for issue #2778. Under umask 0002, `amplihack internal
  review-allocate` made the crusty loop's review folder in the state folder
  group-writable, and autodrive_loop.sh's first act, the trust scan in
  autodrive_state.sh, moved it aside into untrusted-*, so the review checkout
  disappeared and the round failed. The scenario (via
  tests/gadugi/run-issue-2778-umask-crusty-scenario.sh) runs the sequence of
  step-02-crusty-loop of autodrive-crusty-loop.yaml under umask 0002, against
  a scratch git repository and state folder, under env -i with a fresh HOME.
  The real binary allocates and releases the review checkout and runs the
  completion helpers; the shipped autodrive_loop.sh, trust scan and round
  tools run unchanged. Stand-ins replace only the recipe runner, the agents
  and gh, and no agent or GitHub call is made. It checks that the allocated
  folder is mode 700, that nothing is set aside, that the round finds its
  review checkout, and that the loop completes the round. CI's Install Smoke
  Test job runs the driver script directly against the binary it installs;
  CI does not run gadugi-test, so this file is for running the same cases
  through gadugi-test by hand.
version: "1.0"
config:
  timeout: 900000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, qa-team, auto-drive, crusty, umask, regression]
  priority: high
  issues: ["2778"]
steps:
  - name: run-issue-2778-umask-crusty-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-issue-2778-umask-crusty-scenario.sh
    timeout: 880000
  - name: all-umask-crusty-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: allocated-review-folder-is-private
    type: output_contains
    params:
      target: stdout
      expected: "PASS: allocated_review_folder_is_0700 - "
  - name: nothing-set-aside
    type: output_contains
    params:
      target: stdout
      expected: "PASS: no_entry_set_aside - "
  - name: round-saw-its-review-checkout
    type: output_contains
    params:
      target: stdout
      expected: "PASS: round_saw_review_checkout - "
  - name: loop-completed-the-round
    type: output_contains
    params:
      target: stdout
      expected: "PASS: loop_completed_the_round - "
  - name: no-agent-or-unexpected-call
    type: output_contains
    params:
      target: stdout
      expected: "PASS: no_agent_or_unexpected_call - "
