name: issue-2785-usage-limit-keeps-work
description: >
  CI-only outside-in QA for issue #2785 using the installed CLI and pinned
  recipe runner under a temporary HOME and work root. A recipe commits under
  runtime storage and ends through production usage-limit finalization. The
  same recipe relaunches with compatible inputs and work identity. It must
  restore the repository path and commit outputs, identify the immediate
  predecessor, reuse the completed steps, and execute a continuation that
  reads the retained commit and file contents. A pushed, clean counterpart
  removes its runtime folder. Missing prerequisites fail. CI's Install Smoke
  Test job already runs the driver; this file describes it for gadugi-test.
  Execute only in CI, never on a development host. The historical deletion
  path remains unverified; CI results provide evidence for the tested build.
version: "1.0"
config:
  timeout: 900000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, qa-team, cleanup, usage-limit, recipe-run, regression]
  priority: high
  issues: ["2785"]
steps:
  - name: run-issue-2785-usage-limit-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-issue-2785-usage-limit-keeps-work-scenario.sh
    timeout: 880000
  - name: all-usage-limit-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: unpushed-run-classified-usage-limit
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: classified usage_limit and stopped"
  - name: commit-on-disk-after-the-stop
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: after the stop the commit is on disk in "
  - name: runner-says-the-folder-is-kept
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: the runner said the runtime folder is kept, and why"
  - name: continuation-recovers-the-interrupted-predecessor
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: continuation recovered the immediate usage-limit predecessor"
  - name: completed-commit-step-is-reused
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: continuation reused the completed commit step"
  - name: continuation-reads-retained-work
    type: output_contains
    params:
      target: stdout
      expected: "PASS: unpushed: executed continuation read the original commit and retained contents"
  - name: pushed-folder-is-removed
    type: output_contains
    params:
      target: stdout
      expected: "PASS: pushed: the runtime folder is removed once its work is on the remote"
