name: issue-2857-wait-wakes-on-room
description: >
  Outside-in QA for issue #2857. On a shared-login host the rotator swaps
  logins into ~/.claude and each swap woke every waiting run, including onto a
  login at 98-100% session; the retry's first call returned a 429 and the run
  ended indeterminate. The scenario (via
  tests/gadugi/run-issue-2857-wait-wakes-on-room-scenario.sh) drives the real
  binary's supervised launch against a stub agent and a stub rotate ledger.
  Case A: a limit on the retry a wait earned is waited for again, and the
  third attempt succeeds instead of the step ending `already_waited`. Each
  wait announces itself as `waiting_for_capacity reason=passed_reset ...
  until=none`, because a reset the clock has already passed is a wait for
  capacity with no deadline (issue #2911); the scenario ends each one with a
  login change in the step's config directory at its first progress line, a
  minute in, when the stub has still run only once. The first wait's login
  change said the retry would work, so the second wait writes one `reentered`
  line. No `failed` or `skipped` line is written at all, because a limit may
  now only delay a step and never end it.
  Case B: a wait on a $HOME/.claude step ends `login changed` on a swap only
  when the rotator's last cycle records `live_room: true`; a swap onto a login
  with no room, a ledger from a rotator that records no room bit, and the
  record a stopping rotator leaves are all held back. A person's own `profile
  switch` records no room bit and still wakes the wait unless it says
  `live_room: false`. A held-back wait is still waiting at its first progress
  line; the scenario then writes the record a rotator writes when it
  measures room, and the wait ends `rotator capacity`. The limit states a
  reset five minutes in the past. Each wait the scenario ends lasts about a
  minute, and the step timeout plays no part (issue #3037), so the scenario
  takes about six minutes. No debug-only clock seam is needed.
  Everything runs under `env -i` with a scratch HOME,
  so the real ~/.claude and ~/.amplihack are never read or written, and no
  agent, account, rotator or network call is made. CI's Install Smoke Test job
  runs the driver script directly against the binary it installs; CI does not
  run gadugi-test, so this file is for running the same cases through
  gadugi-test by hand. It is not run on a developer host as part of the change
  that adds it.
version: "1.0"
config:
  timeout: 600000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags: [cli, qa-team, usage-limit, rotator, regression]
  priority: high
  issues: ["2857"]
steps:
  - name: run-issue-2857-wait-wakes-on-room-cases
    agent: cli-agent
    action: execute
    params:
      command: tests/gadugi/run-issue-2857-wait-wakes-on-room-scenario.sh
    timeout: 580000
  - name: all-wait-wakes-on-room-cases-pass
    agent: cli-agent
    action: validate_exit_code
    params:
      expected: 0
assertions:
  - name: all-cases-passed
    type: output_contains
    params:
      target: stdout
      expected: ALL_CASES_PASSED
  - name: limit-after-a-wait-does-not-end-the-step
    type: output_contains
    params:
      target: stdout
      expected: "PASS: limit_after_a_wait_does_not_end_the_step - "
  - name: second-wait-started-not-refused
    type: output_contains
    params:
      target: stdout
      expected: "PASS: second_wait_started_not_refused - "
  - name: no-timer-ends-a-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: no_timer_ends_a_wait - "
  - name: a-contradicted-wake-is-reported-once
    type: output_contains
    params:
      target: stdout
      expected: "PASS: a_contradicted_wake_is_reported_once - "
  - name: each-wait-says-it-is-waiting-for-capacity
    type: output_contains
    params:
      target: stdout
      expected: "PASS: each_wait_says_it_is_waiting_for_capacity - "
  - name: no-limit-ended-the-step
    type: output_contains
    params:
      target: stdout
      expected: "PASS: no_limit_ended_the_step - "
  - name: swap-onto-a-login-with-room-wakes-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: swap_onto_a_login_with_room_wakes_the_wait - "
  - name: swap-onto-a-full-login-does-not-wake-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: swap_onto_a_full_login_does_not_wake_the_wait - "
  - name: swap-recorded-by-an-older-rotator-does-not-wake-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: swap_recorded_by_an_older_rotator_does_not_wake_the_wait - "
  - name: a-stopping-rotators-record-does-not-wake-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: a_stopping_rotators_record_does_not_wake_the_wait - "
  - name: a-manual-switch-without-a-room-reading-wakes-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: a_manual_switch_without_a_room_reading_wakes_the_wait - "
  - name: a-manual-switch-that-recorded-no-room-does-not-wake-the-wait
    type: output_contains
    params:
      target: stdout
      expected: "PASS: a_manual_switch_that_recorded_no_room_does_not_wake_the_wait - "
