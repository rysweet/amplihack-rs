name: claude-profile-rotate-room
description: >
  Isolated CLI acceptance test for the rotator's choice of target (issue #2910).
  Runs the candidate amplihack binary against a temporary HOME, a fake Claude
  executable and a loopback stand-in for the usage and profile endpoints
  (socat, 127.0.0.1 only), replaying 22 November 2026: the live login reached
  100% of its session while several logins had room, alone in its organisation.
  Seven cases: a dry run that reports the swap to the login with a fresh session;
  a one-shot cycle that moves ~/.claude to it with reason=plan-room and no ALERT;
  HTTP 429 from the usage endpoint with a last good reading in the history,
  which gives an unconfirmed (HTTP 429) swap; HTTP 429 with no history, which
  gives one "no capacity known" ALERT and moves nothing; HTTP 429 with a
  target whose identity read returns another account, which moves nothing;
  a dry run at the 05:48Z readings, where the live login still has room and
  nothing it may move to qualifies, which says it would stay, with the note;
  and the stand-in's own guards, where a bad bearer token, a missing one and
  an oversized request line are refused and serve no fixture.
  Needs socat; runs locally and is not part of CI.
version: "1.0"
environment:
  requires: [AMPLIHACK_QA_BINARY]
agents:
  - name: cli-agent
    type: cli
steps:
  - name: exercise-rotator-target-choice
    agent: cli-agent
    action: execute_command
    target: bash tests/qa/claude-profile-rotate-room.sh
    timeout: 600000
assertions: []
metadata:
  tags: [cli, rotation, regression]
  priority: high
